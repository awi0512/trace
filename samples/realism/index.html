<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trace Realism Sample</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}#tag{position:fixed;left:12px;top:10px;font:700 13px sans-serif;color:#fff;background:#0008;padding:6px 10px;border-radius:8px}</style></head>
<body><canvas id="c"></canvas><div id="tag">loading…</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","postprocessing":"https://cdn.jsdelivr.net/npm/postprocessing@6.36.0/build/index.js","n8ao":"https://cdn.jsdelivr.net/npm/n8ao@1.10.1/dist/N8AO.js"}}</script>
<script type="module">
const BASE=/localhost/.test(location.hostname)?'':'https://cdn.jsdelivr.net/gh/awi0512/trace@250477424811308376065e7abcffd600e0ba88d6/samples/realism/';
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {EXRLoader} from 'three/addons/loaders/EXRLoader.js';
import * as SU from 'three/addons/utils/SkeletonUtils.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {N8AOPass} from 'n8ao';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const Q=new URLSearchParams(location.search);const AO=Q.get('ao')!=='0',NIGHT=Q.get('night')==='1';
const tag=document.getElementById('tag');
const r=new T.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=NIGHT?.9:.95;
r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();const cam=new T.PerspectiveCamera(45,1,.1,200);
const W=()=>{const w=innerWidth,h=innerHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?62:45;cam.updateProjectionMatrix();comp&&comp.setSize(w,h);};
let comp;
/* HDRI: image-based lighting + reflections */
const pm=new T.PMREMGenerator(r);const hdr=await new EXRLoader().loadAsync(BASE+(NIGHT?'night.exr':'lobby.exr'));const env=pm.fromEquirectangular(hdr).texture;scene.environment=env;scene.background=new T.Color(NIGHT?0x0b0f1c:0x9fb4c8);scene.environmentIntensity=NIGHT?.4:.55;
scene.fog=new T.Fog(scene.background,30,90);
const sun=new T.DirectionalLight(NIGHT?0x9fb2ff:0xfff0d8,NIGHT?.8:2.4);sun.position.set(-8,16,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:60});sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;sun.shadow.radius=4;scene.add(sun);
/* PBR textures (Poly Haven, CC0) */
const TL=new T.TextureLoader();
function pbr(name,rep,tint=0xffffff){const ld=(f,srgb)=>{const t=TL.load(BASE+`tex/${name}_${f}_1k.jpg`);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1]);t.anisotropy=8;if(srgb)t.colorSpace=T.SRGBColorSpace;return t;};
  return new T.MeshStandardMaterial({map:ld('diff',1),normalMap:ld('nor_gl'),roughnessMap:ld('rough'),color:tint,roughness:1,metalness:0});}
const floor=new T.Mesh(new T.PlaneGeometry(40,10),pbr('concrete_floor_02',[10,2.5],0xe8e0d4));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const wall=new T.Mesh(new T.BoxGeometry(40,7,.4),pbr('concrete_wall_008',[8,1.4],0xf2dcb8));wall.position.set(0,3.5,-5.2);wall.receiveShadow=true;scene.add(wall);
const M=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:0},o));
const box=(w,h,d,mat,x,y,z,cast=true)=>{const b=new T.Mesh(new T.BoxGeometry(w,h,d),mat);b.position.set(x,y,z);b.castShadow=cast;b.receiveShadow=true;scene.add(b);return b;};
box(40,.06,.35,M(0xf5c400,{roughness:.5}),0,.03,4.6,false);
box(40,1.2,.4,M(0x6b6358,{roughness:.9}),0,-.6,5.0,false);
const ground=new T.Mesh(new T.PlaneGeometry(60,12),M(0x3a362f,{roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(0,-1.2,11);ground.receiveShadow=true;scene.add(ground);
for(const z of [5.9,7.1])box(60,.12,.1,M(0x9aa3ad,{metalness:.9,roughness:.25}),0,-1.05,z,false);
/* pillars + roof */
for(let x=-16;x<=16;x+=8){box(.35,6,.35,M(0x24533f,{metalness:.5,roughness:.45}),x,3,-2.4);}
box(40,.25,8,M(0x2b3442,{metalness:.6,roughness:.5}),0,6.1,0,false);
/* the train: painted steel with lit windows */
const paint=M(0x1d4d96,{metalness:.25,roughness:.42});const trim=M(0xece5d8,{roughness:.4});
for(let k=0;k<2;k++){const x=-10+k*21;const b=new T.Mesh(new RoundedBoxGeometry(20,3.6,3.2,4,.35),paint);b.position.set(x,1.05,6.5);b.castShadow=true;b.receiveShadow=true;scene.add(b);
  box(20.02,.16,3.22,trim,x,1.45,6.5,false);box(19.6,.5,2.6,M(0x1b1d22,{metalness:.6,roughness:.5}),x,-.95,6.5,false);
  for(const wx of [-7.5,-5.9,5.9,7.5]){const wh=new T.Mesh(new T.CylinderGeometry(.42,.42,.2,20),M(0x2a2a2e,{metalness:.8,roughness:.4}));wh.rotation.x=Math.PI/2;wh.position.set(x+wx,-.95,4.86);scene.add(wh);}
  for(let i=0;i<8;i++){const fr=new T.Mesh(new T.PlaneGeometry(1.28,.92),M(0xcfd3d8,{metalness:.7,roughness:.3}));fr.position.set(x-7+i*2,2.05,4.885);fr.rotation.y=Math.PI;scene.add(fr);
    const lit=i%3!==1;const w=new T.Mesh(new T.PlaneGeometry(1.1,.75),new T.MeshStandardMaterial({color:lit?0x2a2418:0x0a0c12,emissive:lit?0xffc070:0,emissiveIntensity:lit?.55:0,metalness:.1,roughness:.05,envMapIntensity:1.5}));w.position.set(x-7+i*2,2.05,4.88);w.rotation.y=Math.PI;scene.add(w);
    for(const bx of [-.3,.3]){const bar=new T.Mesh(new T.BoxGeometry(.03,.75,.02),M(0x999999,{metalness:.8}));bar.position.set(x-7+i*2+bx,2.05,4.87);scene.add(bar);}}
  for(const dx of [-9.1,9.1]){const d=new T.Mesh(new T.PlaneGeometry(.9,2.3),M(0x173f7c,{metalness:.3,roughness:.5}));d.position.set(x+dx,1.25,4.885);d.rotation.y=Math.PI;scene.add(d);const dw=new T.Mesh(new T.PlaneGeometry(.5,.5),new T.MeshStandardMaterial({color:0x0a0c12,roughness:.05}));dw.position.set(x+dx,2.0,4.88);dw.rotation.y=Math.PI;scene.add(dw);}
  const cv=document.createElement('canvas');cv.width=256;cv.height=64;const g=cv.getContext('2d');g.fillStyle='#f1ece1';g.font='700 40px sans-serif';g.fillText('S'+(k+2)+'  SLEEPER',10,46);const tx=new T.CanvasTexture(cv);tx.colorSpace=T.SRGBColorSpace;
  const lb=new T.Mesh(new T.PlaneGeometry(2,.5),new T.MeshBasicMaterial({map:tx,transparent:true}));lb.position.set(x,.9,4.88);lb.rotation.y=Math.PI;scene.add(lb);}
/* bench + chai stall */
box(3,.12,.6,M(0x4a6fd8,{metalness:.4,roughness:.4}),-6,.5,-4.2);for(const dx of [-1.3,1.3])box(.08,.5,.5,M(0x333333,{metalness:.8,roughness:.3}),-6+dx,.25,-4.2);
box(3.2,1.1,1.4,M(0x2f7a46),8,.55,-4.1);box(3.6,.08,1.8,M(0xc0392b),8,2.3,-3.9);
const bulbs=[];for(let x=-16;x<=16;x+=8){const l=new T.PointLight(0xffd9a0,NIGHT?14:5,12,1.8);l.position.set(x,5.4,0);scene.add(l);const s=new T.Mesh(new T.SphereGeometry(.16,12,8),new T.MeshBasicMaterial({color:0xfff2d0}));s.position.copy(l.position);scene.add(s);}
/* people: Mixamo-rigged humans with real mocap (walk/idle), Quaternius CC0 crowd */
const gl=new GLTFLoader();const [mic,sol,xb,wc,mc]=await Promise.all(['Michelle','Soldier','Xbot','W_Casual','M_Casual'].map(n=>gl.loadAsync((n[1]==='_'?(/localhost/.test(location.hostname)?'models/':'https://cdn.jsdelivr.net/gh/awi0512/trace@5fd242aabf431ba9e9b32de9d0d97b7537661fe4/assets/models/'):BASE+'models/')+n+'.glb')));
function retarget(tgtRoot,srcRoot,clip,fps=30){const bonesOf=r=>{const m={};r.traverse(o=>{if(o.isBone)m[o.name]=o;});return m;};const sB=bonesOf(srcRoot),tB=bonesOf(tgtRoot);
  srcRoot.updateMatrixWorld(true);tgtRoot.updateMatrixWorld(true);const wq=o=>o.getWorldQuaternion(new T.Quaternion());const sRest={},tRest={},sRL={};for(const n in sB){sRest[n]=wq(sB[n]);sRL[n]=sB[n].quaternion.clone();}for(const n in tB)tRest[n]=wq(tB[n]);
  const order=[];tgtRoot.traverse(o=>{if(o.isBone)order.push(o);});const interp={};for(const tr of clip.tracks){const m=tr.name.match(/^(.*)\.quaternion$/);if(m&&sB[m[1]])interp[m[1]]=tr.createInterpolant();}
  const n=Math.max(2,Math.round(clip.duration*fps)),times=new Float32Array(n),vals={};order.forEach(b=>vals[b.name]=new Float32Array(n*4));const tPR=new Map();order.forEach(b=>{if(!(b.parent&&b.parent.isBone))tPR.set(b.name,wq(b.parent));});const q=new T.Quaternion(),G={};
  for(let i=0;i<n;i++){const t=i/(n-1)*clip.duration;times[i]=t;for(const nm in sB){if(interp[nm]){const v=interp[nm].evaluate(t);sB[nm].quaternion.set(v[0],v[1],v[2],v[3]);}else sB[nm].quaternion.copy(sRL[nm]);}srcRoot.updateMatrixWorld(true);
    for(const b of order){const pG=b.parent&&b.parent.isBone?G[b.parent.name]:tPR.get(b.name);let g;if(sB[b.name])g=wq(sB[b.name]).multiply(sRest[b.name].clone().invert()).multiply(tRest[b.name]);else g=pG.clone().multiply(b.quaternion);G[b.name]=g;q.copy(pG).invert().multiply(g);q.toArray(vals[b.name],i*4);}}
  for(const nm in sB)sB[nm].quaternion.copy(sRL[nm]);return new T.AnimationClip(clip.name,clip.duration,order.map(b=>new T.QuaternionKeyframeTrack(b.name+'.quaternion',times,vals[b.name])));}
const xa=Object.fromEntries(xb.animations.map(a=>[a.name.toLowerCase(),a]));const sa=Object.fromEntries(sol.animations.map(a=>[a.name.toLowerCase(),a]));
for(const k in sa){sa[k]=sa[k].clone();sa[k].tracks=sa[k].tracks.filter(t=>!/Hips\.position/.test(t.name));}
const WOMAN={walk:retarget(mic.scene,xb.scene,xa.walk),idle:retarget(mic.scene,xb.scene,xa.idle)};
const prep=(root,h)=>{root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;}});root.updateMatrixWorld(true);const bx=new T.Box3().setFromObject(root);root.scale.multiplyScalar(h/(bx.max.y-bx.min.y));return root;};
prep(mic.scene,1.66);prep(sol.scene,1.8);
const mixers=[],walkers=[];
function person(src,clips,x,z,yaw,mode,tint){const root=SU.clone(src);if(tint)root.traverse(m=>{if(m.isMesh&&!/visor/i.test(m.material.name)){m.material=m.material.clone();m.material.color.multiply(new T.Color(tint));}});
  root.position.set(x,0,z);root.rotation.y=yaw;scene.add(root);const mx=new T.AnimationMixer(root);const a=mx.clipAction(clips[mode]);a.play();a.time=Math.random()*a.getClip().duration;mixers.push(mx);return root;}
const hero=person(mic.scene,WOMAN,-14,1.2,Math.PI/2,'walk');walkers.push({o:hero,v:1.25,x0:-14,x1:14});
person(mic.scene,WOMAN,-3,-3.6,0,'idle',0xd6e4f2);person(mic.scene,WOMAN,9.5,-2.6,-2.4,'idle',0xf2d6d6);
const guard=person(sol.scene,sa,12,2.2,-Math.PI/2,'walk');walkers.push({o:guard,v:-1.1,x0:-12,x1:12});
person(sol.scene,sa,-9,3.6,Math.PI,'idle');
const QN=[wc.scene,mc.scene].map(s=>{s.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;}});return s;});
for(const [x,z,i] of [[3,-1,0],[4,-1.4,1],[-10,-1,1],[14,-3.8,0]]){const p=SU.clone(QN[i]);p.scale.setScalar(.95);p.position.set(x,0,z);p.rotation.y=Math.random()*6;p.traverse(b=>{if(b.isBone&&/UpperArm[LR]/.test(b.name))b.rotation.x-=1.35;});scene.add(p);}
/* post: N8AO (ambient occlusion) + soft bloom */
comp=new EffectComposer(r);comp.addPass(new RenderPass(scene,cam));
if(AO){const ao=new N8AOPass(scene,cam,innerWidth,innerHeight);ao.configuration.aoRadius=1.6;ao.configuration.distanceFalloff=.6;ao.configuration.intensity=3;ao.setQualityMode('Low');ao.configuration.gammaCorrection=false;comp.addPass(ao);}
comp.addPass(new UnrealBloomPass(new T.Vector2(innerWidth,innerHeight),.25,.5,.9));comp.addPass(new OutputPass());
addEventListener('resize',W);W();
const camOff=new T.Vector3(...(Q.get('cam')||'3.2,2.6,-4.4').split(',').map(Number));
const clk=new T.Clock();let fps=0,fr=0,ft=0;
function loop(){const dt=Math.min(.05,clk.getDelta());for(const m of mixers)m.update(dt);
  for(const w of walkers){w.o.position.x+=w.v*dt;if(w.o.position.x>w.x1||w.o.position.x<w.x0){w.v=-w.v;w.o.rotation.y+=Math.PI;}}
  const t=hero.position;cam.position.lerp(new T.Vector3(t.x+camOff.x,camOff.y,t.z+camOff.z),Math.min(1,dt*4));cam.lookAt(t.x+.5,1.1,t.z);
  sun.position.set(t.x-8,16,t.z+10);sun.target.position.copy(t);sun.target.updateMatrixWorld();
  comp.render();fr++;ft+=dt;if(ft>1){fps=fr/ft;fr=0;ft=0;tag.textContent=`REALISM SAMPLE · ${fps.toFixed(0)} fps${AO?' · AO':''}${NIGHT?' · night':''}`;}requestAnimationFrame(loop);}
window.__seek=s=>{for(const m of mixers)m.update(s);for(const w of walkers)w.o.position.x+=w.v*s;cam.position.set(hero.position.x+camOff.x,camOff.y,hero.position.z+camOff.z);};
window.READY=1;loop();
</script></body></html>
