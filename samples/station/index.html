const hemi=new T.HemisphereLight(0xdfefff,0x6b5f4f,1.1);S.add(hemi);const sun=new T.DirectionalLight(0xfff1d8,2.4);sun.position.set(60,80,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-90,right:90,top:60,bottom:-60,near:10,far:250});sun.shadow.bias=-.0005;sun.target.position.set(10,0,5);S.add(sun);S.add(sun.target);
const PL=[];for(let i=0;i<7;i++){const l=new T.PointLight(0xffc98a,0,34,1.3);S.add(l);PL.push(l);}
let night=false;
function setMode(n){night=n;document.getElementById('day').classList.toggle('on',!n);document.getElementById('night').classList.toggle('on',n);
  S.background=n?skyNight:skyDay;S.fog=n?new T.Fog(0x141a2a,35,170):new T.Fog(0xd7e6f2,120,420);hemi.intensity=n?.42:1.1;sun.intensity=n?0:2.4;R.toneMappingExposure=n?1.6:1.05;
  LAMPS.forEach(l=>{l.m.material.emissiveIntensity=n?2.2:0;});const pick=LAMPS.filter(l=>l.x>-30).filter((l,i)=>i%2===0).slice(0,PL.length);PL.forEach((l,i)=>{const q=pick[i];if(q){l.position.set(q.x,5.2,q.z);l.intensity=n?70:0;}});
  [T1,T2].forEach(t=>t.userData.hl.forEach(h=>{h.material.color.set(n?0xfff6d0:0xd8d2c0);}));}
setMode(false);
document.getElementById('day').onclick=()=>setMode(false);document.getElementById('night').onclick=()=>setMode(true);
document.getElementById('auto').onclick=e=>{ctl.autoRotate=!ctl.autoRotate;e.target.classList.toggle('on',ctl.autoRotate);};
document.getElementById('walk').onclick=()=>{cam.position.set(76,2.7,2.6);ctl.target.set(50,2.3,1.2);ctl.autoRotate=false;document.getElementById('auto').classList.remove('on');};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
/* ---------- loop ---------- */
const clk=new T.Clock();let trainT=0;
R.setAnimationLoop(()=>{const dt=Math.min(.05,clk.getDelta()),t=clk.elapsedTime;trainT+=dt;
  for(const p of PEOPLE){if(p.walk){p.g.position.x+=p.dir*p.sp*dt;if(p.g.position.x>72||p.g.position.x<-48)p.dir*=-1;p.g.rotation.y=p.dir>0?Math.PI/2:-Math.PI/2;p.g.position.y=1+Math.abs(Math.sin(t*7+p.ph))*.06;}}
  const ph=trainT%44;T2.position.x=ph<12?64-170*Math.pow(1-ph/12,2):ph<32?64:64+Math.pow(ph-32,2)*1.6;
  SIG[1].material.color.set(ph>28&&ph<40?0x2aff6a:0xff2a2a);
  ctl.update();R.render(S,cam);});
document.getElementById('load').remove();
</script>
