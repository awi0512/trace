function retarget(tgtRoot,srcRoot,clip,fps=30){const bonesOf=r=>{const m={};r.traverse(o=>{if(o.isBone)m[o.name]=o;});return m;};const sB=bonesOf(srcRoot),tB=bonesOf(tgtRoot);

async function loadChars(){const gl=new GLTFLoader();const [mic,sol,xb]=await Promise.all(['Michelle','Soldier','Xbot'].map(n=>gl.loadAsync(MODELS+n+'.glb')));

let hero,heroMx,heroAct,cops=[];
function spawnHero(){hero=new T.Group();scene.add(hero);const m=SU.clone(CH.hero);m.rotation.y=Math.PI;hero.add(m);hero.model=m;heroMx=new T.AnimationMixer(m);heroAct={run:heroMx.clipAction(CH.heroRun),idle:heroMx.clipAction(CH.heroIdle)};heroAct.run.play();
  hero.mats=[];m.traverse(o=>{if(o.isMesh){o.material=o.material.clone();hero.mats.push(o.material);}});
  for(let i=0;i<2;i++){const c=new T.Group();scene.add(c);const cm=SU.clone(CH.cop);cm.rotation.y=Math.PI;c.add(cm);const mx=new T.AnimationMixer(cm);const a=mx.clipAction(CH.copRun);a.play();a.time=i*.3;c.mx=mx;
    const light=mesh(new T.SphereGeometry(.09,8,6),new T.MeshBasicMaterial({color:i?0x3d6fff:0xff2d2d}),0,2.05,0,c,false);c.light=light;cops.push(c);}}
/* ---------- game state ---------- */
const G={on:false,z:0,v:9,lane:1,x:0,y:0,vy:0,slide:0,heat:20,score:0,cash:0,darts:3,stun:0,disgT:0,best:+(localStorage.getItem('trace_chase_best')||0),near:0,nextSpawn:-30,t:0,cctvN:0,shopN:0,tint:0};
function resetWorld(){for(const o of OB)scene.remove(o.g);OB.length=0;for(const p of PICK)scene.remove(p.m);PICK.length=0;segs.forEach((g,i)=>g.position.z=-i*SEG);Object.assign(G,{z:0,v:9,lane:1,x:0,y:0,vy:0,slide:0,heat:20,score:0,cash:0,darts:3,stun:0,disgT:0,near:0,nextSpawn:-30,t:0,cctvN:0,shopN:0});$('#dn').textContent=3;}
function spawnRow(z){const d=Math.min(1,-G.z/1500);const roll=Math.random();const free=[0,1,2];
  if(roll<.1+d*.05){addCCTV(z);addCoins(z-4,pick([0,1,2]),5);return;}
  if(roll<.18){const ln=pick([0,1,2]);addShop(z,ln);free.splice(free.indexOf(ln),1);addCoins(z-3,pick(free),4);return;}
  const n=Math.random()<.35+d*.35?2:1;const lanes=[0,1,2].sort(()=>Math.random()-.5).slice(0,n);
  for(const ln of lanes){const k=Math.random();if(k<.32)addCart(z,ln);else if(k<.55)addCow(z,ln);else if(k<.78)addBar(z,ln);else addCrowd(z,ln);}
  const open=[0,1,2].filter(l=>!lanes.includes(l));if(open.length&&Math.random()<.7)addCoins(z-2,pick(open),6,Math.random()<.3);}
/* ---------- input: swipe + keys ---------- */
let t0=null;addEventListener('pointerdown',e=>{if(e.target.id==='dart')return;t0=[e.clientX,e.clientY,performance.now()];});
addEventListener('pointerup',e=>{if(!t0||!G.on)return;const dx=e.clientX-t0[0],dy=e.clientY-t0[1];t0=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();else slide();});
addEventListener('pointermove',e=>{if(!t0||!G.on)return;const dx=e.clientX-t0[0],dy=e.clientY-t0[1];if(Math.max(Math.abs(dx),Math.abs(dy))>40){t0=null;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();else slide();}});
addEventListener('keydown',e=>{if(!G.on)return;if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);if(e.code==='ArrowRight'||e.code==='KeyD')move(1);if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space')jump();if(e.code==='ArrowDown'||e.code==='KeyS')slide();if(e.code==='KeyF')dart();});
function move(d){const n=clamp(G.lane+d,0,2);if(n!==G.lane){G.lane=n;SFX.lane();}}
function jump(){if(G.y<.05&&G.stun<=0){G.vy=8.2;G.slide=0;SFX.jump();}}
function slide(){if(G.stun>0)return;G.slide=.75;if(G.y>0)G.vy=-14;SFX.slide();}
$('#dart').addEventListener('pointerdown',e=>{e.stopPropagation();dart();});
function dart(){if(!G.on||G.darts<=0)return;if(G.heat<35){pop('Police door hai','#fff');return;}G.darts--;$('#dn').textContent=G.darts;G.heat=Math.max(0,G.heat-35);SFX.dart();pop('DART! 💉','#2fe39a');cops[0].stumble=1.2;}
/* ---------- feedback ---------- */
function cap(t,ms=3200){const c=$('#cap');c.textContent=t;c.style.opacity=1;clearTimeout(cap.t);cap.t=setTimeout(()=>c.style.opacity=0,ms);}
function notif(html,ms=3800){const n=$('#notif');n.innerHTML=html;n.style.translate='-50% 0';SFX.coin();if(navigator.vibrate)navigator.vibrate([60,40,60]);clearTimeout(notif.t);notif.t=setTimeout(()=>n.style.translate='-50% -140%',ms);}
let popT=0;function pop(t,col='#ffd166'){const p=$('#pop');p.textContent=t;p.style.color=col;p.style.opacity=1;p.style.transform='scale(1.15)';popT=.8;setTimeout(()=>p.style.transform='scale(1)',120);}
function flash(col='#fff',o=.6){const f=$('#flash');f.style.background=col;f.style.opacity=o;setTimeout(()=>f.style.opacity=0,80);}
let shake=0;
function hint(t,ms=2600){const h=$('#hint');h.textContent=t;h.style.opacity=1;clearTimeout(hint.t);hint.t=setTimeout(()=>h.style.opacity=0,ms);}
/* ---------- loop ---------- */
const clk=new T.Clock();
function frame(){const dt=Math.min(.05,clk.getDelta());if(G.on)tick(dt);else if(hero){heroMx.update(dt);}
  for(const m of mixers)m.update(dt);render(dt);requestAnimationFrame(frame);}
const BEATS=[[.5,()=>cap('GIRGAON · GANPATI VISARJAN KI RAAT')],[5,()=>notif('📱 <b>NEWS ALERT</b><br>Chowpatty pe guard ka qatl. CCTV mein sandigdh: <b style="color:#ff6a5a">laal dupatta</b>.',4500)],
  [11,()=>cap('Wo wahan thi hi nahi. Par camera kehta hai, thi.')],[17,()=>notif('💬 <b>Didi</b><br>Bhaago. Gali ke ant mein ek taxi khadi hai. CCTV ke neeche mat aana.',4500)],
  [26,()=>cap('📻 "Saare unit: laal dupatta, Girgaon. Pakdo use."')],[34,()=>notif('💬 <b>Didi</b><br>Kapdon ki dukaan se guzro. Camera tumhara dupatta dhoondh raha hai.',4200)],
  [42,()=>cap('📻 Rana: "Chhaya? Naya naam. Dekhte hain kitne nishaan chhodti hai."',4000)],[48,()=>{cap('🚕 Taxi! Bas thoda aur…',3000);spawnTaxi();}]];
let taxi=null,bi=0,dholT=0;
function spawnTaxi(){taxi=new T.Group();taxi.position.set(LANES[1],0,G.z-55);scene.add(taxi);mesh(new RoundedBoxGeometry(1.9,1.1,4,2,.2),M(0x111111),0,.75,0,taxi);mesh(new RoundedBoxGeometry(1.9,.5,4.02,2,.1),M(0xf5c400),0,1.0,0,taxi);mesh(new RoundedBoxGeometry(1.6,.7,2,2,.2),M(0xf5c400),0,1.6,.2,taxi);
  for(const x of [-.95,.95])for(const z of [-1.3,1.3]){const w=mesh(new T.CylinderGeometry(.35,.35,.25,14),M(0x111111),x,.35,z,taxi);w.rotation.z=Math.PI/2;}mesh(new T.PlaneGeometry(1,.3),new T.MeshBasicMaterial({map:signTex('TAXI','#111','#ffd166')}),0,2.0,1.25,taxi);
  for(const o of OB)if(o.z<G.z-40){scene.remove(o.g);o.done=true;}}
function dhol(dt){if(!AC||!STORY)return;dholT-=dt;if(dholT>0)return;dholT=.36;const k=(dhol.n=(dhol.n||0)+1)%4,t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(k%2?150:85,t);o.frequency.exponentialRampToValueAtTime(45,t+.15);g.gain.setValueAtTime(k===0?.35:.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.25);}
function tick(dt){G.t+=dt;if(STORY){dhol(dt);while(bi<BEATS.length&&G.t>=BEATS[bi][0]){BEATS[bi][1]();bi++;}if(taxi&&G.z<=taxi.position.z+3.5)return storyDone();}
  G.v=Math.min(21,9+G.t*.12)*(G.stun>0?.45:1);G.z-=G.v*dt;G.score+=G.v*dt*(1+G.cctvN*0+0);
  G.x=lerp(G.x,LANES[G.lane],Math.min(1,dt*14));G.vy-=26*dt;G.y=Math.max(0,G.y+G.vy*dt);if(G.y===0)G.vy=Math.max(0,G.vy);G.slide=Math.max(0,G.slide-dt);G.stun=Math.max(0,G.stun-dt);G.disgT=Math.max(0,G.disgT-dt);
  G.heat=clamp(G.heat-dt*(G.disgT>0?7:2.2)+(G.stun>0?6*dt:0),0,100);
  // recycle street segments
  for(const g of segs){if(g.position.z>G.z+SEG*1.2){g.position.z-=SEG*NSEG;}}
  // spawn rows ahead
  while(G.nextSpawn>G.z-90&&!(STORY&&G.t>46)){spawnRow(G.nextSpawn);G.nextSpawn-=rnd(11,17)*(1-Math.min(.35,G.t/400));}
  // collisions
  for(let i=OB.length-1;i>=0;i--){const o=OB[i];if(o.z>G.z+8){scene.remove(o.g);OB.splice(i,1);continue;}
    if(o.done)continue;const dz=Math.abs(o.z-G.z);if(dz>o.len*.5+.35)continue;
    if(o.kind==='cctv'){o.done=true;if(G.disgT>0){pop('Naya bhes: CCTV fail 😎','#2fe39a');}else{G.heat=Math.min(100,G.heat+14);G.cctvN++;SFX.snap();flash('#fff',.5);pop('📸 CCTV!','#ff6a5a');}continue;}
    if(o.lane!==G.lane){if(!o.near&&dz<.6&&Math.abs(LANES[o.lane]-G.x)<2.6&&o.kind!=='shop'&&o.kind!=='crowd'){o.near=true;G.near++;G.score+=25;SFX.near();if(G.near%3===0)pop('CLOSE! +75','#ffd166');}continue;}
    if(o.kind==='shop'){o.done=true;G.disgT=9;G.heat=Math.max(0,G.heat-30);SFX.disg();flash('#b48cff',.5);pop('👗 BHES BADLA!','#c9a8ff');G.tint=(G.tint+1)%4;const cols=[0xffffff,0xff9ad5,0x9ad5ff,0xb6ff9a];hero.mats.forEach(m=>m.color.set(cols[G.tint]));G.score+=100;continue;}
    if(o.kind==='crowd'){o.done=true;G.stun=Math.max(G.stun,.35);G.heat=Math.max(0,G.heat-12);pop('Bheed mein gum 👥','#fff');continue;}
    const cleared=(o.kind==='low'&&G.y>1.05)||(o.kind==='high'&&G.slide>0);
    if(cleared){o.done=true;G.score+=40;continue;}
    o.done=true;G.stun=.9;G.heat=Math.min(100,G.heat+(o.kind==='tall'?45:32));shake=.45;SFX.hit();flash('#e0242b',.35);pop(o.kind==='tall'?'GAAY! 🐄':'THOKAR!','#ff4040');if(navigator.vibrate)navigator.vibrate(80);}
  for(let i=PICK.length-1;i>=0;i--){const p=PICK[i];p.m.rotation.z+=dt*5;if(p.z>G.z+6){scene.remove(p.m);PICK.splice(i,1);continue;}if(p.lane===G.lane&&Math.abs(p.z-G.z)<.8&&Math.abs(p.y-(G.y+1))<1.1){G.cash+=10;scene.remove(p.m);PICK.splice(i,1);SFX.coin();}}
  if(G.heat>=100)return caught();
  if(Math.random()<dt*(G.heat/100)*.8)SFX.siren();if(Math.random()<dt*G.v*.25)SFX.step();
  // hero pose
  hero.position.set(G.x,G.y,G.z);hero.model.rotation.x=G.slide>0?-.9:0;hero.model.position.y=G.slide>0?-.35:0;hero.model.rotation.z=(LANES[G.lane]-G.x)*-.12;heroAct.run.timeScale=G.v/9;heroMx.update(dt*(G.stun>0?.5:1));
  // cops: distance follows heat
  const gap=lerp(16,1.4,G.heat/100);cops.forEach((c,i)=>{c.stumble=Math.max(0,(c.stumble||0)-dt);const tz=G.z+gap+i*1.6+(c.stumble?3:0);c.position.z=lerp(c.position.z,tz,Math.min(1,dt*3));c.position.x=lerp(c.position.x,G.x+(i?1.1:-1.1)*.8,dt*3);c.mx.update(dt*G.v/8);c.light.material.color.set(Math.floor(G.t*6)%2?0xff2d2d:0x3d6fff);});
  $('#score').textContent=Math.floor(G.score);$('#cash').textContent='₹'+G.cash;$('#heat i').style.width=G.heat+'%';$('#vig').style.boxShadow=`inset 0 0 160px 40px rgba(224,36,43,${Math.max(0,(G.heat-55)/100)})`;
  if(popT>0){popT-=dt;if(popT<=0)$('#pop').style.opacity=0;}}
function render(dt){if(hero){const k=G.on?Math.min(1,G.v/21):0;cam.fov=lerp(cam.fov,62+k*14,dt*3);cam.updateProjectionMatrix();
    const sx=shake>0?(Math.random()-.5)*shake:0,sy=shake>0?(Math.random()-.5)*shake:0;shake=Math.max(0,shake-dt);
    cam.position.set(G.x*.55+sx,3.4+G.y*.4+sy,G.z+6.2);cam.lookAt(G.x*.7,1.3+G.y*.3,G.z-6);sun.position.set(G.x-6,14,G.z+8);sun.target.position.set(G.x,0,G.z-6);}
  r.render(scene,cam);}
function storyDone(){G.on=false;$('#dart').style.display='none';const o=$('#over');$('#oT').textContent='BACH GAYI!';$('#oS').innerHTML='Taxi mein. Dupatta bag mein, chehra neeche.<br><b style="color:#ffd166">Agla padaav: Mumbai Airport ✈</b>';$('#again').textContent='CHALO →';o.hidden=false;
  try{localStorage.setItem('trace_open_seen','1');}catch(e){}$('#again').onclick=()=>{location.href=NEXT;};}
function caught(){if(STORY){G.on=false;$('#oT').textContent='PAKDI GAYI!';$('#oS').innerHTML='Fir se koshish karo. Kapdon ki dukaan aur bheed tumhare dost hain.';$('#over').hidden=false;$('#dart').style.display='none';return;}G.on=false;SFX.hit();SFX.siren();if(navigator.vibrate)navigator.vibrate([120,60,120]);const sc=Math.floor(G.score)+G.cash;const nb=sc>G.best;if(nb){G.best=sc;try{localStorage.setItem('trace_chase_best',sc);}catch(e){}}
  $('#oT').textContent='PAKDI GAYI!';$('#oS').innerHTML=`Score <b>${sc}</b> · ₹${G.cash} · ${Math.floor(-G.z)} m · ${G.cctvN} CCTV photo<br>${nb?'<b style="color:#ffd166">NAYA RECORD! 🔥</b>':`Best: ${G.best}`}`;$('#over').hidden=false;$('#dart').style.display='none';}
function start(){bi=0;if(taxi){scene.remove(taxi);taxi=null;}if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}AC&&AC.resume();resetWorld();hero.position.set(0,0,0);cops.forEach((c,i)=>c.position.set(i?1:-1,0,14));$('#over').hidden=true;$('#start').hidden=true;$('#dart').style.display='';G.on=true;
  hint('Swipe: ← → gali · ↑ koodo · ↓ jhuko');}
if(STORY){$('#start').querySelector('h1').textContent='VISARJAN KI RAAT';$('#start').querySelectorAll('p')[1].innerHTML='📸 CCTV se bacho · 👗 kapdon ki dukaan = naya bhes · 👥 bheed mein chhupo';$('#go').textContent='BHAAGO!';}
$('#go').onclick=start;$('#again').onclick=start;$('#over').addEventListener('pointerup',e=>{if(e.target.id!=='again'&&!$('#over').hidden&&performance.now()-(caught.t||0)>600)start();});
/* boot */
await loadChars();spawnHero();cops.forEach((c,i)=>c.position.set(i?1:-1,0,14));for(let z=-30;z>-120;z-=14)spawnRow(z);G.nextSpawn=-120;$('#loadp').textContent='';
window.__G=G;window.__start=start;window.READY=1;frame();
</script></body></html>
