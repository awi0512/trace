<style>
/* Layout: full-screen stylized 3D sandbox. Top-left HUD (timer, alert state, objective), top-right minimap,
   bottom-left joystick, bottom-right action/run buttons. Story beats and results cut to noir comic panels. */
:root{
  --ink:#151a33; --panel:rgba(255,255,255,.96); --panelInk:#1d2340; --dim:#6b7190;
  --accent:#f5b82e; --red:#e0242b; --good:#2fa37a; --paper:#f1ece1; --noir:#0d0d0d; --sus:#ff9f1c;
  --display:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --type:'Special Elite','Courier New',monospace; --sfx:'Bangers',Impact,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:#fff;font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(224,36,43,.55));opacity:0;transition:opacity .25s}

#hud{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(14px,env(safe-area-inset-left,0px));right:calc(max(14px,env(safe-area-inset-right,0px)) + 130px);display:flex;flex-direction:column;gap:7px;pointer-events:none}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(21,26,51,.82);border-radius:999px;padding:5px 11px;font-family:var(--display);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip.warn{background:var(--red)}
#state.calm{background:rgba(47,163,122,.9)} #state.sus{background:var(--sus);color:#241400} #state.alert{background:var(--red);animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#obj{align-self:flex-start;max-width:min(400px,100%);background:var(--panel);color:var(--panelInk);border-radius:14px;padding:7px 11px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:auto;cursor:pointer}
#obj b{display:block;font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.tools{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
.tb{background:rgba(21,26,51,.82);border:0;border-radius:999px;padding:6px 11px;font-family:var(--display);font-weight:700;font-size:12.5px;cursor:pointer}
#map{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(14px,env(safe-area-inset-right,0px));width:118px;height:84px;border-radius:10px;background:rgba(21,26,51,.85);border:2px solid rgba(255,255,255,.2)}
#toasts{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 232px);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--noir);color:var(--paper);font-family:var(--type);font-size:13px;padding:7px 12px;border-left:4px solid var(--red);animation:tin .25s ease-out}
.toast.info{border-left-color:var(--accent)} .toast.good{border-left-color:var(--good)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

#joy{position:fixed;z-index:4;width:116px;height:116px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(21,26,51,.35);transform:translate(-50%,-50%);pointer-events:none;left:calc(max(16px,env(safe-area-inset-left,0px)) + 72px);top:calc(100% - env(safe-area-inset-bottom,0px) - 108px)}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.8)}
#joy::after{content:'MOVE';position:absolute;left:0;right:0;top:100%;margin-top:5px;text-align:center;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.8)}
#pads{position:fixed;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.pad{border:0;border-radius:999px;cursor:pointer;font-family:var(--display);font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.3);touch-action:none}
#act{background:var(--accent);color:#1d1a10;padding:14px 18px;font-size:16px;max-width:60vw;line-height:1.15}
#run{width:66px;height:66px;background:#fff;color:var(--panelInk);font-size:14px}
#run.on{background:var(--red);color:#fff}
#prog{position:fixed;z-index:6;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);width:min(78vw,320px);text-align:center;font-family:var(--display);font-weight:700;font-size:13px;text-shadow:0 2px 6px #000}
#prog .bar{height:9px;border-radius:5px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:5px}
#prog .bar i{display:block;height:100%;width:0;background:var(--accent)}
#prog.seen .bar i{background:var(--red)}
body.talking #pads,body.talking #joy{visibility:hidden}

#dlg{position:fixed;z-index:8;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
#dlg .in{width:min(100%,560px);display:flex;flex-direction:column;gap:8px}
#dbox{background:var(--panel);color:var(--panelInk);border-radius:18px;padding:12px 16px 14px;cursor:pointer;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35);min-height:70px}
#who{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
#who.narr{color:var(--dim)}
#line{font-size:16px;white-space:pre-line}
#line.narr{font-style:italic;color:#3c4262}
#next{position:absolute;right:14px;bottom:6px;font-size:12px;color:var(--dim);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.3}}
#timer{height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
#timer i{display:block;height:100%;background:var(--accent);transform-origin:left}
#choices{display:flex;flex-direction:column;gap:7px}
.choice{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;background:#fff;color:var(--panelInk);border:2px solid transparent;border-radius:14px;padding:10px 14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.choice:hover{border-color:var(--accent)}
.choice .lab{font-weight:600}.choice .sub{font-size:13px;color:var(--dim)}.choice .tag{font-family:var(--display);font-weight:700;font-size:13px;color:var(--red)}
.choice:disabled{opacity:.45}
.tb:focus-visible,.pad:focus-visible,.choice:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#comic{position:fixed;inset:0;z-index:20;background:var(--noir);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#comic .pop{display:flex;justify-content:center;width:100%;max-width:900px;animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
#comic svg{width:100%;max-height:80vh;height:auto;display:block}
#comic .tap{font-family:var(--type);color:var(--paper);opacity:.7;font-size:13px}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sfx{font-family:var(--sfx)} .typ{font-family:var(--type)}

#sheet{position:fixed;inset:0;z-index:22;background:rgba(13,13,13,.95);display:grid;place-items:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:min(100%,460px);display:flex;flex-direction:column;gap:12px;user-select:text;-webkit-user-select:text}
.card h1{margin:0;font-family:var(--sfx);font-size:clamp(64px,20vw,104px);letter-spacing:.12em;color:var(--paper);line-height:.9;font-weight:400}
.card h2{margin:0;font-family:var(--sfx);font-size:34px;letter-spacing:.04em;color:var(--paper);line-height:1;font-weight:400}
.card p{margin:0;color:#d9d4c8}
.eyebrow{font-family:var(--type);color:var(--accent);font-size:13px;letter-spacing:.06em}
.dossier{background:var(--paper);color:#222;padding:14px 16px;font-family:var(--type);font-size:14px;transform:rotate(-.8deg);box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
.dossier h3{margin:0;color:var(--red);font-family:var(--sfx);font-size:26px;letter-spacing:.05em;font-weight:400}
.dossier dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px}
.dossier dt{color:#776f60;font-size:12px;text-transform:uppercase;padding-top:2px}
.dossier dd{margin:0}
.dossier .stampx{align-self:flex-start;border:3px double var(--red);color:var(--red);font-family:var(--sfx);font-size:18px;padding:2px 10px;transform:rotate(-6deg)}
.btn{display:block;text-align:center;text-decoration:none;background:var(--red);color:#fff;border:0;padding:12px 16px;font-family:var(--sfx);font-size:25px;letter-spacing:.06em;cursor:pointer;box-shadow:4px 4px 0 var(--paper)}
.btn.alt{background:#1d2340}
.btn:disabled{opacity:.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#1b1b1b;padding:8px 10px;border-left:3px solid var(--accent);min-width:0}
.stat span{display:block;font-family:var(--type);font-size:11px;color:#a9a397;text-transform:uppercase}
.stat b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.heat{height:10px;background:#2a2a2a;overflow:hidden}.heat i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--red))}
.traces{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--type);font-size:13px}
.traces li{background:#1b1b1b;border-left:4px solid var(--red);padding:6px 10px}
.traces li.ok{border-left-color:var(--good)}
.shop{display:flex;flex-direction:column;gap:8px}
#splash{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;gap:8px;cursor:pointer;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 56px) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(10,12,24,.15),transparent 35%,rgba(10,12,24,.88))}
#splash h1{margin:0;font-family:var(--sfx);font-weight:400;font-size:clamp(84px,26vw,150px);letter-spacing:.14em;text-indent:.14em;line-height:.85;color:var(--paper);text-shadow:0 8px 30px rgba(0,0,0,.6);animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
#splash .tag{font-family:var(--type);color:var(--accent);font-size:15px}
#splash .tapgo{margin-top:20px;font-family:var(--display);font-weight:700;letter-spacing:.32em;font-size:14px;animation:blink 1.4s infinite}
#lbls .lbl{position:fixed;z-index:14;transform:translate(-50%,-100%);font-family:var(--sfx);font-size:18px;letter-spacing:.08em;padding:2px 10px;background:var(--noir);color:var(--paper);border-left:4px solid var(--accent);pointer-events:none;white-space:nowrap}
#lbls .lbl.cam{border-left-color:var(--red)} #lbls .lbl.tgt{border-left-color:var(--good)}
#banner{position:fixed;z-index:6;left:50%;translate:-50% 0;top:calc(env(safe-area-inset-top,0px) + 92px);width:auto;max-width:min(92vw,520px);white-space:normal;text-align:center;line-height:1.25;background:var(--accent);color:#1d1a10;font-family:var(--display);font-weight:700;font-size:15px;line-height:1.3;padding:7px 14px;border-radius:999px;box-shadow:5px 5px 0 var(--noir);text-align:center;pointer-events:none;animation:pop .3s}
#banner.danger{background:var(--red);color:#fff;animation:bpulse 1s infinite}
@keyframes bpulse{50%{scale:1.04}}
body.banner #obj,body.banner .tools{visibility:hidden}
body.banner #snaps{top:calc(env(safe-area-inset-top,0px) + 136px)}
#flash{position:fixed;inset:0;z-index:7;background:#fff;opacity:0;pointer-events:none}
#snaps{position:fixed;z-index:5;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 104px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.snap{background:#f4f1ea;padding:4px 4px 10px;box-shadow:0 4px 12px rgba(0,0,0,.45);transform:rotate(var(--r,3deg))}
.snap img{display:block;width:62px;height:46px;object-fit:cover}
#snaps .count{align-self:flex-end;background:var(--noir);color:var(--paper);font-family:var(--display);font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px}
.snap b{display:block;font-family:var(--type);font-weight:400;font-size:9px;color:#333;margin-top:3px}
.snap.big{position:fixed;left:50%;top:40%;z-index:9;transform:translate(-50%,-50%) rotate(-3deg);animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
.snap.big img{width:min(72vw,300px);height:auto}.snap.big b{font-size:13px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}.gallery .snap img{width:100%;height:auto}
details{font-size:13px}summary{cursor:pointer;color:#7a4b1a}
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--noir);color:var(--paper);font-family:var(--type)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<script type="module">
import * as T from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* TRACE · Chapter 4 · Bandar ka Akhri Jahaz (built by scripts/assemble-port.py from src/train.js + src/port-parts.js)
   Original header: TRACE · Level 2 · Raat ki Gaadi
   Part 1: night platform at Mumbai Terminus (reach your coach before departure).
   Part 2: inside the moving sleeper train (TC ticket checks, RPF boards at a station,
   hide on berths, do the job, then jump off while the train slows at a signal). */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)], chance=p=>Math.random()<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};
const TIMEOUT=Symbol('t');
function vib(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

/* ---------------- career + cover story (shared with the airport) ---------------- */
const SAVE_KEY='trace_career_v1';
const CAREER=(()=>{try{const c=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(c&&typeof c.money==='number')return c;}catch(e){}return {money:150000,missions:0,wins:0,heat:0,best:0};})();
const saveCareer=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(CAREER));}catch(e){}};
/* ---------------- story campaign "Mumbai se Bhaago" (shared by every chapter page) ---------------- */
const CKEY='trace_campaign';
function getC(){try{return JSON.parse(localStorage.getItem(CKEY)||'null');}catch(e){return null;}}
function saveC(c){try{localStorage.setItem(CKEY,JSON.stringify(c));}catch(e){try{c.photos=(c.photos||[]).slice(-2);localStorage.setItem(CKEY,JSON.stringify(c));}catch(e2){}}}
function newStory(){saveC({active:true,ch:1,next:'cab.html',log:[],photos:[],al:{},alerts:0,started:Date.now()});}
function storyRecord(ch,traces,photos,alerts,label,next){const C=getC();if(!C||!C.active)return null;
  C.log=(C.log||[]).filter(x=>x.ch!==ch).concat(traces.map(t=>({ch,text:t.text})));
  C.photos=(C.photos||[]).filter(p=>p.ch!==ch).concat(photos.slice(0,1).map(p=>({ch,url:p.url,label:label+' '+p.id})));
  C.al=Object.assign({},C.al||{},{[ch]:alerts});C.alerts=Object.values(C.al).reduce((a,b)=>a+b,0);
  if(next){C.ch=ch+1;C.next=next;}saveC(C);return C;}
/*RUN-BEGIN*/
/* ===================== ESCAPE MODE: endless run + Inspector Rana (shared by every zone page) =====================
   Edit src/run.js only: scripts/sync-run.py copies this block into index.html and src/train.js. */
const RKEY='trace_run',HKEY='trace_hunter';
const ZONES={airport:{url:'index.html#bhaag',name:'Airport',sub:'Terminal, security, boarding gates',col:'#e0242b'},train:{url:'train.html',name:'Night Train',sub:'3 platforms, overbridge, sleeper train',col:'#1f4f9a'},
  bus:{url:'bus.html',name:'Highway Bus',sub:'Bus stand, dhaba, police checkpost',col:'#d35400'},port:{url:'port.html',name:'Docks',sub:'Containers, searchlights, cargo ship',col:'#2fa37a'},
  plane:{url:'flight.html',name:'Flight',sub:'Cabin, air marshal, immigration',col:'#6d4bd6',special:true}};
const GROUND=Object.keys(ZONES).filter(z=>!ZONES[z].special);
const MODS={blackout:{name:'Blackout',d:'Power cuts on and off. CCTV goes dark, guards see less.',good:true},
  traitor:{name:'Traitor',d:'Someone will sell your look to the police. No idea when.'},
  rush:{name:'Rush',d:'30% less time.'},
  alert:{name:'High alert',d:'Guards see further.'},
  patrol:{name:'Rana on site',d:'Inspector Rana is patrolling this zone himself. He knows your old photo.'}};
const HABITS={run:{t:'bhaagti hai',c:'Guards now suspect runners instantly.'},crowd:{t:'bheed mein chhupti hai',c:'Guards now watch crowds closely.'},
  disguise:{t:'kapde badalti hai',c:'A new look reaches every radio in 30 seconds.'},dart:{t:'dart chalaati hai',c:'Darted guards wake up faster.'},
  cams:{t:'CCTV ke saamne aati hai',c:'Cameras see further.'},flight:{t:'hamesha flight pakadti hai',c:'Airports get extra eyes.'},upi:{t:'UPI se paise deti hai',c:'He reads bank records: phone pings come faster.'}};
function rjson(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function wjson(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

  const off='Senior officer';

  await say(off,'Shuru se batao. Mumbai se Dubai tak. Hum sab jaante hain, phir bhi tumhare muh se sunna hai.');
  const items=[];photos.slice(0,2).forEach(p=>items.push({kind:'photo',label:p.label,url:p.url}));
  for(const e of log){if(items.length>=4)break;if(/UPI|app|TC|Conductor|naam|CCTV|record|scan/i.test(e.text))items.push({kind:'text',label:e.text});}
  if(!items.length)await say(off,'Ajeeb baat hai. Tumhare khilaaf hamare paas kuch bhi nahi hai. Na photo, na payment.');
  for(const it of items.slice(0,3)){
    if(it.kind==='photo'){const s=sheet(`<div class="eyebrow">SABOOT · ${esc(it.label)}</div><div class="snap" style="--r:-2deg;align-self:center"><img alt="CCTV saboot" src="${it.url}" style="width:min(72vw,300px);height:auto"></div><button class="btn" id="ok" type="button">Dekh liya</button>`);await new Promise(r=>s.querySelector('#ok').onclick=()=>{closeSheet();r();});
      await say(off,`Ye ${it.label} ki photo hai. Ye tum ho na?`);}
    else await say(off,`Hamare record mein ye bhi hai: "${it.label}". Samjhao.`);
    const r=await choose([{label:`"Main ${L.job} hoon, ${L.city} se. Kaam ke silsile mein safar kar rahi thi."`,sub:'Cover story pe tiko',value:'cover'},{label:'"Ye main nahi hoon. Koi galatfehmi hai."',sub:'Saaf inkaar',value:'deny'},{label:'"Mujhe embassy se baat karni hai."',sub:'Chup raho',value:'silent'}]);
    if(r==='cover')sus-=12;else if(r==='deny')sus+=it.kind==='photo'?10:-6;
    await say(off,r==='cover'?'Hmm… kahani to seedhi hai.':r==='deny'?(it.kind==='photo'?'Photo jhooth nahi bolti.':'Shayad.'):'(likhta hai) Embassy. Theek hai.');}
  await say(off,'Ek aakhri sawaal. Tum rehti kahan ho?');
  const ans=L.city;const r2=await choose(shuffle([ans,...shuffle(CITIES.filter(x=>x!==ans)).slice(0,2)]).map(o=>({label:o})),{timer:7000});sus+=r2===ans?-10:20;
  closeDlg();
  const ending=sus<35?'ghost':sus<65?'deport':'caught';
  const E={ghost:['GHOST','Unhone tumhe jaane diya. Device sahi haathon tak pahunch gaya. Tumhara asli naam kisi file mein nahi hai.','var(--good)'],
           deport:['DEPORT','Saboot adhoore the. Tumhe agli flight se India wapas bhej diya, par mission poora ho chuka tha.','var(--accent)'],
           caught:['PAKDI GAYI','Tumhara poora trace unke paas tha: photos, payments, naam. Har kadam ka nishaan tumhare khilaaf gaya.','var(--red)']}[ending];
  const reward=ending==='ghost'?400000:ending==='deport'?150000:0;CAREER.money+=reward;CAREER.heat=Math.max(0,(CAREER.heat||0)-30);CAREER.wins=(CAREER.wins||0)+1;CAREER.missions=(CAREER.missions||0)+1;CAREER.portDone=true;
  CAREER.endings=Array.from(new Set((CAREER.endings||[]).concat([ending])));saveCareer();
  if(story){C.active=false;C.ending=ending;C.done=Date.now();saveC(C);}
  const c=sheet(`<div class="eyebrow">${story?'KAHANI KHATAM · MUMBAI SE BHAAGO':'LEVEL 4 · FINALE'}</div><h2 style="color:${E[2]}">${E[0]}</h2><p>${E[1]}</p>
    <div class="stats"><div class="stat"><span>Reward</span><b>${inr(reward)}</b></div><div class="stat"><span>Nishaan</span><b>${log.length}</b></div><div class="stat"><span>Alerts</span><b>${alerts}</b></div></div>
    <p class="eyebrow">ENDINGS MILE: ${(CAREER.endings||[]).length}/3 ${['ghost','deport','caught'].map(e=>(CAREER.endings||[]).includes(e)?'●':'○').join(' ')}</p>
    ${photos.length?`<p class="eyebrow">TUMHARE SAFAR KI CCTV PHOTOS</p><div class="gallery">${photos.map(p=>`<div class="snap"><img alt="${esc(p.label)}" src="${p.url}"><b>${esc(p.label)}</b></div>`).join('')}</div>`:''}
    <p class="eyebrow">POORA DIGITAL FOOTPRINT</p><ul class="traces">${log.length?log.map(t=>`<li>Ch ${t.ch} · ${esc(t.text)}</li>`).join(''):'<li class="ok">No traces.</li>'}</ul>
    <button class="btn" id="newstory" type="button">Start a new story</button><a class="btn alt" href="index.html">Safehouse</a>`);
  c.querySelector('#newstory').onclick=()=>{saveC({active:true,ch:1,log:[],photos:[],alerts:0,started:Date.now()});location.href='cab.html';};}
/* ---------------- per-phase logic ---------------- */
let annT=0,clackT=0;
function platformTick(dt,t){
  S.timeLeft-=dt;if(S.timeLeft<=0)return failMission('MV SITARA tumhare bina nikal gaya. Port pe subah ki shift aa gayi.');
  const el=300-S.timeLeft;
  if(el>75&&!S.dogsOut){S.dogsOut=true;coachDoorGuard.g.visible=true;coachDoorGuard.pos.set(8,0,-26);sfx.alert();vib([80,40,80]);toast('Radio: "Customs ne sniffer kutte chhod diye hain."');banner('Sniffer kutta chhoda gaya! Wo deewar ke peeche bhi soonghta hai',true);setTimeout(()=>{if(S.phase==='platform')banner(null);},6000);}
  if(S.timeLeft<120&&!S.horn1){S.horn1=true;sfx.horn();toast('MV SITARA ka bhonpu: 2 minute mein jahaz nikal jaayega!','info');}
  if(S.timeLeft<45&&!S.horn2){S.horn2=true;sfx.horn();toast('Aakhri bhonpu! Gangway uthne wala hai!','info');}
  waterTex.offset.x+=dt*.01;if(coachDoorGuard.dogTail)coachDoorGuard.dogTail.rotation.z=Math.sin(t*12)*.5;
  setObj(S.done?'Gangway tak pahuncho aur jahaz pe chadho':S.look.outfit!=='worker'?'Dock office se crew pass lo (upar-right). Tip: locker shed (neeche-left) se worker jacket':'Dock office se Ismail bhai ka crew pass lo (upar-right, quay ke paas)');
}
function trainTick(){}
function updTC(){}
/* ---------------- NPC update ---------------- */
function updNPC(dt,t){for(const n of NPC){if(n.inArea!==S.area)continue;let mv=false;
  if(n.beh==='wander'){if(!n.target){n.wait-=dt;if(n.wait<=0){const aisle=pick([-31,-12,8,27]);n.target=chance(.5)?[aisle+rnd(-1,1),rnd(-28,26)]:[clamp(n.pos.x+rnd(-14,14),-46,46),pick([-26,-18,-10,-2,6,14,22,26])];}}
    if(n.target){if(stepTo(n,n.target[0],n.target[1],dt,n.walk)){n.target=null;n.wait=rnd(1,5);}else mv=true;}}
  anim(n,dt,mv?n.speed:0,t);}}
/* ---------------- input ---------------- */
const joy=$('#joy'),knob=joy.firstElementChild;let joyId=null,joyO=null,lookId=null,lookLast=null;
canvas.addEventListener('pointerdown',e=>{if(!(S.phase==='platform'||S.phase==='train'))return;if(e.clientX<innerWidth*.5&&e.clientY>innerHeight*.35&&joyId===null&&e.pointerType!=='mouse'){joyId=e.pointerId;joyO=[e.clientX,e.clientY];joy.style.left=e.clientX+'px';joy.style.top=e.clientY+'px';knob.style.transform='';canvas.setPointerCapture(e.pointerId);}
  else if(lookId===null){lookId=e.pointerId;lookLast=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);}});
canvas.addEventListener('pointermove',e=>{if(e.pointerId===lookId){camYaw-=(e.clientX-lookLast[0])*.006;camPitch=clamp(camPitch+(e.clientY-lookLast[1])*.004,.3,1.25);lookLast=[e.clientX,e.clientY];return;}if(e.pointerId!==joyId)return;let dx=e.clientX-joyO[0],dy=e.clientY-joyO[1];const d=Math.hypot(dx,dy);if(d>50){dx=dx/d*50;dy=dy/d*50;}knob.style.transform=`translate(${dx}px,${dy}px)`;input.x=dx/50;input.y=-dy/50;});
const endP=e=>{if(e.pointerId===lookId)lookId=null;if(e.pointerId===joyId){joyId=null;joy.style.left=joy.style.top='';knob.style.transform='';input.x=input.y=0;}};
canvas.addEventListener('pointerup',endP);canvas.addEventListener('pointercancel',endP);
canvas.addEventListener('wheel',e=>{camDist=clamp(camDist+e.deltaY*.01,8,22);},{passive:true});
addEventListener('keydown',e=>{input.keys[e.code]=true;if(e.code==='KeyE')doAct();if((e.code==='Space'||e.code==='Enter')&&advance){e.preventDefault();advance();}});
addEventListener('keyup',e=>input.keys[e.code]=false);
$('#run').addEventListener('click',e=>{e.stopPropagation();input.run=!input.run;$('#run').classList.toggle('on',input.run);});

/* ---------------- minimap (platform) ---------------- */
const mc=$('#map'),mg=mc.getContext('2d');const mx=x=>(53-x)/106*236,mz=z=>(33-z)/66*168;
function drawMap(){mg.clearRect(0,0,236,168);mg.fillStyle='rgba(120,140,170,.45)';for(const c of COL){if(!c.on||!c.tall)continue;mg.fillRect(mx(c.x0),mz(c.z1),Math.max(2,mx(c.x1)-mx(c.x0)),Math.max(2,mz(c.z0)-mz(c.z1)));}
  mg.fillStyle='#3a1d1d';mg.fillRect(mx(-31),mz(44),mx(39)-mx(-31),mz(32)-mz(44));
  const o=S.done?[12,26.4]:officeSpot;mg.strokeStyle='#2fe39a';mg.lineWidth=4;mg.beginPath();mg.arc(mx(o[0]),mz(o[1]),9,0,7);mg.stroke();
  if(S.look.outfit!=='worker'&&!S.done){mg.strokeStyle='#f28b0f';mg.beginPath();mg.arc(mx(lockerSpot[0]),mz(lockerSpot[1]),7,0,7);mg.stroke();}
  for(const g of G){if(!g.g.visible)continue;mg.fillStyle=g.smell?'#c58a4a':g.state==='alert'?'#ff3030':g.state==='patrol'?'#ffd166':'#ff9f1c';mg.beginPath();mg.arc(mx(g.pos.x),mz(g.pos.z),5,0,7);mg.fill();}
  mg.fillStyle='#fff';mg.beginPath();mg.arc(mx(P.pos.x),mz(P.pos.z),6,0,7);mg.fill();}
/* ---------------- camera & loop ---------------- */
/* orbit camera outside the vehicles: drag the right side to look around. CAMY0 = default heading, CAMB = optional bounds */
let CAMY0=Math.atan2(4,-11),CAMB=null,camYaw=0,camPitch=.63,camDist=16;
function updCam(dt){const tx=P.pos.x,tz=P.pos.z;let pos,look;
  if(S.area==='train'){const port=innerHeight>innerWidth;pos=new T.Vector3(tx,port?7.6:6.2,TZ+(port?9.6:8.2));look=new T.Vector3(tx,.7,TZ-.5);const sh=S.escape>0?.01:.03;pos.y+=Math.sin(clk.elapsedTime*13)*sh;pos.x+=Math.sin(clk.elapsedTime*7)*sh;}
  else{const cy=CAMY0+camYaw,py=P.pos.y>1?P.pos.y:0;let d=camDist;for(;d>4;d-=.5){const r0=d*Math.cos(camPitch),cx=tx+Math.sin(cy)*r0,cz=tz+Math.cos(cy)*r0;if((!CAMB||cx>CAMB[0]&&cx<CAMB[1]&&cz>CAMB[2]&&cz<CAMB[3])&&!losBlocked(tx,tz,cx,cz))break;}
    const rr=d*Math.cos(camPitch);pos=new T.Vector3(tx+Math.sin(cy)*rr,d*Math.sin(camPitch),tz+Math.cos(cy)*rr);look=new T.Vector3(tx,.8,tz);}
  if(S.area!=='train'&&P.pos.y>1){pos.y+=P.pos.y;look.y+=P.pos.y;}
  if(S.area==='train'&&camYaw){camYaw=clamp(camYaw,-.8,.8);const c=Math.cos(camYaw),sn=Math.sin(camYaw),dx=pos.x-look.x,dz=pos.z-look.z;pos.x=look.x+dx*c+dz*sn;pos.z=look.z-dx*sn+dz*c;}
  camera.position.lerp(pos,Math.min(1,dt*6));camera.lookAt(look);sun.position.set(tx+8,22,tz+10);sun.target.position.set(tx,0,tz);}
const clk=new T.Clock();let frames=0;
function frame(){let dt=Math.min(window.__dtcap||.05,clk.getDelta());if(slowT>0){slowT-=dt;dt*=.3;}const t=clk.elapsedTime;
  if(S.phase==='platform'||S.phase==='train'||S.phase==='talk'){
    if(S.phase==='platform'||S.phase==='train'){updPlayer(dt,t);updHold(dt);runTick(dt);if(S.area!=='train')platformTick(dt,t);else trainTick(dt,t);}
    updNPC(dt,t);updGuards(dt,t);updCams(dt);updAct();
    $('#clock').textContent=clockS();$('#clock').classList.toggle('warn',S.timeLeft<30);
    const st=$('#state');st.className='chip '+worst;st.textContent=worst==='alert'?'ALERT!':worst==='sus'?'Suspicious':'Calm';
    if(AU.tens)AU.tens.gain.setTargetAtTime(worst==='alert'?.05:worst==='sus'?.02:0,AU.ctx.currentTime,.4);
    if(S.area!=='train'&&(frames++)%3===0)drawMap();
  }
  if(P)updCam(dt);else{camera.position.set(-40+Math.sin(t*.1)*10,12,16);camera.lookAt(0,0,0);}
  composer.render();requestAnimationFrame(frame);}

/* ---------------- boot ---------------- */
setupPlatform();
setupCams();
function setupCams(){cctv(1,-20,-30,Math.PI*.15,.7,22,.2);cctv(2,20,8,-Math.PI*.6,.8,22,.2);cctv(3,-46,6,Math.PI*.5,.6,20,.2);cctv(4,44,-28,-Math.PI*.2,.6,20,.2);}
window.__ready=true;
window.__trace={S,G,NPC,get P(){return P;},get contact(){return contact;},get cur(){return current&&(typeof current.label==='function'?current.label():current.label);},doAct:()=>doAct(),tp:(x,z)=>{P.pos.set(x,0,z);},finale,jump};
frame();
title();

</script>
