const LINES=[['चाय चाय! गरम चाय!','Chaai chaai! Garam chaai!'],['चाय गरम! समोसा गरम!','Chaai garam! Samosa garam!'],['चाय लो चाय! गरम गरम चाय!','Chaai lo chaai!'],['समोसा! वड़ा पाव! चाय चाय!','Samosa! Vada pav!'],['चाय चाय चाय!','Chaai chaai chaai!']];
const AU={ctx:null,on:false,voice:null,crowd:null};
function pickVoice(){try{const vs=speechSynthesis.getVoices();AU.voice=vs.find(v=>/^hi[-_]IN/i.test(v.lang))||vs.find(v=>/^en[-_]IN/i.test(v.lang))||null;}catch(e){}}

function speak(){return;}function _ttsUnused(text,vol,rate=1.08,pitch=1.15){if(!AU.on||!('speechSynthesis' in window))return;try{if(speechSynthesis.speaking)return;const u=new SpeechSynthesisUtterance(text);if(AU.voice){u.voice=AU.voice;u.lang=AU.voice.lang;}else u.lang='hi-IN';u.volume=vol;u.rate=rate;u.pitch=pitch;speechSynthesis.speak(u);}catch(e){}}
function tone(f,d,type='sine',v=.15,w=0){if(!AU.ctx)return;const c=AU.ctx,t0=c.currentTime+w,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+d+.05);}
function horn(){if(REC.horn&&REC.horn.buffer){if(REC.horn.isPlaying)REC.horn.stop();REC.horn.play();}}
function chime(){tone(659,.9,'sine',.12);tone(523,.9,'sine',.12,.35);tone(392,1.2,'sine',.12,.7);}
function crowdNoise(){const c=AU.ctx,len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*.5;const src=c.createBufferSource();src.buffer=b;src.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=600;f.Q.value=.6;const g=c.createGain();g.gain.value=.035;src.connect(f).connect(g).connect(c.destination);src.start();AU.crowd=g;}

const listener=new T.AudioListener();cam.add(listener);const REC={};window.__rec=REC;const AL=new T.AudioLoader();const base='audio/';
function loadRec(){if(REC.loading)return;REC.loading=true;const posA=(file,obj,vol,ref)=>{const a=new T.PositionalAudio(listener);AL.load(base+file,b=>{a.setBuffer(b);a.setLoop(true);a.setRefDistance(ref);a.setRolloffFactor(1.6);a.setDistanceModel('inverse');a.setVolume(vol);if(AU.on)a.play();});obj.add(a);return a;};
  REC.chai=posA('chai_rajasthan.mp3',chai,1.6,5);REC.sam=posA('food_sellers.mp3',sam,1.3,5);
  const flat=(file,vol,loop)=>{const a=new T.Audio(listener);AL.load(base+file,b=>{a.setBuffer(b);a.setLoop(loop);a.setVolume(vol);if(loop&&AU.on)a.play();});return a;};
  REC.bed=flat('delhi_bed.mp3',.45,true);REC.pa=flat('mumbai_pa.mp3',.18,true);REC.ann=flat('announcement.mp3',.9,false);REC.horn=flat('horn.mp3',.8,false);}
function recAll(on){for(const k of ['chai','sam','bed','pa']){const a=REC[k];if(!a||!a.buffer)continue;if(on&&!a.isPlaying)a.play();if(!on&&a.isPlaying)a.pause();}}
document.getElementById('snd').onclick=e=>{AU.on=!AU.on;e.target.classList.toggle('on',AU.on);try{listener.context.resume();}catch(err){}if(AU.on){loadRec();recAll(true);CH.talkT=.5;}else{recAll(false);if(REC.ann&&REC.ann.isPlaying)REC.ann.stop();}};
