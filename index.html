<title>Trace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one-screen phone app. HUD strip on top, cinematic scene window, subtitle panel with choices below.
   Look: night-time airport. Wayfinding-sign yellow on charcoal, passport navy, stamp-ink red. */
:root{
  --ink:#0d1218; --panel:#141c25; --panel2:#1b2632; --line:#2a3645; --text:#e8ebee; --dim:#8f9bab;
  --sign:#f5b82e; --signInk:#15181c; --stamp:#c8443c; --ok:#55b386; --cover:#1c2b52;
  --paper:#eee8d8; --paperInk:#26282b; --gold:#d7b46a;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}

/* HUD */
#hud{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
#hud b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.hud-i{display:flex;align-items:baseline;gap:5px}
.hud-sp{flex:1}
.heart{width:14px;height:14px;fill:var(--stamp);align-self:center;animation:beat var(--beat,0.85s) infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}36%{transform:scale(1.15)}}
.hbtn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-family:var(--mono);font-size:12px;cursor:pointer}
.hbtn:focus-visible,.choice:focus-visible,.btn:focus-visible{outline:2px solid var(--sign);outline-offset:2px}

/* Scene window */
#art{position:relative;flex:0 0 auto;height:clamp(190px,40%,330px);border-radius:10px;overflow:hidden;background:#111821;border:1px solid var(--line)}
.art{position:absolute;inset:0;overflow:hidden}
.art .floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(#1f2833,#141a21)}
.art .caption{position:absolute;left:10px;bottom:8px;font-family:var(--mono);font-size:11px;color:#c9d1da;background:rgba(10,14,19,.72);padding:3px 7px;border-radius:4px;letter-spacing:.04em}
.sign{position:absolute;top:0;left:0;right:0;background:var(--sign);color:var(--signInk);font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;padding:5px 12px;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden}
.sign small{font-family:var(--body);font-weight:600;font-size:13px;text-transform:none;letter-spacing:0;opacity:.85}
.sign svg{width:20px;height:20px;flex:none}
.person{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);height:62%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.desk{position:absolute;left:8%;right:8%;bottom:0;height:30%;background:linear-gradient(#3a4654,#262f3a);border-top:3px solid #56677a}
.desk::after{content:"";position:absolute;left:12%;top:18%;width:22%;height:30%;background:#0f151c;border-radius:3px;box-shadow:0 0 12px rgba(120,190,255,.25) inset}
.silh{position:absolute;bottom:20%;width:34px;height:88px;background:#0b1016;border-radius:17px 17px 4px 4px;opacity:.85}
.silh::before{content:"";position:absolute;left:7px;top:-22px;width:20px;height:22px;border-radius:50%;background:#0b1016}

/* individual scenes */
.a-safehouse{background:radial-gradient(circle at 70% 35%,rgba(245,184,46,.35),transparent 45%),linear-gradient(#1a1714,#0e0d0c)}
.a-safehouse .map{position:absolute;left:8%;top:12%;width:44%;height:52%;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 18px),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 18px),#2c3a33;border:2px solid #4a4237;transform:rotate(-2deg)}
.a-safehouse .map i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--stamp);box-shadow:0 0 0 3px rgba(200,68,60,.3)}
.a-safehouse .map b{position:absolute;height:2px;background:var(--stamp);transform-origin:left center;opacity:.8}
.a-safehouse .lamp{position:absolute;right:16%;top:18%;width:60px;height:34px;background:#3b3329;border-radius:30px 30px 4px 4px}
.a-safehouse .table{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(#3a2c20,#21180f)}
.a-forger{background:radial-gradient(circle at 50% 30%,rgba(255,236,190,.28),transparent 50%),linear-gradient(#18140f,#0b0a08)}
.a-forger .bench{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(#2d2419,#17110b)}
.a-forger .doc{position:absolute;bottom:18%;width:70px;height:96px;border-radius:4px;background:var(--cover);box-shadow:0 6px 12px rgba(0,0,0,.5)}
.a-forger .doc::after{content:"";position:absolute;left:24px;top:30px;width:22px;height:22px;border-radius:50%;border:2px solid var(--gold);opacity:.8}
.a-studio{background:linear-gradient(#e9ecef,#cfd5db)}
.a-studio .face{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:88%}
.a-studio .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.a-studio .flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.a-street{background:linear-gradient(#0b1220,#141c2b 60%,#0d0f13)}
.a-street .road{position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(#22252b,#111317)}
.a-street .streak{position:absolute;height:3px;border-radius:2px;filter:blur(1px);animation:streak linear infinite}
@keyframes streak{from{transform:translateX(110vw)}to{transform:translateX(-60vw)}}
.a-street .sky{position:absolute;left:0;right:0;top:12%;height:40%;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(245,184,46,.18) 22px 26px,transparent 26px 60px);mask-image:linear-gradient(transparent,#000 60%,transparent)}
.a-terminal{background:linear-gradient(#1c2632,#121922)}
.a-terminal .person{left:30%}
.a-terminal .glass{position:absolute;left:0;right:0;top:36px;height:46%;background:repeating-linear-gradient(90deg,rgba(150,190,230,.10) 0 2px,transparent 2px 70px),linear-gradient(#0d1a2a,#16283c)}
.board{position:absolute;right:10px;top:46px;width:min(62%,300px);background:#07090c;border:2px solid #2b333d;border-radius:4px;font-family:var(--mono);font-size:10px;color:#ffd166;padding:5px 6px;display:grid;grid-template-columns:auto auto 1fr auto auto;gap:2px 8px;white-space:nowrap}
.board .hd{color:#7f8b98;font-size:9px}
.board .me{color:#fff;background:#18222e}
.board .st-ok{color:#6fdc9a}.board .st-warn{color:#ff7b6b}
.a-counter{background:linear-gradient(#1d2733,#141b24)}
.a-counter .wall{position:absolute;left:0;right:0;top:36px;bottom:30%;background:repeating-linear-gradient(90deg,#1f2a37 0 60px,#1b2531 60px 120px)}
.a-xray{background:linear-gradient(#1a222c,#10151b)}
.a-xray .machine{position:absolute;left:30%;bottom:18%;width:40%;height:46%;background:linear-gradient(#5b6773,#3a434d);border-radius:8px 8px 0 0}
.a-xray .machine::before{content:"";position:absolute;left:12%;right:12%;bottom:0;height:56%;background:repeating-linear-gradient(90deg,#111 0 6px,#1b1b1b 6px 10px)}
.a-xray .belt{position:absolute;left:0;right:0;bottom:12%;height:7%;background:repeating-linear-gradient(90deg,#2b2f35 0 14px,#222 14px 16px);animation:belt 1s linear infinite}
@keyframes belt{to{background-position:-16px 0}}
.a-xray .bag{position:absolute;bottom:19%;width:68px;height:44px;border-radius:7px;background:#5a3b2a;animation:bagmove 7s linear infinite}
@keyframes bagmove{from{left:-80px}to{left:110%}}
.a-xray .screen{position:absolute;right:6%;top:48px;width:30%;height:38%;background:#0b1a24;border:3px solid #39444f;border-radius:4px;overflow:hidden}
.a-xray .screen::before{content:"";position:absolute;inset:18% 22%;border-radius:6px;background:radial-gradient(circle at 40% 50%,rgba(255,150,40,.85) 0 14%,transparent 15%),radial-gradient(circle at 65% 45%,rgba(60,140,255,.8) 0 18%,transparent 19%),rgba(90,200,120,.35)}
.a-xray .screen.alert{border-color:var(--stamp);box-shadow:0 0 18px rgba(200,68,60,.6)}
.a-gate{background:linear-gradient(#1a2430,#111821)}
.a-gate .window{position:absolute;left:0;right:0;top:36px;height:52%;background:linear-gradient(#0a1424,#1d3350 70%,#2a3442)}
.a-gate .plane{position:absolute;left:10%;top:calc(36px + 22%);width:62%;opacity:.95}
.a-gate .gateno{position:absolute;left:10px;top:44px;background:var(--sign);color:var(--signInk);font-family:var(--display);font-weight:700;font-size:28px;padding:0 10px;border-radius:3px}
.a-cabin{background:linear-gradient(#2a2e33,#1a1d21)}
.a-cabin .seat{position:absolute;bottom:0;width:22%;height:62%;background:linear-gradient(#304160,#1f2b40);border-radius:16px 16px 0 0;box-shadow:inset 0 10px 0 rgba(255,255,255,.06)}
.a-cabin .win{position:absolute;right:6%;top:14%;width:56px;height:76px;border-radius:26px;background:linear-gradient(#ffb36b,#4b6aa1 60%,#1c2c4a);border:6px solid #ccd2d8}
.a-cabin.night .win{background:linear-gradient(#0a1428,#1c2c4a)}
.a-dxb{background:linear-gradient(#2a2418,#17140e)}
.a-dxb .sign{background:#d9b25a}
.a-dxb .arches{position:absolute;left:0;right:0;top:36px;height:50%;background:radial-gradient(ellipse at 50% 100%,transparent 40%,rgba(217,178,90,.12) 41% 44%,transparent 45%) 0 0/120px 100%,linear-gradient(#3b301d,#1e1910)}
.a-room{background:radial-gradient(circle at 50% 18%,rgba(255,244,214,.35),transparent 42%),linear-gradient(#141414,#0a0a0a)}
.a-room .bulb{position:absolute;left:50%;top:0;width:2px;height:16%;background:#555}
.a-room .bulb::after{content:"";position:absolute;left:-9px;bottom:-12px;width:20px;height:16px;border-radius:0 0 10px 10px;background:#ffeab3;box-shadow:0 0 40px 10px rgba(255,230,170,.4)}
.a-room .table{position:absolute;left:10%;right:10%;bottom:0;height:26%;background:linear-gradient(#3b3a37,#1f1e1c)}
.a-room .mirror{position:absolute;left:4%;top:20%;width:26%;height:36%;background:linear-gradient(135deg,#202a33,#0e1318 60%,#1b232b);border:3px solid #333}
.a-title{background:radial-gradient(circle at 50% 40%,#1c2b52,#0d1218 70%)}
.a-title .logo{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:6px}
.a-title .logo h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(64px,22vw,120px);letter-spacing:.18em;line-height:.9;color:var(--paper);text-indent:.18em}
.a-title .logo .route{font-family:var(--mono);font-size:13px;color:var(--sign);letter-spacing:.2em}
.a-title .stamp{position:absolute;right:8%;top:14%}

/* Stamps */
.stampmark{display:inline-block;border:3px double var(--stamp);color:var(--stamp);font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:6px;transform:rotate(-9deg);opacity:.9;font-size:15px;line-height:1.1;text-align:center}
.stampmark small{display:block;font-family:var(--mono);font-size:10px;font-weight:500}
.stampmark.big{font-size:22px}
.stampmark.ok{border-color:var(--ok);color:var(--ok)}
.stamp-drop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-9deg) scale(1);animation:stampin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{from{transform:translate(-50%,-50%) rotate(-9deg) scale(2.4);opacity:0}}

/* Panel */
#panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-bottom:4px}
#dialog{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:84px;position:relative}
#who{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--sign);min-height:1.2em}
#who.narr{color:var(--dim)}
#line{font-size:16px;margin-top:2px;white-space:pre-line}
#line.narr{font-style:italic;color:#c3ccd6}
#next{position:absolute;right:12px;bottom:8px;font-family:var(--mono);font-size:11px;color:var(--dim);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
#timer{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
#timer i{display:block;height:100%;width:100%;background:var(--sign);transform-origin:left}
#choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--sign)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice .lab{font-weight:600}
.choice .sub{font-size:13px;color:var(--dim)}
.choice .tag{font-family:var(--mono);font-size:12px;color:var(--sign)}
.choice.on{border-color:var(--ok);background:#18302a}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .choice{flex:1 1 140px}

/* Overlay sheets */
#overlay{position:fixed;inset:0;background:rgba(8,11,15,.97);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.sheet{width:min(100%,460px);display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--display);font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:var(--sign);text-wrap:balance}
.btn{background:var(--sign);color:var(--signInk);border:0;border-radius:8px;padding:11px 14px;font-weight:700;cursor:pointer;font-family:var(--display);font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}

/* Passport bio page */
.pp{background:linear-gradient(135deg,#efe8d6,#e3dcc9);color:var(--paperInk);border-radius:8px;padding:12px;font-family:var(--mono);font-size:11px;box-shadow:0 10px 30px rgba(0,0,0,.5);position:relative;overflow:hidden}
.pp::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 70% 40%,rgba(28,43,82,.06) 0 2px,transparent 2px 9px);pointer-events:none}
.pp-head{display:flex;justify-content:space-between;font-family:var(--body);font-weight:600;font-size:12px;color:var(--cover);border-bottom:1px solid rgba(28,43,82,.3);padding-bottom:5px;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.pp-body{display:flex;gap:12px}
.pp-photo{flex:0 0 84px;height:104px;background:#dfe4e8;border-radius:3px;overflow:hidden}
.pp-photo svg{width:100%;height:100%}
.pp dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;flex:1;min-width:0}
.pp dt{font-size:8.5px;color:#6a6458;text-transform:uppercase}
.pp dd{margin:0;font-weight:600;font-size:11.5px;overflow-wrap:anywhere}
.pp .mrz{margin-top:10px;font-size:10.5px;letter-spacing:.06em;word-break:break-all;line-height:1.35;color:#1c1c1c}
.pp.sloppy dd{font-family:'Courier New',monospace;letter-spacing:.02em}
.pp.sloppy .mrz{transform:rotate(-.6deg);letter-spacing:.1em}
.pp-stamps{display:flex;gap:14px;flex-wrap:wrap;padding:10px;min-height:60px;background:#e6dfcc;border-radius:8px;align-items:center}
.pp-stamps .empty{font-family:var(--mono);font-size:11px;color:#77705f}
.bp{background:#f4f6f8;color:#1b2430;border-radius:8px;display:grid;grid-template-columns:1fr auto;overflow:hidden;font-family:var(--mono);font-size:11px}
.bp .main{padding:10px 12px;display:grid;grid-template-columns:repeat(3,auto);gap:4px 14px}
.bp .main .big{font-family:var(--display);font-size:26px;font-weight:700;grid-column:1/-1;letter-spacing:.04em}
.bp .stub{background:#1c2b52;color:#fff;padding:10px;writing-mode:vertical-rl;text-align:center;font-family:var(--display);letter-spacing:.2em;font-size:14px}
.bp span{display:block;font-size:8.5px;color:#6b7684;text-transform:uppercase}
.dossier{background:var(--paper);color:var(--paperInk);border-radius:8px;padding:14px 16px;font-family:var(--mono);font-size:13px;position:relative}
.dossier h3{margin:0 0 8px;font-family:var(--display);font-size:20px;letter-spacing:.08em;color:var(--stamp);text-transform:uppercase}
.dossier dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px}
.dossier dt{color:#776f60;font-size:11px;text-transform:uppercase;padding-top:2px}
.dossier dd{margin:0;font-weight:600}
.countdown{font-family:var(--mono);color:var(--sign);font-size:13px}

/* Breathing */
.breath{display:grid;place-items:center;gap:14px;text-align:center}
.ring{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.ring .guide{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(245,184,46,.5);transform:scale(.45)}
.ring .core{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#2c3e56,#1a2638);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.ring.held .core{border-color:var(--ok)}
.meter{width:100%;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);width:0}

/* Report */
.report{display:flex;flex-direction:column;gap:12px}
.report .verdict{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:.04em;line-height:1;text-transform:uppercase;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.traces{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:12px}
.traces li{background:var(--panel);border-left:3px solid var(--stamp);padding:6px 9px;border-radius:0 6px 6px 0}
.traces li.none{border-left-color:var(--ok)}
.muted{color:var(--dim);font-size:13px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header id="hud">
    <div class="hud-i"><b id="clock">22:30</b><span id="tz">IST</span></div>
    <div class="hud-i"><b id="money">₹5,00,000</b></div>
    <div class="hud-i" title="Dhadkan"><svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.3 8.4 2.2 4 6.1 4c2.3 0 3.9 1.4 5.9 3.6C14 5.4 15.6 4 17.9 4c3.9 0 5.8 4.4 4.1 7.7C19.5 16.4 12 21 12 21z"/></svg><b id="bpm">72</b></div>
    <div class="hud-sp"></div>
    <button class="hbtn" id="docsBtn" type="button">Docs</button>
    <button class="hbtn" id="muteBtn" type="button">Mute</button>
  </header>
  <section id="art" aria-hidden="true"></section>
  <section id="panel">
    <div id="dialog" role="status" aria-live="polite"><div id="who"></div><div id="line"></div><div id="next" hidden>tap ▸</div></div>
    <div id="timer" hidden><i></i></div>
    <div id="choices"></div>
  </section>
</div>
<div id="overlay" hidden></div>

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const chance = p => Math.random() < p;
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- audio (all synthesized) ---------- */
const AU = {ctx:null, on:true};
function auInit(){
  if (AU.ctx) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext; AU.ctx = new C();
    AU.master = AU.ctx.createGain(); AU.master.gain.value = .8; AU.master.connect(AU.ctx.destination);
    const len = AU.ctx.sampleRate*3, buf = AU.ctx.createBuffer(1,len,AU.ctx.sampleRate), ch = buf.getChannelData(0);
    let last = 0; for (let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; ch[i]=last*3.5; }
    AU.noise = buf;
    const src = AU.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    AU.ambF = AU.ctx.createBiquadFilter(); AU.ambF.type='lowpass'; AU.ambF.frequency.value=500;
    AU.amb = AU.ctx.createGain(); AU.amb.gain.value = 0;
    src.connect(AU.ambF).connect(AU.amb).connect(AU.master); src.start();
    heartLoop();
  } catch(e){ AU.ctx = null; }
}
function ambient(level, freq){ if(!AU.ctx) return; const t=AU.ctx.currentTime; AU.amb.gain.cancelScheduledValues(t); AU.amb.gain.linearRampToValueAtTime(level,t+1.5); if(freq) AU.ambF.frequency.linearRampToValueAtTime(freq,t+1.5); }
function tone(f, dur, type='sine', vol=.2, when=0){
  if(!AU.ctx || !AU.on) return;
  const t = AU.ctx.currentTime + when, o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(AU.master); o.start(t); o.stop(t+dur+.05);
}
function burst(dur, freq, vol=.5, type='lowpass'){
  if(!AU.ctx || !AU.on) return;
  const t = AU.ctx.currentTime, s = AU.ctx.createBufferSource(), f = AU.ctx.createBiquadFilter(), g = AU.ctx.createGain();
  s.buffer = AU.noise; f.type = type; f.frequency.value = freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AU.master); s.start(t, Math.random()); s.stop(t+dur+.05);
}
const sfx = {
  chime(){ tone(784,1.3,'sine',.15); tone(659,1.3,'sine',.15,.4); tone(523,1.6,'sine',.15,.8); },
  stamp(){ burst(.12,900,.9); tone(70,.2,'sine',.5); },
  beep(ok=true){ tone(ok?1480:420,.16,'square',.07); if(!ok) tone(420,.16,'square',.07,.22); },
  shutter(){ burst(.06,4000,.5,'highpass'); burst(.05,3000,.4,'highpass'); },
  tick(){ tone(1800,.03,'square',.03); },
  thrill(){ tone(110,1.6,'sawtooth',.05); tone(116,1.6,'sawtooth',.05); }
};
function heartLoop(){
  const step = () => {
    if (S && AU.on && S.nerve > 22){ const v = Math.min(.4,(S.nerve-15)/140); tone(58,.13,'sine',v); tone(52,.13,'sine',v*.75,.17); }
    setTimeout(step, 60000/(S?bpm():70));
  }; step();
}

/* ---------- dialogue engine ---------- */
let advance = null;
const dlg = $('#dialog'), whoEl = $('#who'), lineEl = $('#line'), nextEl = $('#next'), choicesEl = $('#choices'), timerEl = $('#timer');
dlg.addEventListener('click', () => advance && advance());
document.addEventListener('keydown', e => { if ((e.key===' '||e.key==='Enter') && advance && document.activeElement===document.body){ e.preventDefault(); advance(); } });

function setLine(who, text, narr){
  whoEl.textContent = who || ''; whoEl.className = narr ? 'narr' : '';
  lineEl.className = narr ? 'narr' : ''; lineEl.textContent = '';
  return text;
}
function say(who, text, narr=false){
  choicesEl.innerHTML = ''; timerEl.hidden = true;
  setLine(who, text, narr);
  return new Promise(res => {
    let i = 0, typing = true;
    const speed = 16;
    const iv = setInterval(() => { i += 2; lineEl.textContent = text.slice(0,i); if (i >= text.length){ clearInterval(iv); typing=false; nextEl.hidden=false; } }, speed);
    nextEl.hidden = true;
    advance = () => {
      if (typing){ clearInterval(iv); lineEl.textContent = text; typing=false; nextEl.hidden=false; return; }
      advance = null; nextEl.hidden = true; res();
    };
  });
}
const narr = text => say('', text, true);
function choose(opts, {timer=0, keep=false}={}){
  nextEl.hidden = true; advance = null;
  choicesEl.innerHTML = '';
  return new Promise(res => {
    let to = null, tick = null, done = false;
    const finish = v => { if (done) return; done = true; clearTimeout(to); clearInterval(tick); timerEl.hidden = true; if(!keep) choicesEl.innerHTML=''; res(v); };
    opts.forEach(o => {
      const b = document.createElement('button'); b.type='button'; b.className='choice'; b.disabled = !!o.disabled;
      b.innerHTML = `<span class="lab">${esc(o.label)}</span>${o.tag?`<span class="tag">${esc(o.tag)}</span>`:''}${o.sub?`<span class="sub">${esc(o.sub)}</span>`:''}`;
      b.addEventListener('click', () => finish(o.value!==undefined ? o.value : o.label));
      choicesEl.appendChild(b);
    });
    if (timer){
      timerEl.hidden = false; const bar = timerEl.firstElementChild; const t0 = performance.now();
      bar.style.transform = 'scaleX(1)';
      tick = setInterval(() => { const p = 1 - (performance.now()-t0)/timer; bar.style.transform = `scaleX(${Math.max(0,p)})`; if (p < .35) sfx.tick(); }, 250);
      to = setTimeout(() => finish(TIMEOUT), timer);
    }
  });
}

function face(look){ return person({top:'#2d2f36', beard:look.beard, glasses:look.glasses}).replace('class="person"','class="person" style="position:static;transform:none;height:100%;width:100%"'); }
function mrzVal(c){ if(c==='<') return 0; if(/[0-9]/.test(c)) return +c; return c.charCodeAt(0)-55; }
function cd(str){ const w=[7,3,1]; let s=0; [...str].forEach((c,i)=> s += mrzVal(c)*w[i%3]); return String(s%10); }
function passportHTML(){
  const L = S.L, sloppy = S.tier===0;
  const yy = String(L.y).slice(2), dob6 = yy+String(L.m).padStart(2,'0')+String(L.d).padStart(2,'0');
  const exp6 = '33' + '08' + '14';
  const no9 = (S.ppNo+'<<<<<<<<<').slice(0,9);
  let l1 = ('P<IND'+L.surname.toUpperCase()+'<<'+L.given.toUpperCase()); l1 = (l1+'<'.repeat(44)).slice(0,44);
  let ncd = cd(no9); if (sloppy) ncd = String((+ncd+3)%10);
  const body = no9+ncd+'IND'+dob6+cd(dob6)+'M'+exp6+cd(exp6)+'<'.repeat(14)+'0';
  const l2 = (body + cd(no9+ncd+dob6+cd(dob6)+exp6+cd(exp6)+'<'.repeat(14)+'0')).slice(0,44);
  return `<div class="pp${sloppy?' sloppy':''}">
    <div class="pp-head"><span>REPUBLIC OF INDIA</span><span lang="hi">भारत गणराज्य</span></div>
    <div class="pp-body"><div class="pp-photo">${face(S.photoLook)}</div>
    <dl><div><dt>Type / Code</dt><dd>P / IND</dd></div><div><dt>Passport No.</dt><dd>${S.ppNo}</dd></div>
      <div><dt>Surname</dt><dd>${esc(L.surname.toUpperCase())}</dd></div><div><dt>Given name</dt><dd>${esc(L.given.toUpperCase())}</dd></div>
      <div><dt>Date of birth</dt><dd>${L.dob}</dd></div><div><dt>Sex</dt><dd>M</dd></div>
      <div><dt>Place of birth</dt><dd>${esc(L.city.toUpperCase())}</dd></div><div><dt>Date of expiry</dt><dd>14/08/2033</dd></div></dl></div>
    <div class="mrz">${l1.replace(/</g,'&lt;')}<br>${l2.replace(/</g,'&lt;')}</div></div>`;
}

function legendCard(secs, quick){
  return new Promise(res => {
    const sh = openSheet(`<h2>${quick?'Mann mein dohrao':'Apni nayi zindagi yaad karo'}</h2>${legendHTML()}<div class="countdown" id="cdn"></div><button class="btn" id="ok">${quick?'Theek hai':'Yaad ho gaya'}</button>`);
    let left = secs; const c = sh.querySelector('#cdn');
    const upd = () => c.textContent = `Ye kaagaz ${left} second mein jal jaayega.`;
    upd(); const iv = setInterval(() => { left--; upd(); if (left<=0) done(); }, 1000);
    function done(){ clearInterval(iv); closeSheet(); res(); }
    sh.querySelector('#ok').onclick = done;
  });
}
function breathe(){
  return new Promise(res => {
    const sh = openSheet(`<h2>Saans control karo</h2><p class="muted">Gola bada ho to daba ke rakho (saans andar). Chhota ho to chhod do (saans bahar). Teen baar.</p>
      <div class="breath"><div class="ring" id="ring"><div class="guide" id="guide"></div><div class="core" id="core">Ready</div></div><div class="meter"><i id="mfill"></i></div></div>`);
    const ring = sh.querySelector('#ring'), guide = sh.querySelector('#guide'), core = sh.querySelector('#core'), mfill = sh.querySelector('#mfill');
    let held = false, good = 0, total = 0;
    const down = e => { e.preventDefault(); held = true; ring.classList.add('held'); };
    const up = () => { held = false; ring.classList.remove('held'); };
    ring.addEventListener('pointerdown', down); window.addEventListener('pointerup', up); ring.addEventListener('pointerleave', up);
    const onKey = e => { if (e.key===' '){ e.preventDefault(); if (e.type==='keydown') held=true; else held=false; ring.classList.toggle('held', held);} };
    window.addEventListener('keydown', onKey); window.addEventListener('keyup', onKey);
    const cycle = 6000, cycles = 3, t0 = performance.now() + 900;
    const loop = now => {
      const el = now - t0;
      if (el < 0){ requestAnimationFrame(loop); return; }
      const ph = (el % cycle)/cycle, inhale = ph < .5;
      const sc = inhale ? .45 + .55*(ph/.5) : 1 - .55*((ph-.5)/.5);
      guide.style.transform = `scale(${sc})`;
      core.textContent = inhale ? 'Andar' : 'Bahar';
      total++; if (held === inhale) good++;
      mfill.style.width = Math.round(100*good/total) + '%';
      if (el < cycle*cycles) requestAnimationFrame(loop);
      else {
        window.removeEventListener('pointerup', up); window.removeEventListener('keydown', onKey); window.removeEventListener('keyup', onKey);
        const score = good/total; closeSheet(); res(score);
      }
    };
    requestAnimationFrame(loop);
  }).then(async score => {
    const drop = Math.round(8 + score*26);
    nerve(-drop);
    await narr(score > .75 ? `Saans ek lay mein aa gayi. Dhadkan ${bpm()} pe.` : score > .45 ? `Thoda sambhle. Dhadkan ${bpm()} pe.` : `Saans atak-atak ke aayi. Dhadkan ${bpm()} pe.`);
    return score;
  });
}

/* ---------- shared mechanics ---------- */
const answerTime = () => Math.max(4200, 9500 - S.nerve*50);
function dobOptions(){
  const L = S.L, f = (d,m,y) => `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;
  const a = f(L.d, L.m, L.y+ (chance(.5)?1:-1)), b = f(L.m<=12&&L.d<=12&&L.d!==L.m?L.m:((L.d%28)+1), L.m<=12&&L.d<=12&&L.d!==L.m?L.d:L.m, L.y);
  const out = [a, b===L.dob? f(L.d, (L.m%12)+1, L.y) : b];
  return out;
}
function newCp(place){ return {place, susp:0, doubts:new Set()}; }
async function askLegend(key, who, cp, scrut=1){
  const q = QB[key];
  await say(who, pick(q.qs));
  const correct = q.ans(S.L);
  const wrong = key==='dob' ? dobOptions() : shuffle(q.pool.filter(x => x!==correct)).slice(0,2);
  const opts = shuffle([correct, ...wrong]);
  const r = await choose(opts.map(o => ({label:o, value:o})), {timer:answerTime()});
  if (r === TIMEOUT){ nerve(10); cp.susp += 12*scrut; cp.doubts.add(key); await narr('Tum ek pal ruk gaye. Officer ne notice kiya.'); return false; }
  if (r === correct){
    nerve(-2);
    if (S.nerve > 68){ cp.susp += 6*scrut; await narr('Jawab sahi tha, par aawaaz kaanp gayi.'); }
    return true;
  }
  nerve(14); cp.susp += 24*scrut; cp.doubts.add(key); S.inconsist.push(key);
  await say(who, pick(['Hmm. Pakka?','Achha... (kuch note karta hai)','Interesting.']));
  return false;
}
async function queue(label, mins){
  addTime(mins);
  const ahead = Math.max(1, Math.round(mins/4));
  await narr(`${label}. Line mein tumse aage ${ahead} log hain.`);
  let breathed = false, rehearsed = false;
  while (true){
    const r = await choose([
      {label:'Saans control karo', sub:`Dhadkan abhi ${bpm()} bpm hai`, value:'b', disabled:breathed},
      {label:'Cover story mann mein dohrao', sub:'5 second ke liye apni kahani dekho', value:'r', disabled:rehearsed},
      {label:'Aage badho', value:'go'}]);
    if (r==='b'){ breathed = true; await breathe(); }
    else if (r==='r'){ rehearsed = true; await legendCard(5, true); }
    else break;
  }
}

async function secondary(cp, place){
  S.secondaryCount++;
  const dxb = place==='DXB';
  const off = dxb ? {kandura:true, ghutra:true, beard:'full', squint:true, skin:'#a87a54', hair:'#1a1a1a'} : {top:'#1f2d4a', glasses:true, mustache:true, skin:'#8a5a3a', tie:'#1c2b52'};
  const who = dxb ? 'Senior officer' : 'Immigration supervisor';
  art('room', {person:off, cap: dxb ? 'Secondary inspection · DXB Terminal 1' : 'Back office · BOM Emigration'});
  ambient(.05, 260); sfx.thrill(); nerve(14);
  await narr('Ek officer tumhara passport lekar aage chalta hai. "Mere saath aaiye." Ek chhota kamra. Ek bulb. Ek shisha jiske peeche koi aur bhi ho sakta hai.');
  addTime(ri(20,35));
  const doubts = [...cp.doubts];
  if (!doubts.length) doubts.push('purpose');
  cp.doubts = new Set(doubts);
  await say(who, `Hume kuch cheezein samajh nahi aa rahi: ${doubts.map(d=>DOUBT_LABEL[d]||d).join(', ')}. Samjhaiye.`);
  let susp = Math.max(cp.susp, 45);
  for (let round = 1; round <= 3 && susp >= 30; round++){
    const opts = [];
    LITTER.filter(it => S.litter.has(it.id) && !S.used.has(it.id)).forEach(it => opts.push({label:`Dikhao: ${it.name}`, sub: it.supports.length ? `Saboot: ${it.supports.map(s=>DOUBT_LABEL[s]).join(', ')}` : 'Insaani touch', value:'item:'+it.id}));
    const legendDoubts = [...cp.doubts].filter(d => QB[d]);
    if (legendDoubts.length) opts.push({label:'Apni kahani dobara, dhang se samjhao', sub:`Officer ${DOUBT_LABEL[legendDoubts[0]]} ke baare mein dobara puchega`, value:'retell'});
    if (cp.doubts.has('face')) opts.push({label:'"Sir, daadhi kal hi banayi thi"', sub:'Sach bolo, chehra wahi hai', value:'face'});
    if (cp.doubts.has('passport')) opts.push({label:'Passport dobara scan karne ko bolo', sub:`Passport ki quality pe depend karta hai (${TIERS[S.tier].name})`, value:'rescan'});
    if (cp.doubts.has('gadget')) opts.push({label:'Device ka kaam samjhao', sub:'"Portable WiFi router hai, business ke liye"', value:'gadget'});
    opts.push({label:'Chup raho, shaant dikho', sub:'Saans control karo', value:'calm'});
    await narr(`Round ${round} / 3. Officer tumhe dekh raha hai.`);
    const r = await choose(opts);
    if (r.startsWith && r.startsWith('item:')){
      const it = LITTER.find(x => 'item:'+x.id===r); S.used.add(it.id);
      const hits = it.supports.filter(s => cp.doubts.has(s));
      if (it.id==='line'){
        await narr('Officer number milata hai. Teesri ghanti pe ek bhaari aawaaz: "Haan ji, ' + S.L.given + ' hamari company mein hai. Kya hua?"');
      }
      if (hits.length){ hits.forEach(h => cp.doubts.delete(h)); susp -= 22*hits.length; await say(who, 'Hmm. Theek hai, ye match karta hai.'); }
      else if (it.id==='photo'){ susp -= 8; nerve(-10); await say(who, '(Photo dekhta hai) Family hai? Achha.'); }
      else { susp -= 4; await say(who, 'Iska is baat se kya lena-dena?'); }
    } else if (r==='retell'){
      const k = legendDoubts[0];
      const ok = await askLegend(k, who, {susp:0, doubts:new Set()}, 1);
      if (ok){ cp.doubts.delete(k); susp -= 20; await say(who, 'Hmm. Ab theek lag raha hai.'); } else { susp += 15; await say(who, 'Pehle kuch aur bola tha aapne.'); }
    } else if (r==='face'){ cp.doubts.delete('face'); susp -= 18; await say(who, 'Photo mein daadhi thi... haan, jaw line same hai.'); }
    else if (r==='rescan'){
      const okp = [.3,.7,.95][S.tier];
      if (chance(okp)){ cp.doubts.delete('passport'); susp -= 25; sfx.beep(true); await narr('Machine dobara padhti hai. Is baar hari batti.'); }
      else { susp += 12; sfx.beep(false); await narr('Phir se laal batti. Officer ka chehra sakht ho gaya.'); }
    } else if (r==='gadget'){
      if (chance(.5)){ cp.doubts.delete('gadget'); susp -= 15; await say(who, 'Router? Chalu karke dikhao. ... Theek hai.'); }
      else { susp += 10; await say(who, 'Router mein itne antenna? Ye hum rakh lete hain jaanch ke liye.'); S.hasDevice = false; trace(`${place}: device jaanch ke liye zabt`); }
    } else if (r==='calm'){
      const sc = await breathe(); susp -= S.nerve < 40 ? 10 : 3;
    }
    if (S.nerve > 75) susp += 6;
  }
  trace(`${place}: secondary inspection ka record bana (${S.L.given} ${S.L.surname})`);
  if (susp >= 30){
    throw new GameOver('burned', 'Burned', dxb
      ? 'Dubai ke officers ne tumhe aage nahi jaane diya. Passport zabt hai aur agla flight wapas Mumbai ka hai. Agency ab tumhe nahi jaanti.'
      : 'Emigration ne tumhe roak liya. Tumhara nakli naam ab ek file mein hai. Agency ab tumhe nahi jaanti.');
  }
  await say(who, 'Theek hai. Jaa sakte ho. Agli baar dhyan rakhna.');
  nerve(-6); S.heat += 10;
  return true;
}
function checkMissed(limit, what){
  if (S.t > limit) throw new GameOver('missed', 'Flight chhoot gayi', `${what} Tum ${clockStr()} pe pahunche. ZR 501 tumhare bina Dubai chali gayi. Mission cancel.`);
}

  else {
    await say('Reception', 'Booking nahi hai? Walk-in rate lagega. Aur passport copy chahiye.');
    spend(55000); S.heat += 5; trace(`${S.L.hotel}: walk-in, cash, receptionist ne yaad rakha`);
  }
  await narr('Kamre ka darwaaza band. Tum bistar pe baith jaate ho. Pehli baar is raat mein, dil normal dhadak raha hai.');
  nerve(-30);
}

/* ---------- report ---------- */
function report(result){
  const success = !result;
  const nTr = S.traces.length;
  let stars = 0;
  if (success){ stars = 1; if (S.heat < 40 && nTr <= 11) stars = 2; if (S.heat < 18 && nTr <= 9 && S.hasDevice) stars = 3; }
  const verdict = success ? (stars===3 ? 'Ghost. Saaf entry.' : stars===2 ? 'Andar ho. Par nishaan chhoote.' : 'Andar ho. Par log tumhe dhoondh rahe hain.') : result.title;
  const text = success
    ? (S.hasDevice ? 'Signal cloner tumhare saath hai. Phase 2 (Dubai mein mission) yahin se shuru hoga, aur ye saare nishaan wahan tumhara peechha karenge.'
                   : 'Tum pahunch gaye, par device nahi. Dubai mein mission ke liye naya jugaad karna padega.')
    : result.text;
  const mins = Math.round((Date.now()-S.start)/60000);
  const sh = openSheet(`<div class="report">
    <div class="countdown">${success?'Mission report · Phase 1':'Mission khatam'}</div>
    <div class="verdict" style="color:${success?'var(--ok)':'var(--stamp)'}">${esc(verdict)}</div>
    ${success?`<div class="stampmark" style="align-self:flex-start">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}<small>Rating</small></div>`:''}
    <p>${esc(text)}</p>
    <div class="stats"><div class="stat"><span>Paisa bacha</span><b>${inr(S.money)}</b></div><div class="stat"><span>Nishaan</span><b>${nTr}</b></div><div class="stat"><span>Device</span><b>${S.hasDevice?'Saath':'Gaya'}</b></div></div>
    <h2>Tumhara digital footprint</h2>
    <p class="muted">Har line ek saboot hai jo agle phase mein koi officer tumhare saamne rakh sakta hai.</p>
    <ul class="traces">${S.traces.map(t=>`<li>${esc(t.t)} · ${esc(t.text)}</li>`).join('') || '<li class="none">Koi nishaan nahi</li>'}</ul>
    <p class="muted">Khelne ka time: ${mins} min</p>
    <button class="btn" id="again">Dobara khelo</button></div>`);
  sh.querySelector('#again').onclick = () => { closeSheet(); run(); };
}

/* ---------- main ---------- */
async function run(){
  resetState(); hud(); ambient(0);
  try {
    await sTitle();
    await sBriefing(); await sForger(); await sPhoto(); await sLegend(); await sBookings(); await sLitter(); await sPacking();
    await sMorning(); await sTransport(); await sCISF(); await sCheckin(); await sEmigration(); await sSecurity();
    await sGate(); await sFlight(); await sDubai(); await sCustoms(); await sArrival();
    report(null);
  } catch (e){
    if (e instanceof GameOver){ sfx.thrill(); ambient(.03,200); report(e); }
    else { console.error(e); narr('Kuch gadbad ho gayi. Page reload karo.'); }
  }
}
window.__trace = { get state(){ return S; } };
run();
})();
</script>
