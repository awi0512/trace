<style>
/* Layout: full-screen stylized 3D. Compact HUD top-left, round action buttons bottom-right, joystick bottom-left,
   white speech-bubble dialogue at the bottom. Story beats cut to full-screen noir comic panels. */
:root{
  --ink:#151a33; --panel:rgba(255,255,255,.96); --panelInk:#1d2340; --dim:#6b7190; --line:#d9dcea;
  --accent:#f5b82e; --red:#e0242b; --good:#2fa37a; --paper:#f1ece1; --noir:#0d0d0d;
  --display:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --type:'Special Elite','Courier New',monospace; --sfx:'Bangers',Impact,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:#fff;font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

#hud{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(21,26,51,.78);border-radius:999px;padding:5px 12px;font-family:var(--display);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;backdrop-filter:blur(4px)}
.chip small{font-weight:500;opacity:.7;margin-left:4px}
#obj{align-self:flex-start;max-width:min(420px,92vw);background:var(--panel);color:var(--panelInk);border-radius:14px;padding:8px 12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#obj b{display:block;font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.tools{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
.tb{background:rgba(21,26,51,.78);border:0;border-radius:999px;padding:6px 12px;font-family:var(--display);font-weight:700;font-size:13px;cursor:pointer}
.tb:focus-visible,.pad:focus-visible,.choice:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#joy{position:fixed;z-index:4;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);transform:translate(-50%,-50%);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.75)}
#pads{position:fixed;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.pad{border:0;border-radius:999px;cursor:pointer;font-family:var(--display);font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.3);touch-action:none}
#act{background:var(--accent);color:#1d1a10;padding:14px 20px;font-size:17px;max-width:64vw}
#camBtn{background:#fff;color:var(--panelInk);padding:12px 16px;font-size:14px}
body.talking #pads{visibility:hidden}
#hint{position:fixed;z-index:3;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);max-width:46vw;font-size:12px;opacity:.75;pointer-events:none}

#dlg{position:fixed;z-index:8;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
#dlg .in{width:min(100%,560px);display:flex;flex-direction:column;gap:8px}
#dbox{background:var(--panel);color:var(--panelInk);border-radius:18px;padding:12px 16px 14px;cursor:pointer;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35);min-height:72px}
#who{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
#who.narr{color:var(--dim)}
#line{font-size:16.5px;white-space:pre-line}
#line.narr{font-style:italic;color:#3c4262}
#next{position:absolute;right:14px;bottom:6px;font-size:12px;color:var(--dim);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.3}}
#timer{height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
#timer i{display:block;height:100%;background:var(--accent);transform-origin:left}
#choices{display:flex;flex-direction:column;gap:7px}
.choice{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;background:#fff;color:var(--panelInk);border:2px solid transparent;border-radius:14px;padding:10px 14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.choice:hover{border-color:var(--accent)}
.choice .lab{font-weight:600}
.choice .sub{font-size:13px;color:var(--dim)}
.choice .tag{font-family:var(--display);font-weight:700;font-size:13px;color:var(--red)}

#toasts{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 150px);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--noir);color:var(--paper);font-family:var(--type);font-size:13px;padding:7px 12px;border-left:4px solid var(--red);animation:tin .25s ease-out}
.toast.info{border-left-color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* noir comic overlay */
#comic{position:fixed;inset:0;z-index:20;background:var(--noir);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:pointer}
#comic svg{width:min(100%,900px);max-height:80vh;height:auto;display:block}
#comic .pop{display:flex;justify-content:center;max-width:100%}
#comic .tap{font-family:var(--type);color:var(--paper);opacity:.7;font-size:13px}
#comic .pop{animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sfx{font-family:var(--sfx)} .typ{font-family:var(--type)}

#sheet{position:fixed;inset:0;z-index:22;background:rgba(13,13,13,.94);display:grid;place-items:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:min(100%,440px);display:flex;flex-direction:column;gap:12px;user-select:text;-webkit-user-select:text}
.card h2{margin:0;font-family:var(--sfx);font-size:36px;letter-spacing:.04em;color:var(--paper);line-height:1}
.card p{margin:0;color:#d9d4c8}
.dossier{background:var(--paper);color:#222;padding:14px 16px;font-family:var(--type);font-size:14px;transform:rotate(-1deg);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.dossier h3{margin:0 0 8px;color:var(--red);font-family:var(--sfx);font-size:24px;letter-spacing:.06em;font-weight:400}
.dossier dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px}
.dossier dt{color:#776f60;font-size:12px;text-transform:uppercase;padding-top:2px}
.dossier dd{margin:0}
.btn{background:var(--red);color:#fff;border:0;padding:12px 16px;font-family:var(--sfx);font-size:24px;letter-spacing:.06em;cursor:pointer;box-shadow:4px 4px 0 var(--paper)}
.count{font-family:var(--type);color:var(--accent)}
.phone{background:#0f1426;border-radius:28px;padding:18px;border:3px solid #2b3358;display:flex;flex-direction:column;gap:10px}
.phone .ph-top{font-family:var(--display);font-size:12px;opacity:.6;display:flex;justify-content:space-between}
.phone h3{margin:0;font-family:var(--display);font-size:20px}
.phone .choice{box-shadow:none}
.traces{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--type);font-size:13px}
.traces li{background:#1b1b1b;border-left:4px solid var(--red);padding:6px 10px}
.traces li.ok{border-left-color:var(--good)}
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--noir);color:var(--paper);font-family:var(--type)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<script type="module">
import * as T from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)], chance=p=>Math.random()<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};
const TIMEOUT=Symbol('t');

/* ===================== story state ===================== */
const NAMES=[['Ananya','Sethi'],['Kavya','Arora'],['Riya','Joshi'],['Meera','Khanna'],['Aditi','Rao'],['Sana','Mirza'],['Isha','Bhatt']];
const CITIES=['Indore','Pune','Lucknow','Jaipur','Surat','Nagpur','Bhopal'];
const JOBS=[{title:'Sales manager',co:'Kiran Textiles'},{title:'Software tester',co:'Bluewave Systems'},{title:'Purchase executive',co:'Shree Spices Exports'},{title:'Logistics coordinator',co:'Seabird Freight'}];
const PURPOSES=['Supplier se meeting','Trade expo attend karna','Cousin ki shaadi','Family ke saath chhutti'];
const HOTELS=['Al Noor Residency, Deira','Creekside Inn, Bur Dubai','Marina Pearl Hotel','Palm Gate Suites, Al Barsha'];
const n=pick(NAMES);
const S={t:55,money:240000,traces:[],legendUses:3,
  L:{given:n[0],surname:n[1],city:pick(CITIES),job:pick(JOBS),purpose:pick(PURPOSES),hotel:pick(HOTELS),days:pick(['3 din','4 din','5 din','6 din'])},
  phase:'intro',cabType:null,said:{}};
const clockStr=()=>{const m=Math.floor(S.t)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
function toast(t,k='bad'){const d=document.createElement('div');d.className='toast'+(k==='info'?' info':'');d.textContent=t;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),4200);while($('#toasts').children.length>3)$('#toasts').firstChild.remove();}
function trace(t){S.traces.push({t:clockStr(),text:t});toast('Nishaan: '+t);}
function hudUpdate(){$('#clock').innerHTML=`${clockStr()}<small>IST</small>`;$('#money').textContent=inr(S.money);}
function setObj(t){$('#objText').textContent=t;}

/* ===================== audio (synth) ===================== */
const AU={ctx:null,on:true};
function auInit(){if(AU.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;AU.ctx=new C();AU.m=AU.ctx.createGain();AU.m.gain.value=.8;AU.m.connect(AU.ctx.destination);
  const len=AU.ctx.sampleRate*3,b=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate),c=b.getChannelData(0);let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;c[i]=l*3.5;}AU.noise=b;
  const s=AU.ctx.createBufferSource();s.buffer=b;s.loop=true;AU.f=AU.ctx.createBiquadFilter();AU.f.type='lowpass';AU.f.frequency.value=380;AU.amb=AU.ctx.createGain();AU.amb.gain.value=.05;s.connect(AU.f).connect(AU.amb).connect(AU.m);s.start();
  AU.eng=AU.ctx.createOscillator();AU.eng.type='sawtooth';AU.eng.frequency.value=40;AU.ef=AU.ctx.createBiquadFilter();AU.ef.type='lowpass';AU.ef.frequency.value=220;AU.eg=AU.ctx.createGain();AU.eg.gain.value=0;AU.eng.connect(AU.ef).connect(AU.eg).connect(AU.m);AU.eng.start();
}catch(e){AU.ctx=null;}}
function tone(f,d,type='sine',v=.2,w=0){if(!AU.ctx||!AU.on)return;const t=AU.ctx.currentTime+w,o=AU.ctx.createOscillator(),g=AU.ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AU.m);o.start(t);o.stop(t+d+.05);}
function burst(d,f,v=.5,type='lowpass'){if(!AU.ctx||!AU.on)return;const t=AU.ctx.currentTime,s=AU.ctx.createBufferSource(),fl=AU.ctx.createBiquadFilter(),g=AU.ctx.createGain();s.buffer=AU.noise;fl.type=type;fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(AU.m);s.start(t,Math.random());s.stop(t+d+.05);}
const sfx={horn(p=1){tone(420*p,.28,'square',.06);tone(530*p,.28,'square',.05);},door(){burst(.12,500,.7);tone(90,.12,'sine',.35);},latch(){burst(.05,2200,.4,'highpass');},step(){burst(.05,400,.1);},
  thak(){burst(.14,800,.9);tone(70,.25,'sine',.5);},tick(){tone(1800,.03,'square',.03);},sting(){tone(110,1.4,'sawtooth',.05);tone(117,1.4,'sawtooth',.05);}};
function engine(speed){if(!AU.ctx)return;const t=AU.ctx.currentTime;AU.eg.gain.setTargetAtTime(S.phase==='drive'||S.phase==='arrive'||S.phase==='cabWait'?.05:0,t,.3);AU.eng.frequency.setTargetAtTime(38+speed*3.2,t,.2);AU.ef.frequency.setTargetAtTime(180+speed*18,t,.2);}

/* ===================== renderer ===================== */
const canvas=$('#gl');
const renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(55,1,.05,400);
let composer;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?68:52;camera.updateProjectionMatrix();composer&&composer.setSize(w,h);}
addEventListener('resize',resize);resize();
composer=new EffectComposer(renderer,new T.WebGLRenderTarget(innerWidth,innerHeight,{type:T.HalfFloatType,samples:Math.min(4,renderer.capabilities.maxSamples||0)}));
composer.setPixelRatio(renderer.getPixelRatio());composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new T.Vector2(innerWidth,innerHeight),.55,.5,.82));composer.addPass(new OutputPass());resize();

// night sky gradient + stars + moon
{
  const c=document.createElement('canvas');c.width=16;c.height=256;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#0b1030');gr.addColorStop(.55,'#28306a');gr.addColorStop(.8,'#5a4a8a');gr.addColorStop(1,'#c26f6f');g.fillStyle=gr;g.fillRect(0,0,16,256);
  const tx=new T.CanvasTexture(c);tx.colorSpace=T.SRGBColorSpace;
  const sky=new T.Mesh(new T.SphereGeometry(300,24,16),new T.MeshBasicMaterial({map:tx,side:T.BackSide,fog:false,depthWrite:false}));sky.renderOrder=-1;scene.add(sky);scene.userData.sky=sky;
  const sg=new T.BufferGeometry(),pts=[];for(let i=0;i<500;i++){const th=rnd(0,Math.PI*2),ph=rnd(.08,1.3);pts.push(Math.cos(th)*Math.cos(ph)*280,Math.sin(ph)*280,Math.sin(th)*Math.cos(ph)*280);}
  sg.setAttribute('position',new T.Float32BufferAttribute(pts,3));const stars=new T.Points(sg,new T.PointsMaterial({color:0xffffff,size:1.4,sizeAttenuation:false,fog:false}));sky.add(stars);
  const moon=new T.Mesh(new T.SphereGeometry(9,24,16),new T.MeshBasicMaterial({color:0xfff2c8,fog:false}));moon.position.set(120,150,-180);sky.add(moon);
}
scene.fog=new T.Fog(0x2a2f5e,40,170);
scene.add(new T.HemisphereLight(0x8fa0ff,0x3a2a40,.9));
const moonL=new T.DirectionalLight(0xbfcaff,1.1);moonL.position.set(20,40,10);moonL.castShadow=true;moonL.shadow.mapSize.set(1024,1024);
Object.assign(moonL.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:90});moonL.shadow.bias=-.0006;scene.add(moonL,moonL.target);

/* ===================== materials & helpers ===================== */
const mats={};
const m=(c,o={})=>{const k=c+JSON.stringify(o);return mats[k]||(mats[k]=new T.MeshStandardMaterial(Object.assign({color:c,roughness:.8,metalness:0},o)));};
const glow=(c,i=2.2)=>{const k='g'+c+i;if(!mats[k]){mats[k]=new T.MeshBasicMaterial({color:c,toneMapped:false});mats[k].color.multiplyScalar(i);}return mats[k];};
const RB={};const rb=(w,h,d,r=.12)=>{const k=[w,h,d,r].join();return RB[k]||(RB[k]=new RoundedBoxGeometry(w,h,d,3,Math.min(r,w/2-.001,h/2-.001,d/2-.001)));};
function mesh(geo,mat,x=0,y=0,z=0,parent=scene,o={}){const me=new T.Mesh(geo,mat);me.position.set(x,y,z);me.castShadow=o.cast??true;me.receiveShadow=o.recv??true;parent.add(me);return me;}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.anisotropy=4;t._g=g;return t;}
function signTex(text,bg,fg,w=512,h=128,font="700 64px 'Space Grotesk', sans-serif"){return canvasTex(w,h,(g)=>{g.fillStyle=bg;g.fillRect(0,0,w,h);g.fillStyle=fg;g.font=font;g.textAlign='center';g.textBaseline='middle';g.fillText(text,w/2,h/2+4);});}

/* ===================== road & world (treadmill recycled) ===================== */
const ROAD_LEN=2400, END=900;
const roadTex=canvasTex(256,512,(g,w,h)=>{g.fillStyle='#3a3f52';g.fillRect(0,0,w,h);for(let i=0;i<1400;i++){g.fillStyle=`rgba(255,255,255,${rnd(0,.05)})`;g.fillRect(rnd(0,w),rnd(0,h),2,2);}
  g.fillStyle='#f2f2f2';g.fillRect(w*.5-3,0,6,h);g.fillStyle='#e9e2c8';for(let y=0;y<h;y+=128){g.fillRect(w*.25-3,y,6,64);g.fillRect(w*.75-3,y,6,64);}g.fillStyle='#f5b82e';g.fillRect(4,0,5,h);g.fillRect(w-9,0,5,h);});

function addTraffic(make,lane,x,speed){const v=make();v.o.position.set(x,0,lane);v.o.rotation.y=lane>0?Math.PI:0;Object.assign(v,{lane,speed,base:speed,dir:lane>0?-1:1,half:make===makeBus?4.5:make===makeAuto?1:1.9,cur:speed});TRAFFIC.push(v);return v;}
function setupTraffic(){
  const mk=[makeAuto,makeAuto,makeCar,makeCar,makeBus];
  for(let i=0;i<7;i++)addTraffic(pick(mk),pick([1.5,4.5]),rnd(-60,160),rnd(9,15));

function updateTraffic(dt,fx,cabX){
  for(const v of TRAFFIC){
    let sp=v.speed;
    if(v.jam){sp=v.jamGo?Math.min(v.base,(v.jamV=(v.jamV||0)+dt*3)):0;}
    if(v.dir>0&&v.lane===-1.5&&!v.jam){const ahead=TRAFFIC.find(o=>o!==v&&o.lane===v.lane&&o.o.position.x>v.o.position.x&&o.o.position.x-v.o.position.x<8);if(ahead)sp=Math.min(sp,ahead.speed);}
    v.cur=sp;v.o.position.x+=v.dir*sp*dt;v.w.forEach(w=>w.rotation.z-=v.dir*sp*dt/.3);
    if(!v.jam){if(v.o.position.x<fx-110)v.o.position.x+=260;if(v.o.position.x>fx+150)v.o.position.x-=260;}
    v.o.visible=!(v.o.position.x>END-30&&v.lane<0&&!v.jam)||v.lane>0;
  }
}

async function doAct(){if(!current||locked)return;const it=current;locked=true;$('#act').hidden=true;try{await it.run();}catch(e){console.error(e);}}
$('#act').addEventListener('click',e=>{e.stopPropagation();doAct();});
function toggleCam(){camMode=camMode==='inside'?'chase':'inside';$('#camBtn').textContent=camMode==='inside'?'Bahar se dekho':'Andar se dekho';P.g.visible=camMode!=='inside';}
$('#camBtn').addEventListener('click',e=>{e.stopPropagation();toggleCam();});

/* ===================== tweens ===================== */
const tweens=[];function tween(dur,fn){return new Promise(res=>tweens.push({t:0,dur,fn,res}));}
function runTweens(dt){for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const k=Math.min(1,w.t/w.dur);w.fn(ease(k),k);if(k>=1){tweens.splice(i,1);w.res();}}}
const doorAngle=-1.15;
async function openDoor(){sfx.latch();await tween(.7,k=>taxi.door.rotation.y=doorAngle*k);sfx.door();}
async function closeDoor(){await tween(.5,k=>taxi.door.rotation.y=doorAngle*(1-k));sfx.door();}
const tmpV=new T.Vector3();
function seatWorld(){return taxi.body.localToWorld(tmpV.set(-.85,.5,-.42)).clone();}
function doorStand(){return taxi.body.localToWorld(tmpV.set(-.75,0,-2.0)).clone();}

/* ===================== story flow ===================== */
async function intro(){
  $('#loading').hidden=true;
  await new Promise(res=>{const c=sheet(`<h2>TRACE</h2><p class="typ" style="color:var(--accent)">CHAPTER 1 · GHAR SE AIRPORT</p><p>Raat ke 12:55. Mumbai. Tumhe ek nakli naam ke saath Dubai ki flight pakadni hai. Pehle airport tak pahuncho, bina koi nishaan chhode.</p><p style="opacity:.75;font-size:13px">Phone: left side ungli ghaseeto to chalo, right side se camera. Computer: WASD, mouse drag, E.</p><button class="btn" id="go" type="button">Shuru karo</button>`);c.querySelector('#go').onclick=()=>{auInit();AU.ctx&&AU.ctx.resume();closeSheet();res();};});
  await comic('brief');
  await legendCard(20,'Tumhari nayi zindagi');
  ['#hud','#pads','#hint'].forEach(s=>$(s).hidden=false);setTimeout(()=>$('#hint').hidden=true,9000);
  S.phase='street';locked=false;setObj('Phone se cab book karo, ya kerb pe jaake taxi rokko');
  await sleep(600);
  locked=true;
  const r=await new Promise(res=>{const c=sheet(`<div class="phone"><div class="ph-top"><span>12:56</span><span>4G ▮▮▮</span></div><h3>Airport kaise jaoge?</h3>
    <button class="choice" data-v="app" type="button"><span class="lab">App se cab book karo</span><span class="tag">${inr(950)}</span><span class="sub">Gaadi seedha darwaze pe. Par app mein pickup address aur naam save hoga.</span></button>
    <button class="choice" data-v="kp" type="button"><span class="lab">Kerb pe jaake kaali-peeli rokko</span><span class="tag">${inr(700)} cash</span><span class="sub">Koi record nahi. Par khud bahar jaake haath dikhana padega.</span></button></div>`);
    c.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{closeSheet();res(b.dataset.v);});});
  S.cabType=r;locked=false;
  if(r==='app'){trace('Ride app: pickup Sai Krupa CHS, Andheri → T2');setObj('Cab aa rahi hai. Kerb pe jao (sadak ke kinare).');setTimeout(()=>callCab(),7000);}
  else setObj('Kerb pe jao aur taxi ko haath dikhao');
}
INTER.push({label:'Taxi ko haath dikhao',r:2.2,on:()=>S.phase==='street'&&S.cabType==='kp'&&!S.called,pos:()=>[P.pos.x,-6.3],
  run:async()=>{S.called=true;await narr('Tum haath uthate ho. Door ek peeli batti jalti-bujhti hai.');closeDlg();locked=false;setTimeout(()=>callCab(),2500);}});
// stand near the kerb: only valid when the player is actually close to it
INTER[0].on=()=>S.phase==='street'&&S.cabType==='kp'&&!S.called&&P.pos.z>-7.4;
async function callCab(){
  if(S.phase!=='street')return;S.phase='cabWait';
  taxi.car.position.set(-70,0,-4.4);taxi.speed=12;sfx.horn(.9);setObj('Taxi aa rahi hai…');
}
INTER.push({label:'Cab mein baitho',r:1.6,on:()=>S.phase==='doorOpen',pos:()=>{const p=doorStand();return [p.x,p.z];},
  run:async()=>{
    S.phase='boarding';const st=doorStand(),seat=seatWorld();
    await tween(.5,k=>{P.pos.x=lerp(P.pos.x,st.x,k);P.pos.z=lerp(P.pos.z,st.z,k);});
    faceTo(P,Math.PI/2,1,1);P.g.rotation.y=P.yaw=Math.PI/2;
    const s0=P.pos.clone();
    await tween(1.0,k=>{P.pos.x=lerp(s0.x,seat.x,k);P.pos.z=lerp(s0.z,seat.z,k);P.pos.y=lerp(.25,seat.y,k);if(k>.5)P.seated=true;});
    P.seated=true;taxi.body.attach(P.g);P.g.position.set(-.85,.4,-.42);P.g.rotation.set(0,Math.PI/2,0);
    await closeDoor();
    driver.look=-1.1;
    await say('Driver','Kahan chalna hai madam?');
    await choose([{label:'"Airport. Terminal 2, departures."'}]);
    driver.look=0;await say('Driver','T2. Chalo, raat hai, 40-45 minute mein pahuncha dunga.');closeDlg();
    S.phase='drive';camMode='inside';P.g.visible=false;$('#camBtn').hidden=false;$('#camBtn').textContent='Bahar se dekho';setObj('Airport ja rahe ho. "Bahar se dekho" se camera badlo.');
    locked=true;taxi.target=15;driveScript();
  }});

async function legendQ(key,who,q){
  const L=S.L,ans={purpose:L.purpose,city:L.city,job:L.job.title,days:L.days}[key],pool={purpose:PURPOSES,city:CITIES,job:JOBS.map(j=>j.title),days:['3 din','4 din','5 din','6 din','7 din']}[key];
  await say(who,q);const opts=shuffle([ans,...shuffle(pool.filter(x=>x!==ans)).slice(0,2)]);
  const r=await choose(opts.map(o=>({label:o})).concat([{label:'(Muskura ke baat taal do)',value:'skip'}]),{timer:9000});
  if(r===ans){S.said[key]=r;return 'ok';}if(r==='skip'){return 'skip';}
  S.said[key]=r===TIMEOUT?'(chup)':r;trace(`Cab driver ko bataya: "${S.said[key]}" (kahani se alag)`);return 'bad';
}
async function driveScript(){
  const waitDist=d=>new Promise(res=>{const f=()=>{if(taxi.dist>=d)res();else setTimeout(f,100);};f();});
  await waitDist(120);
  driver.look=-.6;
  const r=await legendQ('purpose','Driver','Dubai ja rahe ho? Kaam se ya ghoomne?');
  await say('Driver',r==='skip'?'Achha achha, theek hai. (radio ki aawaaz badha deta hai)':'Badhiya. Wahan bahut garmi hogi, dhyaan rakhna.');closeDlg();driver.look=0;
  await waitDist(330);
  driver.look=-.4;await say('Driver','Ye Andheri flyover pe hamesha jaam rehta hai. Dekho aage…');closeDlg();
  spawnJam();
  await new Promise(res=>{const f=()=>{if(taxi.dist>360&&taxi.speed<.4)res();else setTimeout(f,150);};f();});
  await sleep(900);
  const j=await choose([{label:'"Bhaiya, side se nikaal lo"',tag:'+'+inr(200),sub:'Driver lane badal ke aage nikal jaayega',value:'go'},{label:'"Koi baat nahi, ruk jaate hain"',sub:'15-20 minute lag sakte hain',value:'wait'}]);
  if(j==='go'){S.money-=200;await say('Driver','Pakad ke baitho madam!');closeDlg();sfx.horn(1.1);taxi.laneTarget=-1.5;clearLaneForOvertake();releaseJam(false);}
  else{await narr('Gaadi ruki hai. Horn pe horn. Meter chal raha hai.');closeDlg();S.t+=16;await sleep(6000);releaseJam(true);}
  taxi.target=15;
  await waitDist(520);JAM.forEach(v=>{v.o.visible=false;const i=TRAFFIC.indexOf(v);if(i>=0)TRAFFIC.splice(i,1);});JAM=[];
  await waitDist(560);if(taxi.laneTarget!==-4.4){taxi.laneTarget=-4.4;}
  driver.look=-.6;await say('Driver','Madam, pehli baar Dubai?');
  const q=await choose([{label:'"Haan, pehli baar"'},{label:'"Nahi, kaam se aana-jaana rehta hai"'}]);
  await say('Driver',pick(['Wahan ke mall bahut bade hain, mera bhatija bolta hai.','Mera bhai Sharjah mein driver hai. Achha paisa hai wahan.']));closeDlg();driver.look=0;
  await waitDist(END-60);
  taxi.target=0;taxi.stopAt=END;S.phase='arrive';
}
async function arrival(){
  S.phase='arrived';driver.look=-1.1;
  await say('Driver','T2 aa gaya madam. Departure yahin hai.');
  if(S.cabType==='kp'){
    await say('Driver','Meter ke hisaab se ₹700.');
    const p=await choose([{label:'Cash do',tag:inr(700),sub:'Koi record nahi',value:'cash'},{label:'UPI se pay karo',tag:inr(700),sub:'Tumhare cover naam ka bank record banega',value:'upi'}]);
    S.money-=700;if(p==='upi')trace('UPI payment: taxi driver, T2 drop-off');
  } else {S.money-=950;await narr('App ne card se ₹950 kaat liye.');trace('Ride app: drop-off T2, card payment');}
  closeDlg();
  await openDoor();
  camMode='chase';P.g.visible=true;$('#camBtn').hidden=true;
  scene.attach(P.g);const st=doorStand(),s0=P.pos.clone();
  await tween(1.0,k=>{P.pos.x=lerp(s0.x,st.x,k);P.pos.z=lerp(s0.z,st.z,k);P.pos.y=lerp(s0.y,.25,k);if(k>.4)P.seated=false;});
  P.seated=false;P.pos.y=.25;
  await tween(.8,k=>{P.pos.z=lerp(st.z,-8.3,k);});
  faceTo(P,Math.PI,1,1);P.g.rotation.y=P.yaw=Math.PI;
  await closeDoor();
  taxi.target=10;S.phase='leaving';
  await sleep(1500);
  await comic('arrive');
  endCard();
}
function endCard(){
  const kind=S.traces.length<=1?'Saaf safar':S.traces.length<=3?'Kuch nishaan chhoote':'Peechha shuru ho chuka hai';
  const c=sheet(`<h2>Chapter 1 khatam</h2><p class="typ" style="color:var(--accent)">${esc(kind.toUpperCase())}</p>
    <p>Tum ${clockStr()} pe Terminal 2 pahunchi. Paise bache: ${inr(S.money)}.</p>
    <p class="typ" style="color:var(--paper)">Tumhara digital footprint:</p>
    <ul class="traces">${S.traces.length?S.traces.map(t=>`<li>${esc(t.t)} · ${esc(t.text)}</li>`).join(''):'<li class="ok">Koi nishaan nahi. Ghost.</li>'}</ul>
    <p style="opacity:.8">Agla chapter: <b>Mumbai airport</b> (isi style mein) — CISF, check-in, emigration, CCTV. Ye nishaan wahan tumhara peechha karenge.</p>
    <button class="btn" id="again" type="button">Dobara khelo</button>`);
  c.querySelector('#again').onclick=()=>location.reload();
}
// jam
let JAM=[];
function spawnJam(){const base=taxi.car.position.x+70;JAM=[];const mk=[makeBus,makeCar,makeAuto,makeCar,makeAuto,makeCar];for(let i=0;i<6;i++){const v=addTraffic(mk[i],-4.4,base+i*(i===0?0:7)+(i>0?6:0),0);v.jam=true;v.base=rnd(9,12);JAM.push(v);}}
function releaseJam(go){JAM.slice().reverse().forEach((v,i)=>setTimeout(()=>{v.jamGo=true;},go?i*350:2500+i*500));}
function clearLaneForOvertake(){for(const v of TRAFFIC){if(v.lane===-1.5&&Math.abs(v.o.position.x-taxi.car.position.x)<60)v.o.position.x+=90;}}

/* ===================== per-frame ===================== */
function updatePlayer(dt,t){
  if(S.phase!=='street'&&S.phase!=='cabWait'&&S.phase!=='doorOpen'){animChibi(P,dt,0,t);return;}
  let ix=input.x,iy=input.y;if(input.keys.KeyW||input.keys.ArrowUp)iy+=1;if(input.keys.KeyS||input.keys.ArrowDown)iy-=1;if(input.keys.KeyA||input.keys.ArrowLeft)ix-=1;if(input.keys.KeyD||input.keys.ArrowRight)ix+=1;
  const mag=Math.min(1,Math.hypot(ix,iy));
  if(locked||mag<.08){animChibi(P,dt,0,t);return;}
  camera.getWorldDirection(tmpV);const cy=Math.atan2(tmpV.x,tmpV.z);const spd=2.6*mag,fx=Math.sin(cy),fz=Math.cos(cy),rx=-Math.cos(cy),rz=Math.sin(cy);let vx=fx*iy+rx*ix,vz=fz*iy+rz*ix;const l=Math.hypot(vx,vz);vx/=l;vz/=l;
  P.pos.x=clamp(P.pos.x+vx*spd*dt,-14,24);P.pos.z=clamp(P.pos.z+vz*spd*dt,-8.6,-5.4);
  P.pos.y=P.pos.z>-6?.0:.25;
  if(Math.hypot(P.pos.x+6,P.pos.z+7.6)<1.8){const a=Math.atan2(P.pos.x+6,P.pos.z+7.6);P.pos.x=-6+Math.sin(a)*1.8;P.pos.z=-7.6+Math.cos(a)*1.8;}
  faceTo(P,Math.atan2(vx,vz),dt,12);animChibi(P,dt,spd,t);
}
function updateTaxi(dt,t){
  const c=taxi.car;
  if(S.phase==='cabWait'){const stopX=P.pos.x+1.2;const d=stopX-c.position.x;taxi.speed=d>0?Math.min(12,Math.sqrt(2*5*d)):0;if(d<.25){c.position.x=stopX;taxi.speed=0;S.phase='opening';sfx.horn(1.2);(async()=>{await sleep(400);await openDoor();S.phase='doorOpen';setObj('Peeche ka darwaza khula hai. Cab mein baitho.');})();}}
  else if(S.phase==='drive'||S.phase==='leaving'){
    let target=taxi.target;
    for(const v of TRAFFIC){if(v.dir<0||!v.o.visible||Math.abs(v.o.position.z-c.position.z)>1.3)continue;const dx=v.o.position.x-c.position.x;if(dx>0&&dx<26){target=Math.min(target,clamp((dx-v.half-2.1-1.6)*1.1,0,99)+v.cur);}}
    taxi.speed+=clamp(target-taxi.speed,-6*dt,3.2*dt);
  } else if(S.phase==='arrive'){const d=taxi.stopAt-c.position.x;taxi.speed=d>0?Math.min(taxi.speed+3*dt,15,Math.sqrt(2*4.5*d)):0;if(d<.3){c.position.x=taxi.stopAt;taxi.speed=0;arrival();}}
  else if(S.phase!=='cabWait')taxi.speed=Math.max(0,taxi.speed-8*dt);
  c.position.x+=taxi.speed*dt;taxi.dist=c.position.x;
  if(taxi.laneTarget!=null){c.position.z+=clamp(taxi.laneTarget-c.position.z,-1.6*dt,1.6*dt);taxi.lane=Math.abs(c.position.z+1.5)<.3?-1.5:c.position.z;c.rotation.y=-(taxi.laneTarget-c.position.z)*.08;if(Math.abs(taxi.laneTarget-c.position.z)<.01){c.rotation.y=0;}}
  taxi.wheels.forEach(w=>w.rotation.z-=taxi.speed*dt/.36);
  taxi.body.rotation.z=clamp(-(taxi.speed-(taxi.lastSp||0))/dt*.004,-.03,.03);taxi.body.position.y=Math.sin(t*14)*.008*Math.min(1,taxi.speed/8);taxi.lastSp=taxi.speed;
  taxi.charm.rotation.x=Math.sin(t*3.1)*.25*Math.min(1,taxi.speed/6+.2);taxi.charm.rotation.z=Math.sin(t*2.3)*.15;
  if(S.phase==='drive'&&Math.floor(t)!==Math.floor(t-dt)){const fare=28+Math.floor(taxi.dist/14);const g=taxi.meterTex._g;g.fillStyle='#111';g.fillRect(0,0,128,64);g.fillStyle='#ff5a3a';g.font="700 40px monospace";g.textAlign='center';g.fillText(String(fare).padStart(3,'0'),64,46);taxi.meterTex.needsUpdate=true;}
  if(S.phase==='drive'&&chance(dt*.25))sfx.horn(rnd(.8,1.3));
  animChibi(driver,dt,0,t);driver.armL.rotation.x=driver.armR.rotation.x=-1.25;driver.armL.rotation.z=Math.sin(t*.7)*.06;
  if(S.phase==='drive')S.t+=dt*.55;
  engine(taxi.speed);
}
function updateCamera(dt){
  const c=taxi.car;let pos,look;
  if(camMode==='inside'){
    taxi.car.updateMatrixWorld(true);pos=taxi.body.localToWorld(new T.Vector3(-1.0,1.72,-.4));look=taxi.body.localToWorld(new T.Vector3(3.5,1.35,.15));
    const sh=Math.min(1,taxi.speed/10)*.01;pos.y+=Math.sin(performance.now()/90)*sh;
    camera.position.lerp(pos,Math.min(1,dt*12));camera.lookAt(look);return;
  }
  if(camMode==='chase'){
    const yaw=Math.PI/2+.5;const tgt=(S.phase==='drive'||S.phase==='arrive')?c.position:P.pos;
    pos=new T.Vector3(tgt.x-Math.sin(yaw)*9,3.6,tgt.z-Math.cos(yaw)*9);look=new T.Vector3(tgt.x+4,1.2,tgt.z);
    camera.position.lerp(pos,Math.min(1,dt*3));camera.lookAt(look);return;
  }
  if((S.phase==='opening'||S.phase==='doorOpen'||S.phase==='boarding')&&!cineDone){
    const c=taxi.car.position;pos=new T.Vector3(c.x-4.5,2.6,c.z+5.5);look=new T.Vector3(c.x-.6,1.1,c.z-1.6);
    camera.position.lerp(pos,Math.min(1,dt*2.5));camera.lookAt(look);return;}
  const tx=P.pos.x,tz=P.pos.z,ty=1.2;
  pos=new T.Vector3(tx-Math.sin(camYaw)*camDist*Math.cos(camPitch),ty+camDist*Math.sin(camPitch),tz-Math.cos(camYaw)*camDist*Math.cos(camPitch));
  camera.position.lerp(pos,Math.min(1,dt*8));camera.lookAt(tx,ty,tz);
}

/* ===================== boot ===================== */
setupTraffic();
taxi=makeTaxi();taxi.car.position.set(-200,0,-4.4);taxi.laneTarget=-4.4;taxi.lane=-4.4;
driver=chibi({body:0xd8cfa8,skin:0x8f5d3e,hair:0x111111,mustache:true,legs:0x5a5240});taxi.body.add(driver.g);driver.g.position.set(.45,.4,.42);driver.g.rotation.y=Math.PI/2;driver.seated=true;
P=chibi(AGENT);P.pos.set(0,.25,-8);P.yaw=Math.PI*.5;P.g.rotation.y=P.yaw;
camera.position.set(-6,3,-2);
const clock=new T.Clock();
function frame(){
  const dt=Math.min(window.__dtcap||.05,clock.getDelta()),t=clock.elapsedTime;
  runTweens(dt);updatePlayer(dt,t);updateTaxi(dt,t);
  const fx=(S.phase==='drive'||S.phase==='arrive'||S.phase==='arrived'||S.phase==='leaving')?taxi.car.position.x:P.pos.x;
  updateTraffic(dt,fx,taxi.car.position.x);recycle(fx);
  if(TERM.peds)TERM.peds.forEach(p=>animChibi(p,dt,0,t));animChibi(TERM.cisf,dt,0,t);
  const dog=scene.userData.dog;dog.scale.y=1+Math.sin(t*2)*.04;
  moonL.position.set(fx+20,40,10);moonL.target.position.set(fx,0,-4);
  scene.userData.sky.position.set(camera.position.x,0,camera.position.z);
  updateAct();updateCamera(dt);hudUpdate();
  composer.render();requestAnimationFrame(frame);
}
window.__ready=true;
window.__trace={S,get taxi(){return taxi;},get P(){return P;},setCam:m=>{camMode=m;P.g.visible=m!=='inside';},doAct:()=>doAct(),get cur(){return current&&current.label;}};
frame();
intro();
</script>
