<style>
/* Layout: full-screen 3D canvas. HUD top-left, minimap top-right, joystick bottom-left, action buttons bottom-right,
   dialogue sheet slides over the bottom. Look: night airport, wayfinding yellow, passport navy, stamp red. */
:root{
  --ink:#0b1016; --panel:rgba(16,22,30,.92); --panel2:#1b2632; --line:#2c3949; --text:#e9ecef; --dim:#94a0ae;
  --sign:#f5b82e; --signInk:#15181c; --stamp:#d0463d; --ok:#5ec08f; --cover:#1c2b52; --paper:#eee8d8; --paperInk:#26282b;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(14px,env(safe-area-inset-left,0px));right:140px;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:5}

.chip{background:rgba(10,14,20,.78);border:1px solid var(--line);border-radius:6px;padding:3px 8px;display:flex;gap:6px;align-items:baseline}
.chip b{color:var(--text);font-size:14px;font-variant-numeric:tabular-nums}
.chip.warn b{color:var(--stamp)}
.heart{width:13px;height:13px;fill:var(--stamp);align-self:center;animation:beat var(--beat,.85s) infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}36%{transform:scale(1.15)}}
#obj{background:rgba(10,14,20,.8);border-left:3px solid var(--sign);padding:5px 9px;border-radius:0 6px 6px 0;font-size:13px;max-width:420px;pointer-events:auto;cursor:pointer}
#obj .muted{font-size:12px}
#obj.short .muted{display:none}
#obj small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--sign);letter-spacing:.08em;text-transform:uppercase}
.tools{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
.hbtn{background:rgba(20,28,38,.9);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-family:var(--mono);font-size:12px;cursor:pointer}
.hbtn.on{border-color:var(--sign);color:var(--sign)}
.hbtn:focus-visible,.choice:focus-visible,.btn:focus-visible,.pad:focus-visible{outline:2px solid var(--sign);outline-offset:2px}
#map{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(14px,env(safe-area-inset-right,0px));width:112px;height:168px;border-radius:8px;border:1px solid var(--line);background:rgba(8,12,18,.82);z-index:5}

#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 186px);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:6;pointer-events:none;width:min(92vw,420px)}
.toast{background:rgba(12,16,22,.92);border:1px solid var(--line);border-left:3px solid var(--stamp);padding:6px 10px;border-radius:6px;font-family:var(--mono);font-size:12px;animation:tin .25s ease-out}
.toast.info{border-left-color:var(--sign)}
.toast.good{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);z-index:4;pointer-events:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(245,184,46,.35);border:2px solid rgba(245,184,46,.7)}
#joyhint{position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);font-family:var(--mono);font-size:11px;color:var(--dim);z-index:3;pointer-events:none;max-width:44vw}

.pad{border-radius:999px;border:2px solid var(--line);background:rgba(20,28,38,.88);font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;touch-action:none}
#act{background:var(--sign);color:var(--signInk);border-color:var(--sign);padding:12px 18px;font-size:17px;max-width:62vw;text-align:center;line-height:1.1;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#run{width:64px;height:64px;font-size:14px}
#run.on{border-color:var(--stamp);color:var(--stamp)}

  background:linear-gradient(transparent,rgba(6,9,13,.9) 18%);display:flex;flex-direction:column;gap:8px;max-height:62%;overflow-y:auto}
#dlg .inner{width:min(100%,560px);margin:0 auto;display:flex;flex-direction:column;gap:8px}
#dbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;position:relative;min-height:70px}
#who{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--sign);min-height:1.2em}
#who.narr{color:var(--dim)}
#line{font-size:16px;white-space:pre-line}
#line.narr{font-style:italic;color:#c6ced8}
#next{position:absolute;right:12px;bottom:6px;font-family:var(--mono);font-size:11px;color:var(--dim);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
#timer{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
#timer i{display:block;height:100%;background:var(--sign);transform-origin:left}
#choices{display:flex;flex-direction:column;gap:7px}
.choice{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer}
.choice:hover{border-color:var(--sign)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice .lab{font-weight:600}
.choice .sub{font-size:13px;color:var(--dim)}
.choice .tag{font-family:var(--mono);font-size:12px;color:var(--sign)}

#overlay{position:fixed;inset:0;background:rgba(8,11,15,.96);display:grid;place-items:center;z-index:20;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(100%,460px);display:flex;flex-direction:column;gap:12px;user-select:text;-webkit-user-select:text}
.sheet h2{margin:0;font-family:var(--display);font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:var(--sign);text-wrap:balance}
.sheet p{margin:0}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(64px,22vw,118px);letter-spacing:.18em;line-height:.9;color:var(--paper);text-indent:.18em;text-align:center}
.route{font-family:var(--mono);font-size:13px;color:var(--sign);letter-spacing:.2em;text-align:center}
.btn{background:var(--sign);color:var(--signInk);border:0;border-radius:8px;padding:12px 14px;font-weight:700;cursor:pointer;font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase}

.muted{color:var(--dim);font-size:13.5px}
.keys{font-family:var(--mono);font-size:12px;color:var(--dim);display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.keys b{color:var(--text)}
.dossier{background:var(--paper);color:var(--paperInk);border-radius:8px;padding:14px 16px;font-family:var(--mono);font-size:13px}
.dossier h3{margin:0 0 8px;font-family:var(--display);font-size:20px;letter-spacing:.08em;color:var(--stamp);text-transform:uppercase}
.dossier dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px}
.dossier dt{color:#776f60;font-size:11px;text-transform:uppercase;padding-top:2px}
.dossier dd{margin:0;font-weight:600}
.countdown{font-family:var(--mono);color:var(--sign);font-size:13px}
.pp{background:linear-gradient(135deg,#efe8d6,#e3dcc9);color:var(--paperInk);border-radius:8px;padding:12px;font-family:var(--mono);font-size:11px}
.pp-head{display:flex;justify-content:space-between;font-family:var(--body);font-weight:600;font-size:12px;color:var(--cover);border-bottom:1px solid rgba(28,43,82,.3);padding-bottom:5px;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.pp dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.pp dt{font-size:8.5px;color:#6a6458;text-transform:uppercase}
.pp dd{margin:0;font-weight:600;font-size:11.5px}
.pp .mrz{margin-top:10px;font-size:10.5px;letter-spacing:.06em;word-break:break-all;line-height:1.35}
.bp{background:#f4f6f8;color:#1b2430;border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:11px;display:grid;grid-template-columns:repeat(3,auto);gap:4px 14px}
.bp .big{font-family:var(--display);font-size:26px;font-weight:700;grid-column:1/-1}
.bp span{display:block;font-size:8.5px;color:#6b7684;text-transform:uppercase}
.verdict{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:.04em;line-height:1;text-transform:uppercase;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim);text-transform:uppercase}
.stat b{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.traces{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:12px}
.traces li{background:var(--panel2);border-left:3px solid var(--stamp);padding:6px 9px;border-radius:0 6px 6px 0}
.stampmark{display:inline-block;border:3px double var(--stamp);color:var(--stamp);font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:6px;transform:rotate(-8deg);font-size:18px}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--mono);color:var(--dim);z-index:30;background:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

/* ================= cover story ================= */
const NAMES=[['Ananya','Sethi'],['Kavya','Arora'],['Riya','Joshi'],['Meera','Khanna'],['Aditi','Rao'],['Sana','Mirza'],['Isha','Bhatt']];

}

/* ================= audio ================= */
const AU={ctx:null,on:true};
function auInit(){

  try{

    AU.amb=AU.ctx.createGain();AU.amb.gain.value=0;src.connect(AU.f).connect(AU.amb).connect(AU.master);src.start();

  }catch(e){AU.ctx=null;}

function ambient(l){if(!AU.ctx)return;AU.amb.gain.linearRampToValueAtTime(l,AU.ctx.currentTime+1.5);}

const colliders=[];
function addBox(x0,x1,z0,z1,h,m,{y0=0,collide=true,cast=false,recv=true}={}){
  const xa=Math.min(x0,x1),xb=Math.max(x0,x1),za=Math.min(z0,z1),zb=Math.max(z0,z1);
  const mesh=new T.Mesh(new T.BoxGeometry(xb-xa,h,zb-za),m);mesh.position.set((xa+xb)/2,y0+h/2,(za+zb)/2);
  mesh.castShadow=cast;mesh.receiveShadow=recv;scene.add(mesh);
  let c=null;if(collide){c={x0:xa,x1:xb,z0:za,z1:zb,on:true};colliders.push(c);}
  return {mesh,c};
}
function wallZ(z,x0,x1,gaps,h,m,th=.4){ // wall along x at given z, with gaps [[a,b]]
  let cur=x0;const gs=gaps.slice().sort((a,b)=>a[0]-b[0]);
  for(const [a,b] of gs){if(a>cur)addBox(cur,a,z-th/2,z+th/2,h,m);cur=b;}
  if(cur<x1)addBox(cur,x1,z-th/2,z+th/2,h,m);
}

    if(sub){g.font=`600 ${Math.round(H*.28)}px 'IBM Plex Sans', sans-serif`;g.globalAlpha=.85;g.fillText(sub,tx,H*.78);g.globalAlpha=1;}});

// World-space rotation retarget between Mixamo rigs whose bones share names but not rest orientations.
function retarget(tgtRoot,srcRoot,clip,fps=30){
  const bonesOf=r=>{const m={};r.traverse(o=>{if(o.isBone)m[o.name]=o;});return m;};
  const sB=bonesOf(srcRoot),tB=bonesOf(tgtRoot);
  srcRoot.updateMatrixWorld(true);tgtRoot.updateMatrixWorld(true);
  const wq=o=>o.getWorldQuaternion(new T.Quaternion());
  const sRest={},tRest={},sRestLocal={};for(const n in sB){sRest[n]=wq(sB[n]);sRestLocal[n]=sB[n].quaternion.clone();}for(const n in tB)tRest[n]=wq(tB[n]);
  const order=[];tgtRoot.traverse(o=>{if(o.isBone)order.push(o);});
  const interp={};for(const tr of clip.tracks){const m=tr.name.match(/^(.*)\.quaternion$/);if(m&&sB[m[1]])interp[m[1]]=tr.createInterpolant();}
  const n=Math.max(2,Math.round(clip.duration*fps)),times=new Float32Array(n),vals={};order.forEach(b=>vals[b.name]=new Float32Array(n*4));
  const tParentRest=new Map();order.forEach(b=>{if(!(b.parent&&b.parent.isBone))tParentRest.set(b.name,wq(b.parent));});
  const q=new T.Quaternion(),G={};
  for(let i=0;i<n;i++){
    const t=i/(n-1)*clip.duration;times[i]=t;
    for(const nm in sB){if(interp[nm]){const v=interp[nm].evaluate(t);sB[nm].quaternion.set(v[0],v[1],v[2],v[3]);}else sB[nm].quaternion.copy(sRestLocal[nm]);}
    srcRoot.updateMatrixWorld(true);
    for(const b of order){
      const parentG=b.parent&&b.parent.isBone?G[b.parent.name]:tParentRest.get(b.name);
      let g;
      if(sB[b.name]){g=wq(sB[b.name]).multiply(sRest[b.name].clone().invert()).multiply(tRest[b.name]);}
      else g=parentG.clone().multiply(b.quaternion);
      G[b.name]=g;q.copy(parentG).invert().multiply(g);q.toArray(vals[b.name],i*4);
    }
  }
  for(const nm in sB)sB[nm].quaternion.copy(sRestLocal[nm]);srcRoot.updateMatrixWorld(true);
  return new T.AnimationClip(clip.name,clip.duration,order.map(b=>new T.QuaternionKeyframeTrack(b.name+'.quaternion',times,vals[b.name])));
}

  for(const p of [G.pat1,G.pat2]){mg.fillStyle='#c9a94a';mg.beginPath();mg.arc(mx(p.pos.x),mz(p.pos.z),4,0,7);mg.fill();}
  const o=objective()[2];mg.strokeStyle='#f5b82e';mg.lineWidth=3;mg.beginPath();mg.arc(mx(o[0]),mz(o[1]),8,0,7);mg.stroke();
  mg.save();mg.translate(mx(P.pos.x),mz(P.pos.z));mg.rotate(-P.yaw+Math.PI);mg.fillStyle='#fff';mg.beginPath();mg.moveTo(0,-9);mg.lineTo(6,6);mg.lineTo(-6,6);mg.closePath();mg.fill();mg.restore();
}

/* ================= world tick: clock, nerve, police attention, announcements ================= */
let annDone={};
async function policeStop(cop){
  S.stopped++;S.attention=0;
  openDlg([cop.pos.x,cop.pos.z]);cop.beh='hold';
  await say('Police','Ruko. Itni jaldi kya hai? Kahan ja rahe ho?');nerve(14);
  const cp={susp:0,doubts:[]};
  const r=await choose([{label:'"Flight ka time ho raha hai ma’am"',value:'f'},{label:'"Kuch nahi ma’am, bas aise hi"',value:'n'}],{timer:answerTime()});
  if(r!=='f'||S.t<CHECKIN_CLOSE-40){await askLegend(pick(['purpose','city','job']),'Police',cp);}
  await say('Police',cp.susp>20?'Hmm. Naam? ... Theek hai, jaao. Aur aaram se chalo.':'Aaram se chalo. Yahan bhaagna mana hai.');
  S.heat+=cp.susp>20?15:5;trace(`${cop===G.pat1?'Check-in hall':'Airside'}: police ne roka, naam poocha`);
  cop.beh='patrol';closeDlg();
}
function tick(dt){
  S.t+=dt*.25; // 1 real sec = 15 game sec
  // nerve drift
  const camHit=camsSeeing(P.pos.x,P.pos.z).length>0;
  let target=18+(S.hasDevice&&!S.hidden?10:0)+(camHit?8:0);
  const left=(!S.checkedIn?CHECKIN_CLOSE:GATE_CLOSE)-S.t;if(left<15)target+=20;
  for(const cop of [G.pat1,G.pat2,G.cisf]){const d=Math.hypot(cop.pos.x-P.pos.x,cop.pos.z-P.pos.z);if(d<4)target+=10;
    if(cop.beh==='patrol'&&!locked&&d<9&&P.running&&P.speed>3)S.attention+=dt*45;}
  S.nerve+=(target-S.nerve)*dt*.08;S.nerve=clamp(S.nerve,0,100);
  S.attention=Math.max(0,S.attention-dt*8);
  if(S.attention>=100&&!locked){const cop=[G.pat1,G.pat2].sort((a,b)=>Math.hypot(a.pos.x-P.pos.x,a.pos.z-P.pos.z)-Math.hypot(b.pos.x-P.pos.x,b.pos.z-P.pos.z))[0];policeStop(cop).catch(e=>console.error(e));}
  // deadlines
  if(!S.checkedIn&&S.t>CHECKIN_CLOSE+1&&!locked&&!S.over)endGame(new GO('Flight chhoot gayi','Check-in 03:15 pe band ho gaya aur tum counter tak nahi pahunchi. Mission cancel.'));
  if(S.t>GATE_CLOSE&&!S.boarded&&!locked&&!S.over)endGame(new GO('Flight chhoot gayi','Gate 03:55 pe band ho gaya. ZR 501 tumhare bina Dubai chali gayi.'));
  const ann=(k,cond,text)=>{if(cond&&!annDone[k]){annDone[k]=1;sfx.chime();toast(text,'info');}};
  ann('c1',S.t>CHECKIN_CLOSE-20&&!S.checkedIn,'Announcement: ZR 501 check-in 20 minute mein band hoga.');
  ann('b1',S.t>BOARDING,'Announcement: ZR 501 to Dubai, boarding gate 72 se shuru.');
  ann('b2',S.t>GATE_CLOSE-8&&!S.boarded,`Last call: passenger ${S.L.surname.toUpperCase()}, gate 72 turant pahunchiin.`);
}

/* ================= HUD ================= */
let lastObj='',objT=0;$('#obj').addEventListener('click',()=>{$('#obj').classList.toggle('short');});
function hud(){
  $('#clock').textContent=clockStr();
  const left=(!S.checkedIn?CHECKIN_CLOSE:GATE_CLOSE)-S.t;$('#clockChip').classList.toggle('warn',left<15);
  $('#bpm').textContent=bpm();document.querySelector('.heart').style.setProperty('--beat',(60/bpm()).toFixed(2)+'s');
  const [a,b]=objective();const s=a+'|'+b;if(s!==lastObj){lastObj=s;objT=performance.now();$('#obj').classList.remove('short');$('#objText').innerHTML=`<b>${esc(a)}</b><br><span class="muted">${esc(b)}</span>`;}
  else if(objT&&performance.now()-objT>9000){objT=0;$('#obj').classList.add('short');}
}

/* ================= input wiring ================= */
const joy=$('#joy'),knob=joy.firstElementChild;let joyId=null,joyO=null,lookId=null,lookLast=null;
canvas.addEventListener('pointerdown',e=>{
  if(locked)return;
  if(e.clientX<innerWidth*.45&&joyId===null&&e.pointerType!=='mouse'){joyId=e.pointerId;joyO=[e.clientX,e.clientY];joy.style.left=e.clientX+'px';joy.style.top=e.clientY+'px';joy.hidden=false;knob.style.transform='';}
  else if(lookId===null){lookId=e.pointerId;lookLast=[e.clientX,e.clientY];}
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerId===joyId){let dx=e.clientX-joyO[0],dy=e.clientY-joyO[1];const d=Math.hypot(dx,dy),m=50;if(d>m){dx=dx/d*m;dy=dy/d*m;}knob.style.transform=`translate(${dx}px,${dy}px)`;input.x=dx/m;input.y=-dy/m;}
  else if(e.pointerId===lookId){camYaw-=(e.clientX-lookLast[0])*.006;camPitch=clamp(camPitch+(e.clientY-lookLast[1])*.004,.12,1.1);lookLast=[e.clientX,e.clientY];}
});
const endPtr=e=>{if(e.pointerId===joyId){joyId=null;joy.hidden=true;input.x=input.y=0;}if(e.pointerId===lookId)lookId=null;};
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{camDist=clamp(camDist+e.deltaY*.004,3,9);},{passive:true});
addEventListener('keydown',e=>{input.keys[e.code]=true;if(e.code==='KeyE'&&!locked)doInteract();if((e.code==='Space'||e.code==='Enter')&&advance){e.preventDefault();advance();}if(e.code==='KeyQ')camYaw+=.06;});
addEventListener('keyup',e=>{input.keys[e.code]=false;});
$('#act').addEventListener('click',e=>{e.stopPropagation();doInteract();});
$('#run').addEventListener('click',e=>{input.run=!input.run;$('#run').classList.toggle('on',input.run);});
$('#bDocs').addEventListener('click',docs);
$('#bLegend').addEventListener('click',async()=>{if(S.legendUses<=0||locked)return;S.legendUses--;$('#bLegend').textContent=`Kahani (${S.legendUses})`;await legendCard(5,'Mann mein dohrao');});
$('#bCones').addEventListener('click',()=>{const b=$('#bCones');b.classList.toggle('on');const on=b.classList.contains('on');CAMS.forEach(c=>c.piv.visible=on);});
$('#bMute').addEventListener('click',()=>{AU.on=!AU.on;if(AU.master)AU.master.gain.value=AU.on?.8:0;$('#bMute').textContent=AU.on?'Mute':'Unmute';});

/* ================= flow ================= */
let running=false;
function endGame(e){
  if(S.over)return;S.over=true;locked=true;closeDlg();locked=true;$('#pads').hidden=true;
  const win=!!e.win;
  const nCam=S.camsSeen.size,nTr=S.traces.length;
  let stars=0;if(win){stars=1;if(S.heat<35&&nCam<=6)stars=2;if(S.heat<15&&nCam<=4&&S.hasDevice)stars=3;}
  const verdict=win?(stars===3?'Ghost. Saaf nikal gayi.':stars===2?'Plane mein ho. Par nishaan chhoote.':'Plane mein ho. Par log tumhe dhoondh rahe hain.'):e.title;
  const text=win?(S.hasDevice?'Device tumhare saath hai. Dubai airport (Phase 2) mein yahi saare nishaan tumhara peechha karenge.':'Tum plane mein ho, par device nahi. Dubai mein naya jugaad karna padega.'):e.text;
  if(!win)sfx.thrill();
  const sh=sheet(`<div class="countdown">${win?'Mission report · Mumbai airport':'Mission khatam'}</div>
    <div class="verdict" style="color:${win?'var(--ok)':'var(--stamp)'}">${esc(verdict)}</div>
    ${win?`<div><span class="stampmark">Rating ${stars} / 3</span></div>`:''}
    <p>${esc(text)}</p>
    <div class="stats"><div class="stat"><span>Cameras</span><b>${nCam} / ${CAMS.length}</b></div><div class="stat"><span>Nishaan</span><b>${nTr}</b></div><div class="stat"><span>Device</span><b>${S.hasDevice?'Saath':'Nahi'}</b></div></div>
    <h2>Digital footprint</h2><ul class="traces">${S.traces.map(t=>`<li>${esc(t.t)} · ${esc(t.text)}</li>`).join('')}</ul>
    <button class="btn" id="again" type="button">Dobara khelo</button>`);
  sh.querySelector('#again').onclick=()=>location.reload();
}
async function intro(){
  $('#loading').hidden=true;
  await new Promise(res=>{const sh=sheet(`<div class="logo">TRACE</div><div class="route">BOM ── ✕ ── DXB</div>
    <p>Raat ke 2 baje. Mumbai airport, Terminal 2. Tumhare paas naya naam aur nakli passport hai. Andar ek contact tumhe device dega. Use leke plane tak pahunchna hai, bina pakde.</p>
    <div class="keys"><b>Phone</b><span>Screen ke left side ungli ghaseeto: chalo. Right side: camera ghumao. Peela button: interact.</span><b>Computer</b><span>WASD chalo, Shift bhaago, mouse drag camera, E interact.</span></div>
    <p class="muted">Laal hissa = CCTV camera ki nazar. Police ke paas bhaagoge to woh rokenge. Headphones lagao.</p>
    <button class="btn" id="go" type="button">Shuru karo</button>`);
    sh.querySelector('#go').onclick=()=>{auInit();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();res();};});
  await legendCard(25,'Tumhari nayi zindagi');
  closeSheet();
  ['#hud','#map','#pads','#joyhint'].forEach(s=>$(s).hidden=false);
  ambient(.05);running=true;
  setTimeout(()=>$('#joyhint').hidden=true,9000);
  toast('Objective: darwaaze pe CISF ko documents dikhao','info');
}

await loadAssets();
newState();setupPeople();makePlayer();drawBoard();
let last=performance.now(),boardT=0,frames=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  updateNPCs(dt);updateCams(dt);
  if(running&&!S.over){updatePlayer(dt);if(progress)progress(dt);tick(dt);updateInteract();hud();}
  else animate(P,dt,0);
  if(G.trayT!==undefined&&trayBag.visible&&G.trayT<1){G.trayT=Math.min(1,G.trayT+dt/5);trayBag.position.z=-47-G.trayT*11;}
  frameLight.material.color.set(Math.abs(P.pos.z+54)<.6&&Math.abs(P.pos.x)<.6?(S.bagFlag?0xff3b30:0x3bff7a):0x3a4048);
  const o=objective()[2];beacon.position.x=o[0];beacon.position.z=o[1];beacon.material.opacity=.12+Math.sin(now/300)*.06;
  updateCamera(dt);
  if((boardT+=dt)>3){boardT=0;drawBoard();}
  if((frames++)%3===0&&running)drawMap();
  composer.render();
  requestAnimationFrame(loop);
}
camera.position.set(0,4,13);
requestAnimationFrame(loop);
intro();
window.__ready=true;window.__game={get S(){return S;},P:()=>P,teleport:(x,z)=>{P.pos.set(x,0,z);},inter:()=>current,doInteract,QS,NPCS,CAMS,G,set camYaw(v){camYaw=v;}};
</script>
