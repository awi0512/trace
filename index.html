<style>
/* Layout: full-screen stylized 3D sandbox. Top-left HUD (timer, alert state, objective), top-right minimap,
   bottom-left joystick, bottom-right action/run buttons. Story beats and results cut to noir comic panels. */
:root{
  --ink:#151a33; --panel:rgba(255,255,255,.96); --panelInk:#1d2340; --dim:#6b7190;
  --accent:#f5b82e; --red:#e0242b; --good:#2fa37a; --paper:#f1ece1; --noir:#0d0d0d; --sus:#ff9f1c;
  --display:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --type:'Special Elite','Courier New',monospace; --sfx:'Bangers',Impact,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:#fff;font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(224,36,43,.55));opacity:0;transition:opacity .25s}

#hud{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(14px,env(safe-area-inset-left,0px));right:calc(max(14px,env(safe-area-inset-right,0px)) + 130px);display:flex;flex-direction:column;gap:7px;pointer-events:none}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(21,26,51,.82);border-radius:999px;padding:5px 11px;font-family:var(--display);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip.warn{background:var(--red)}
#state.calm{background:rgba(47,163,122,.9)} #state.sus{background:var(--sus);color:#241400} #state.alert{background:var(--red);animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#obj{align-self:flex-start;max-width:min(400px,100%);background:var(--panel);color:var(--panelInk);border-radius:14px;padding:7px 11px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:auto;cursor:pointer}
#obj b{display:block;font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.tools{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
.tb{background:rgba(21,26,51,.82);border:0;border-radius:999px;padding:6px 11px;font-family:var(--display);font-weight:700;font-size:12.5px;cursor:pointer}
#map{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(14px,env(safe-area-inset-right,0px));width:118px;height:84px;border-radius:10px;background:rgba(21,26,51,.85);border:2px solid rgba(255,255,255,.2)}
#toasts{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 232px);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--noir);color:var(--paper);font-family:var(--type);font-size:13px;padding:7px 12px;border-left:4px solid var(--red);animation:tin .25s ease-out}
.toast.info{border-left-color:var(--accent)} .toast.good{border-left-color:var(--good)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

#joy{position:fixed;z-index:4;width:116px;height:116px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(21,26,51,.35);transform:translate(-50%,-50%);pointer-events:none;left:calc(max(16px,env(safe-area-inset-left,0px)) + 72px);top:calc(100% - env(safe-area-inset-bottom,0px) - 108px)}

#pads{position:fixed;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.pad{border:0;border-radius:999px;cursor:pointer;font-family:var(--display);font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.3);touch-action:none}
#act{background:var(--accent);color:#1d1a10;padding:14px 18px;font-size:16px;max-width:60vw;line-height:1.15}

#who{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
#who.narr{color:var(--dim)}
#line{font-size:16px;white-space:pre-line}
#line.narr{font-style:italic;color:#3c4262}
#next{position:absolute;right:14px;bottom:6px;font-size:12px;color:var(--dim);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.3}}
#timer{height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
#timer i{display:block;height:100%;background:var(--accent);transform-origin:left}
#choices{display:flex;flex-direction:column;gap:7px}
.choice{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;background:#fff;color:var(--panelInk);border:2px solid transparent;border-radius:14px;padding:10px 14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.choice:hover{border-color:var(--accent)}
.choice .lab{font-weight:600}.choice .sub{font-size:13px;color:var(--dim)}.choice .tag{font-family:var(--display);font-weight:700;font-size:13px;color:var(--red)}
.choice:disabled{opacity:.45}
.tb:focus-visible,.pad:focus-visible,.choice:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#comic{position:fixed;inset:0;z-index:20;background:var(--noir);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#comic .pop{display:flex;justify-content:center;width:100%;max-width:900px;animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
#comic svg{width:100%;max-height:80vh;height:auto;display:block}
#comic .tap{font-family:var(--type);color:var(--paper);opacity:.7;font-size:13px}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sfx{font-family:var(--sfx)} .typ{font-family:var(--type)}

#sheet{position:fixed;inset:0;z-index:22;background:rgba(13,13,13,.95);display:grid;place-items:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:min(100%,460px);display:flex;flex-direction:column;gap:12px;user-select:text;-webkit-user-select:text}
.card h1{margin:0;font-family:var(--sfx);font-size:clamp(64px,20vw,104px);letter-spacing:.12em;color:var(--paper);line-height:.9;font-weight:400}
.card h2{margin:0;font-family:var(--sfx);font-size:34px;letter-spacing:.04em;color:var(--paper);line-height:1;font-weight:400}
.card p{margin:0;color:#d9d4c8}
.eyebrow{font-family:var(--type);color:var(--accent);font-size:13px;letter-spacing:.06em}
.dossier{background:var(--paper);color:#222;padding:14px 16px;font-family:var(--type);font-size:14px;transform:rotate(-.8deg);box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
.dossier h3{margin:0;color:var(--red);font-family:var(--sfx);font-size:26px;letter-spacing:.05em;font-weight:400}
.dossier dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px}
.dossier dt{color:#776f60;font-size:12px;text-transform:uppercase;padding-top:2px}
.dossier dd{margin:0}
.dossier .stampx{align-self:flex-start;border:3px double var(--red);color:var(--red);font-family:var(--sfx);font-size:18px;padding:2px 10px;transform:rotate(-6deg)}
.btn{display:block;text-align:center;text-decoration:none;background:var(--red);color:#fff;border:0;padding:12px 16px;font-family:var(--sfx);font-size:25px;letter-spacing:.06em;cursor:pointer;box-shadow:4px 4px 0 var(--paper)}
.btn.alt{background:#1d2340}
.btn:disabled{opacity:.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#1b1b1b;padding:8px 10px;border-left:3px solid var(--accent);min-width:0}
.stat span{display:block;font-family:var(--type);font-size:11px;color:#a9a397;text-transform:uppercase}
.stat b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.heat{height:10px;background:#2a2a2a;overflow:hidden}.heat i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--red))}
.traces{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--type);font-size:13px}
.traces li{background:#1b1b1b;border-left:4px solid var(--red);padding:6px 10px}
.traces li.ok{border-left-color:var(--good)}
.shop{display:flex;flex-direction:column;gap:8px}
#splash{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;gap:8px;cursor:pointer;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 56px) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(10,12,24,.15),transparent 35%,rgba(10,12,24,.88))}
#splash h1{margin:0;font-family:var(--sfx);font-weight:400;font-size:clamp(84px,26vw,150px);letter-spacing:.14em;text-indent:.14em;line-height:.85;color:var(--paper);text-shadow:0 8px 30px rgba(0,0,0,.6);animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
#splash .tag{font-family:var(--type);color:var(--accent);font-size:15px}
#splash .tapgo{margin-top:20px;font-family:var(--display);font-weight:700;letter-spacing:.32em;font-size:14px;animation:blink 1.4s infinite}
#lbls .lbl{position:fixed;z-index:14;transform:translate(-50%,-100%);font-family:var(--sfx);font-size:18px;letter-spacing:.08em;padding:2px 10px;background:var(--noir);color:var(--paper);border-left:4px solid var(--accent);pointer-events:none;white-space:nowrap}
#lbls .lbl.cam{border-left-color:var(--red)} #lbls .lbl.tgt{border-left-color:var(--good)}
#banner{position:fixed;z-index:6;left:50%;translate:-50% 0;top:calc(env(safe-area-inset-top,0px) + 92px);width:auto;max-width:min(92vw,520px);white-space:normal;text-align:center;line-height:1.25;background:var(--accent);color:#1d1a10;font-family:var(--display);font-weight:700;font-size:15px;line-height:1.3;padding:7px 14px;border-radius:999px;box-shadow:5px 5px 0 var(--noir);text-align:center;pointer-events:none;animation:pop .3s}
#banner.danger{background:var(--red);color:#fff;animation:bpulse 1s infinite}
@keyframes bpulse{50%{scale:1.04}}
body.banner #obj,body.banner .tools{visibility:hidden}
body.banner #snaps{top:calc(env(safe-area-inset-top,0px) + 136px)}
#flash{position:fixed;inset:0;z-index:7;background:#fff;opacity:0;pointer-events:none}
#snaps{position:fixed;z-index:5;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 104px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.snap{background:#f4f1ea;padding:4px 4px 10px;box-shadow:0 4px 12px rgba(0,0,0,.45);transform:rotate(var(--r,3deg))}
.snap img{display:block;width:62px;height:46px;object-fit:cover}
#snaps .count{align-self:flex-end;background:var(--noir);color:var(--paper);font-family:var(--display);font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px}
.snap b{display:block;font-family:var(--type);font-weight:400;font-size:9px;color:#333;margin-top:3px}
.snap.big{position:fixed;left:50%;top:40%;z-index:9;transform:translate(-50%,-50%) rotate(-3deg);animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
.snap.big img{width:min(72vw,300px);height:auto}.snap.big b{font-size:13px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}.gallery .snap img{width:100%;height:auto}
details{font-size:13px}summary{cursor:pointer;color:#7a4b1a}
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--noir);color:var(--paper);font-family:var(--type)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

  for(const [p,d,lo,hi] of [[ax,dx,c.x0,c.x1],[az,dz,c.z0,c.z1]]){if(Math.abs(d)<1e-6){if(p<lo||p>hi){t0=2;break;}}else{let a=(lo-p)/d,b=(hi-p)/d;if(a>b)[a,b]=[b,a];t0=Math.max(t0,a);t1=Math.min(t1,b);if(t0>t1)break;}}
  if(t0<=t1&&t0<1&&t1>0)return true;}return false;}
function collide(p,r=.32,list=COL){for(const c of list){if(!c.on)continue;const cx=clamp(p.x,c.x0,c.x1),cz=clamp(p.z,c.z0,c.z1);const dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
  if(d2<r*r){if(d2>1e-8){const d=Math.sqrt(d2);p.x=cx+dx/d*r;p.z=cz+dz/d*r;}else{const l=p.x-c.x0,rr=c.x1-p.x,f=p.z-c.z0,b=c.z1-p.z,mn=Math.min(l,rr,f,b);if(mn===l)p.x=c.x0-r;else if(mn===rr)p.x=c.x1+r;else if(mn===f)p.z=c.z0-r;else p.z=c.z1+r;}}}}

  const pivot=(x,y)=>{const p=new T.Group();p.position.set(x,y,0);root.add(p);return p;};
  const legL=pivot(-.18,.55),legR=pivot(.18,.55);
  for(const L of [legL,legR]){mesh(new T.CapsuleGeometry(.13,.26,4,8),m(o.legs||0x2c3150),0,-.27,0,L,{cast:o.shadow});mesh(rb(.26,.14,.36,.06),m(o.shoes||0x1b1b24),0,-.5,.06,L);}
  if(o.coat){mesh(new T.CylinderGeometry(.4,.56,.95,18),m(o.body),0,.98,0,root,{cast:o.shadow});mesh(new T.SphereGeometry(.42,16,10,0,Math.PI*2,0,Math.PI/2),m(o.body),0,1.42,0,root);mesh(new T.TorusGeometry(.47,.05,6,20),m(0x6b4a2f),0,.86,0,root).rotation.x=Math.PI/2;}
  else mesh(new T.CapsuleGeometry(.42,.5,6,14),m(o.body),0,.98,0,root,{cast:o.shadow});
  if(o.vest){const v=mesh(new T.CylinderGeometry(.46,.46,.5,16,1,true),m(o.vest,{side:T.DoubleSide}),0,1.05,0,root);mesh(new T.BoxGeometry(.9,.06,.02),glow(0xfff3c0,1.3),0,.95,.45,root);}
  if(o.suit)mesh(new T.BoxGeometry(.12,.45,.02),m(o.tie||0x8a1f2a),0,1.15,.42,root);
  const armL=pivot(-.5,1.32),armR=pivot(.5,1.32);
  for(const A of [armL,armR]){mesh(new T.CapsuleGeometry(.11,.34,4,8),m(o.vest&&!o.coat?o.body:o.body),0,-.25,0,A);mesh(new T.SphereGeometry(.12,8,6),m(o.skin),0,-.5,0,A);}
  if(o.band)mesh(new T.CylinderGeometry(.13,.13,.12,10),m(0xe0242b),0,-.15,0,armL);
  const head=new T.Group();head.position.y=1.98;root.add(head);
  mesh(new T.SphereGeometry(.5,20,14),m(o.skin,{roughness:.6}),0,0,0,head,{cast:o.shadow});
  if(!o.bald){const hr=mesh(new T.SphereGeometry(.53,20,14,0,Math.PI*2,0,Math.PI*(o.longHair?.62:.52)),m(o.hair),0,.05,-.02,head);hr.rotation.x=-.3;}
  if(o.longHair)mesh(new T.CapsuleGeometry(.36,.4,4,10),m(o.hair),0,-.32,-.22,head);
  for(const s of [-1,1])mesh(new T.SphereGeometry(.07,8,6),m(0x1b1b28),s*.18,.02,.46,head);
  if(o.mustache)mesh(rb(.3,.07,.08,.03),m(0x1b1410),0,-.17,.47,head);
  if(o.glasses){for(const s of [-1,1]){const gl=mesh(new T.TorusGeometry(.11,.025,6,14),m(0x111111),s*.18,.03,.5,head);}mesh(new T.BoxGeometry(.14,.03,.03),m(0x111111),0,.05,.5,head);}
  if(o.cap){mesh(new T.CylinderGeometry(.5,.56,.26,20),m(o.cap),0,.4,0,head);mesh(new T.CylinderGeometry(.5,.5,.05,20,1,false,-Math.PI/2.2,Math.PI/1.1),m(o.capPeak||0x15183a),0,.3,.18,head);}
  if(o.hat){mesh(new T.CylinderGeometry(.82,.82,.06,24),m(o.hat),0,.42,0,head);mesh(new T.CylinderGeometry(.46,.52,.42,20),m(o.hat),0,.64,0,head);mesh(new T.CylinderGeometry(.525,.525,.1,20),m(0xe0242b),0,.5,0,head);}
  if(o.scarf){const sc=mesh(new T.TorusGeometry(.33,.1,8,20),m(o.scarf),0,1.47,0,root);sc.rotation.x=Math.PI/2;mesh(rb(.16,.5,.08,.04),m(o.scarf),.2,1.2,.36,root).rotation.z=.2;}
  if(o.paper){mesh(new T.BoxGeometry(.04,.5,.36),m(0xf1ece1),0,-.55,.15,armR);}
  let bag=null;if(o.bag){bag=new T.Group();mesh(rb(.5,.66,.3,.08),m(o.bag,{roughness:.4}),0,.42,0,bag,{cast:o.shadow});mesh(new T.TorusGeometry(.12,.03,6,10,Math.PI),m(0x333344),0,.78,0,bag);bag.position.set(.82,0,.05);root.add(bag);}
  if(o.case){bag=new T.Group();mesh(rb(.55,.42,.16,.04),m(0x3a2a1a,{roughness:.4}),0,-.62,0,bag);bag.position.set(0,0,0);armR.add(bag);}

function anim(c,dt,speed,t){c.ph+=dt*(3+speed*3);const s=Math.min(1,speed/1.6),a=Math.sin(c.ph)*.7*s;c.legL.rotation.x=a;c.legR.rotation.x=-a;c.armL.rotation.x=-a*.9;c.armR.rotation.x=(c.bag&&!c.opts.case)?0:a*.9;c.root.position.y=Math.abs(Math.sin(c.ph))*.06*s;c.root.rotation.z=Math.sin(c.ph)*.04*s;}
function faceTo(c,yaw,dt,k=10){c.yaw+=angDiff(yaw,c.yaw)*Math.min(1,dt*k);c.g.rotation.y=c.yaw;}
function stepTo(c,tx,tz,dt,spd){const dx=tx-c.pos.x,dz=tz-c.pos.z,d=Math.hypot(dx,dz);if(d<.08){c.speed=0;return true;}const v=Math.min(spd,d/dt);c.pos.x+=dx/d*v*dt;c.pos.z+=dz/d*v*dt;c.speed=v;faceTo(c,Math.atan2(dx,dz),dt);return d<.2;}

const NPC=[];
function npc(o,x,z,reg){const c=chibi(o);c.pos.set(x,0,z);c.reg=reg;c.beh='wander';c.walk=rnd(1.05,1.4);c.wait=rnd(0,4);NPC.push(c);return c;}
class Queue{constructor(front,slots,reg,serv,exit,after){Object.assign(this,{front,slots,reg,serv,exit,after});this.list=[];this.serving=null;this.timer=serv*rnd(.4,1);}
  slot(i){return [this.front[0],this.front[1]+1.1+i*1.05];}
  playerIn(){const [x,z]=this.front;return Math.abs(P.pos.x-x)<1.05&&P.pos.z>z-.4&&P.pos.z<z+this.slots*1.05+2;}
  update(dt){this.timer-=dt;
    if(this.serving){if(this.timer<=0){const n=this.serving;this.serving=null;n.beh='path';n.path=this.exit.map(p=>p.slice());n.reg=this.after;this.timer=this.serv*rnd(.7,1.3);}}
    else if(this.list.length&&this.timer<=0){this.serving=this.list.shift();this.serving.beh='serve';this.serving.q=this;this.timer=this.serv*rnd(.8,1.2);}
    this.list.forEach((n,i)=>n.qi=i);
    if(this.list.length<this.slots-1&&!this.playerIn()&&chance(dt*.3)){const c=NPC.find(n=>n.beh==='wander'&&n.reg===this.reg&&!n.special);if(c){c.beh='join';c.q=this;}}}}
const QS=[];
let staffWalker;
function setupNPC(extra){
  QS.push(new Queue([-17,4.5],7,'HALL',8,[[-14.6,4.6],[-14,8]],'HALL'),new Queue([17,4.5],7,'HALL',7,[[19.4,4.6],[20,8]],'HALL'),new Queue([0,-4.6],6,'HALL',7,[[0,-7.5],[0,-9.5]],'AIR'));

  staffWalker.route=[[-15,0],[-15,-4.4],[-15,-7.8],[-30,-11],['w',5],[-15,-7.8],[-15,-4.4],[-20,-2],['w',8],[-15,-4.4],[-15,-7.8],[-11.6,-17],[-8.4,-17],[5,-15],['w',6],[-8.4,-17],[-11.6,-17],[-15,-7.8],[-15,-4.4],[-15,0],['w',6]];staffWalker.ri=0;
}
function updNPC(dt,t){
  for(const q of QS)q.update(dt);
  const panic=S.alarmUntil>t;
  for(const n of NPC){let mv=false;const sp=panic&&!n.staff?2.6:n.walk;
    switch(n.beh){
      case 'wander':{if(panic&&!n.fleeing&&n.reg==='HALL'){n.fleeing=true;n.target=[rnd(-6,6),22];}if(!panic)n.fleeing=false;
        if(!n.target){n.wait-=dt;if(n.wait<=0)n.target=randIn(n.reg);}if(n.target){if(stepTo(n,n.target[0],n.target[1],dt,sp)){n.target=null;n.wait=rnd(1,6);}else mv=true;}break;}
      case 'join':{const q=n.q,[x,z]=q.slot(q.list.length),ex=x,ez=z+1.2;if(!n.at){if(stepTo(n,ex,ez,dt,n.walk))n.at=true;else mv=true;}else{q.list.push(n);n.beh='queue';n.at=false;}break;}
      case 'queue':{const [x,z]=n.q.slot(n.qi??0);if(!stepTo(n,x,z,dt,1))mv=true;else faceTo(n,Math.PI,dt);break;}
      case 'serve':{const [x,z]=n.q.front;if(!stepTo(n,x,z,dt,1))mv=true;else faceTo(n,Math.PI,dt);break;}
      case 'path':{if(!n.path.length){n.beh='wander';break;}const [x,z]=n.path[0];if(stepTo(n,x,z,dt,n.walk))n.path.shift();mv=true;break;}
      case 'route':{const r=n.route[n.ri];if(r[0]==='w'){n.wait=(n.wait>0?n.wait:r[1])-dt;n.speed=0;if(n.wait<=.01){n.wait=0;n.ri=(n.ri+1)%n.route.length;}}else if(stepTo(n,r[0],r[1],dt,n.walk))n.ri=(n.ri+1)%n.route.length;else mv=true;break;}
      case 'target':{n.tick(dt,t);mv=n.speed>.1;break;}
      case 'follow':{const d=Math.hypot(P.pos.x-n.pos.x,P.pos.z-n.pos.z);if(d>13){n.speed=0;if(!S.ex.wait){S.ex.wait=true;toast('Informer: "Ruko! Itna tez mat chalo!"','info');}break;}S.ex.wait=false;
        if(d>1.8){const bx=P.pos.x-Math.sin(P.yaw)*1.4,bz=P.pos.z-Math.cos(P.yaw)*1.4;const q=navPath(n.pos.x,n.pos.z,bx,bz)[0];stepTo(n,q[0],q[1],dt,d>5?2.9:2.2);mv=true;}break;}
      case 'idle':{n.yaw+=Math.sin(t*.5+n.ph)*dt*.2;n.g.rotation.y=n.yaw;break;}
    }
    anim(n,dt,mv?n.speed:0,t);}
}

const input={x:0,y:0,run:false,keys:{}};
let camYaw=Math.PI,camPitch=.74,camDist=12,locked=true;
function updPlayer(dt,t){
  let ix=input.x,iy=input.y;if(input.keys.KeyW||input.keys.ArrowUp)iy+=1;if(input.keys.KeyS||input.keys.ArrowDown)iy-=1;if(input.keys.KeyA||input.keys.ArrowLeft)ix-=1;if(input.keys.KeyD||input.keys.ArrowRight)ix+=1;

  P.pos.x+=vx*spd*dt;P.pos.z+=vz*spd*dt;collide(P.pos);

  const show=()=>{const vb=views[k];c.innerHTML=`<div class="pop">${vb?full.replace(/viewBox="[^"]*"/,`viewBox="${vb}"`):full}</div><div class="tap">${k<views.length-1?'tap: agla panel ▸':'tap karo ▸'}</div>`;sfx.thak();};
  c.hidden=false;show();let ready=false;setTimeout(()=>ready=true,500);
  const go=()=>{if(!ready)return;k++;if(k<views.length){ready=false;show();setTimeout(()=>ready=true,450);return;}c.removeEventListener('pointerdown',go);c.hidden=true;res();};c.addEventListener('pointerdown',go);});}
function sheet(html){html=gtx(html);const s=$('#sheet');s.innerHTML=`<div class="card">${html}</div>`;s.hidden=false;return s.firstElementChild;}
const closeSheet=()=>{$('#sheet').hidden=true;$('#sheet').innerHTML='';};

  const target=M.type==='tail'?'Target: <b>maroon jacket, kaali topi, moonchh</b>. Hall mein ghoom raha hai.':M.type==='extract'?'Informer: <b>grey kapde, chashma</b>. Washroom mein chhupa hai.':M.type==='photos'?'Teen jagah: <b>staff office ke monitors</b>, <b>security ke paas guard roster</b>, <b>Gate 72 ki passenger list</b>.':M.type==='handoff'?'Contact: <b>gulaabi dupatta, haath mein akhbaar</b>. Airside, gates ke paas.':M.type==='bug'?'Target: <b>grey suit, laal tie, briefcase</b>. Terminal mein ghoom raha hai.':'Laptop: <b>Security office</b>, staff area ke andar. Staff ki <b>naarangi jacket</b> mein ghusna aasaan.';
  return `<div class="dossier"><h3>${esc(M.code)} · ${esc(o.title)}</h3><div>${esc(o.brief)}</div><div>${target}</div>
    <dl><dt>Musibat</dt><dd>${M.comps.map(c=>`<b>${esc(COMPS[c].t)}:</b> ${esc(COMPS[c].d)}`).join('<br>')}</dd><dt>Waqt</dt><dd>${Math.round(M.time/60)} minute</dd>

function briefHTML(){const L=M.L,short={tail:'Maroon jacket wale ka 50 second peecha karo, phir uski meeting ki photo lo.',extract:'Washroom se informer ko nikaal ke taxi stand tak le jao.',photos:'Teen jagah ki photo lo: monitors, guard roster, passenger list.',handoff:'Gulaabi dupatte wale contact ko device do, phir Gate 72 se board karo.',steal:'Security office ka laptop churao, phir taxi stand se niklo.',bug:'Businessman ke briefcase mein bug lagao, phir taxi stand se niklo.'}[M.type];

const INTER=[];let current=null;
function inter(o){INTER.push(o);}
function updAct(){if(locked||S.hold||S.phase!=='play'){$('#act').hidden=true;current=null;return;}let best=null,bd=1e9;for(const it of INTER){if(it.on&&!it.on())continue;const [x,z]=it.pos();const d=Math.hypot(P.pos.x-x,P.pos.z-z);if(d<(it.r||1.4)&&d<bd){bd=d;best=it;}}current=best;const a=$('#act');a.hidden=!best;if(best){const l=typeof best.label==='function'?best.label():best.label;if(a.textContent!==l)a.textContent=l;}}
async function doAct(){if(!current||locked||S.hold)return;const it=current;try{await it.run();}catch(e){console.error(e);}}
$('#act').addEventListener('click',e=>{e.stopPropagation();doAct();});
function hold(label,secs,illegal,check){return new Promise(res=>{S.hold={t:0,secs,illegal,label,check,res};$('#prog').hidden=false;$('#progText').textContent=label;});}
function updHold(dt){const h=S.hold;if(!h)return;h.t+=dt;const seenByCam=CAMS.some(c=>camSees(c,P.pos.x,P.pos.z)),seenByG=G.some(g=>canSee(g,P.pos.x,P.pos.z));
  $('#prog').classList.toggle('seen',seenByCam||seenByG);$('#prog .bar i').style.width=Math.min(100,h.t/h.secs*100)+'%';
  const fail=h.check&&h.check();if(fail||worst==='alert'){S.hold=null;$('#prog').hidden=true;h.res(false);if(fail)toast(fail,'info');return;}
  if(h.t>=h.secs){S.hold=null;$('#prog').hidden=true;h.res(true);}}
async function legendQ(who,keys){let ok=0;const L=M.L,pools={city:[L.city,CITIES],job:[L.job,JOBS],purpose:[L.purpose,PURPOSES],hotel:[L.hotel,HOTELS]};const Q={city:'Kahan se ho?',job:'Kya kaam karti ho?',purpose:'Dubai kis kaam se?',hotel:'Kahan ruk rahi ho?'};
  for(const k of keys){await say(who,Q[k]);const [ans,pool]=pools[k];const opts=shuffle([ans,...shuffle(pool.filter(x=>x!==ans)).slice(0,2)]);const r=await choose(opts.map(o=>({label:o})),{timer:8000});if(r===ans)ok++;}return ok;}

let contact=null,target=null;
function setupObjective(){
  if(M.type==='handoff'){const [x,z]=randIn('AIR');contact=npc({body:0x4b4b6a,skin:0xc68b5e,hair:0x111111,scarf:0xff5fa2,paper:true,longHair:true},x,z,'AIR');contact.special=true;contact.walk=.8;
    inter({label:'Contact ko device do',r:1.6,on:()=>!S.done,pos:()=>[contact.pos.x,contact.pos.z],run:async()=>{contact.beh='hold';contact.target=null;
      const ok=await hold('Akhbaar ke andar device sarka rahi ho…',3,true,()=>Math.hypot(contact.pos.x-P.pos.x,contact.pos.z-P.pos.z)>2.2?'Contact se door chali gayi':null);contact.beh='wander';
      if(ok){S.done=true;sfx.ok();toast(`Device pahunch gaya. Ab Gate ${MYGATE.n} se board karo.`,'good');}}});}
  if(M.type==='steal'){inter({label:'Laptop uthao',r:1.5,on:()=>!S.done,pos:()=>[-31,-22.4],run:async()=>{const ok=await hold('Laptop bag mein daal rahi ho…',2.5,true);if(ok){S.done=true;laptop.visible=false;sfx.ok();toast('Laptop mil gaya. Ab taxi stand (south exit) se niklo.','good');}}});}
  if(M.type==='bug'){
    target=npc({body:0x6d7280,suit:true,tie:0xc0392b,skin:0xe2b48f,hair:0x2a1d14,case:true,mustache:true},-20,18,'HALL');target.special=true;target.beh='target';target.walk=1.05;
    target.plan=[[24,15],['w',7],[17,13],['w',5],[-22,18],['w',9],[30.5,14],['w',6],[-2,9],['w',5]];target.pi=0;target.alertT=0;
    target.tick=(dt,t)=>{if(target.alertT>0){target.alertT-=dt;faceTo(target,Math.atan2(P.pos.x-target.pos.x,P.pos.z-target.pos.z),dt,6);target.speed=0;return;}
      const p=target.plan[target.pi];if(p[0]==='w'){target.wait=(target.wait>0?target.wait:p[1])-dt;target.speed=0;target.yaw+=Math.sin(t*.7)*dt*.5;target.g.rotation.y=target.yaw;if(target.wait<=.01){target.wait=0;target.pi=(target.pi+1)%target.plan.length;}}
      else{const path=navPath(target.pos.x,target.pos.z,p[0],p[1]);const q=path[0];if(stepTo(target,q[0],q[1],dt,target.walk)&&path.length===1)target.pi=(target.pi+1)%target.plan.length;}};
    inter({label:'Briefcase mein bug lagao',r:1.4,on:()=>!S.done,pos:()=>[target.pos.x,target.pos.z],run:async()=>{
      const behind=()=>{const a=Math.atan2(P.pos.x-target.pos.x,P.pos.z-target.pos.z);return Math.abs(angDiff(a,target.yaw))>1.7;};
      if(!behind()){target.alertT=3;toast('Wo tumhe dekh raha hai. Peeche se jao.','info');return;}
      const ok=await hold('Tracker chipka rahi ho…',2,true,()=>!behind()?'Wo palat gaya!':Math.hypot(target.pos.x-P.pos.x,target.pos.z-P.pos.z)>1.9?'Wo aage nikal gaya':null);
      if(ok){S.done=true;sfx.ok();toast('Bug lag gaya. Ab taxi stand (south exit) se niklo.','good');}
      else{target.alertT=4;const g=G.slice().sort((a,b)=>Math.hypot(a.pos.x-target.pos.x,a.pos.z-target.pos.z)-Math.hypot(b.pos.x-target.pos.x,b.pos.z-target.pos.z))[0];g.sus=Math.max(g.sus,55);g.state='search';g.lastSeen=[P.pos.x,P.pos.z];g.searchT=8;toast('Businessman: "Excuse me! Kya kar rahi ho?" Guard ne sun liya.');}}});}
}

function missionTick(dt){
  if(M.type==='tail'&&!S.tail.met){const d=Math.hypot(P.pos.x-target.pos.x,P.pos.z-target.pos.z);
    if(d<=16){S.tail.t+=dt;S.tail.lost=0;}else{S.tail.lost+=dt;if(S.tail.lost>8)return failMission('Target nazar se nikal gaya. Peecha toot gaya.');}
    let seen=false;if(target.lookFor>0&&d<10){const a=Math.atan2(P.pos.x-target.pos.x,P.pos.z-target.pos.z);seen=Math.abs(angDiff(a,target.yaw))<.9&&!losBlocked(target.pos.x,target.pos.z,P.pos.x,P.pos.z);}
    const was=target.tailSus;target.tailSus=clamp(target.tailSus+(seen?(playerFlags().crowd>=2?16:45):-8)*dt,0,100);if(seen&&was<5)sfx.q();
    if(target.tailSus>=100)return failMission('Target ne tumhe pehchaan liya aur bheed mein gayab ho gaya.');
    if(S.tail.t>=S.tail.need){S.tail.met=true;meetGuy=npc({body:0x1d1d1d,suit:true,tie:0x2b4c8a,skin:0xc79a70,hair:0x111111,case:true},target.pos.x+2.4,target.pos.z+.6,'HALL');meetGuy.special=true;meetGuy.beh='idle';meetGuy.yaw=Math.atan2(target.pos.x-meetGuy.pos.x,target.pos.z-meetGuy.pos.z);meetGuy.g.rotation.y=meetGuy.yaw;
      sfx.ok();toast('Wo kisi se mil raha hai! 10 metre ke andar se photo lo.','good');}}
  if(M.type==='tail'&&target.icon){target.icon.sp.position.set(target.pos.x,2.3,target.pos.z);drawIcon(target.icon,target.tailSus>60?'search':'sus',target.tailSus);if(target.tailSus<3)target.icon.sp.visible=false;}
  if(M.event&&!S.evFired&&M.time-S.timeLeft>M.eventAt){S.evFired=true;fireEvent(M.event);}
}

async function caught(g){if(runNoArrest(g))return;if(S.phase!=='play')return;locked=true;S.phase='talk';
  if(M.code==='OP-001'&&!S.pardoned){S.pardoned=true;await say(g.name,'Ruko! Yahan kya kar rahi ho?');await say('','Tum ghabra ke kehti ho: "Sorry sir, raasta bhatak gayi. Washroom dhoondh rahi thi."',true);await say(g.name,'Ye staff ka area hai. Chalo bahar. Agli baar dikhi to seedha andar.');closeDlg();
    P.pos.set(-15,0,-2.5);for(const o of G){o.state='patrol';o.sus=0;o.path=null;}S.wanted=null;toast('Pehli galti maaf. Agli baar nahi.','info');S.phase='play';locked=false;return;}
  await say(g.name,'Ruko! Kahan bhaag rahi thi? Naam batao.');
  const serious=S.wanted===lookKey()&&(S.hold||playerFlags().illegal||S.done&&M.type!=='handoff');
  const ok=await legendQ(g.name,shuffle(['city','purpose']).slice(0,1));
  if(await judge(g,ok,serious)){await say(g.name,'Hmm. Theek hai, jaao. Aur dobara bhaagti dikhi to seedha andar.');closeDlg();CAREER.heat=Math.min(100,CAREER.heat+5);trace(`${g.name} ne roka, naam likh liya`);
    for(const o of G){o.state='patrol';o.sus=20;}S.phase='play';locked=false;return;}
  closeDlg();S.phase='over';await comic('caught',g.name);finish(false,g.name);}

function updTrail(dt,t){trailMesh.visible=S.phase==='play'&&!locked&&!(RUN&&RUN.phone&&!RUN.phone.loc);if(!trailMesh.visible)return;trailCD-=dt;const tg=trailTarget();

  trailPts[0]=[P.pos.x,P.pos.z];let k=0,need=1.3-((t*1.8)%1.1);
  for(let i=0;i<trailPts.length-1&&k<TRAIL_N;i++){const a=trailPts[i],b=trailPts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]);let d=need;
    while(d<L&&k<TRAIL_N){const f=d/L;m4.makeTranslation(a[0]+(b[0]-a[0])*f,.05,a[1]+(b[1]-a[1])*f);trailMesh.setMatrixAt(k++,m4);d+=1.1;}need=d-L;}
  trailMesh.count=Math.max(0,k-1);trailMesh.instanceMatrix.needsUpdate=true;}

/* ===================== title flyover & labels ===================== */
const FLY=[[0,30,38,0,0,4],[-30,12,22,-22,1,14],[-10,10,-1,-26,1,-16],[20,11,-1,2,1,-16],[-1.5,6.5,25,-1.5,1,15.5]];let flyT=0;
function flyCam(dt){flyT+=dt;const n=FLY.length-1,k=(flyT/4.2)%n,i=Math.floor(k),f=k-i,e=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2,a=FLY[i],b=FLY[i+1];
  camera.position.set(lerp(a[0],b[0],e),lerp(a[1],b[1],e),lerp(a[2],b[2],e));camera.lookAt(lerp(a[3],b[3],e),lerp(a[4],b[4],e),lerp(a[5],b[5],e));}
const LBL=[{t:'GUARD',c:'',p:()=>[G[0].pos.x,2.7,G[0].pos.z]},{t:'GUARD',c:'',p:()=>[G[3].pos.x,2.7,G[3].pos.z]},{t:'CCTV',c:'cam',p:()=>[CAMS[0].x,6.9,CAMS[0].z]},{t:'CCTV',c:'cam',p:()=>[CAMS[6].x,6.9,CAMS[6].z]},{t:'TUM',c:'tgt',p:()=>[P.pos.x,2.5,P.pos.z]},{t:'TARGET',c:'tgt',p:()=>{const o=objPos();return [o[0],1.9,o[1]];}}];
function drawLabels(){const box=$('#lbls');if(!box.children.length)box.innerHTML=LBL.map(l=>`<div class="lbl ${l.c}">${l.t}</div>`).join('');
  [...box.children].forEach((el,i)=>{const p=LBL[i].p();tv.set(p[0],p[1],p[2]).project(camera);const on=tv.z<1&&Math.abs(tv.x)<.92&&Math.abs(tv.y)<.9;el.style.display=on?'':'none';if(on){el.style.left=((tv.x+1)/2*innerWidth)+'px';el.style.top=((1-tv.y)/2*innerHeight)+'px';}});}
function splash(){$('#loading').hidden=true;S.phase='splash';const sp=$('#splash');sp.hidden=false;
  sp.addEventListener('pointerdown',async()=>{sp.hidden=true;$('#lbls').innerHTML='';auInit();AU.ctx&&AU.ctx.resume();S.phase='intro';await comic('cold');CAREER.introV=INTRO_V;saveCareer();const r=newRun();r.zone='airport';r.first=true;saveRun(r);location.href='cab.html';},{once:true});}

/* ===================== thriller tutorial (first mission only) ===================== */
let TS=null;
function banner(text,danger){const b=$('#banner');if(!text){b.hidden=true;document.body.classList.remove('banner');return;}text=gtx(text);b.textContent=text;b.className=danger?'danger':'';b.hidden=false;document.body.classList.add('banner');}
function tutorialStart(){TS={step:0,t:0,crowdT:0,cluster:[6.5,12]};
  for(let i=0;i<5;i++){const a=i*1.2566;const c=npc(paxOpts(),TS.cluster[0]+Math.cos(a)*1.15,TS.cluster[1]+Math.sin(a)*1.15,'HALL');c.beh='idle';c.special=true;c.yaw=a+Math.PI;c.g.rotation.y=c.yaw;}
  const g=G[0];g.pos.set(-8.5,0,13.5);g.yaw=Math.atan2(P.pos.x-g.pos.x,P.pos.z-g.pos.z);g.g.rotation.y=g.yaw;g.state='patrol';g.sus=0;S.wardrobe.add('tourist');}
function updTutorial(dt){if(!TS||S.phase!=='play')return;TS.t+=dt;const g=G[0];
  if(TS.step===0&&TS.t>2.2){TS.step=1;g.scripted=true;sfx.q();vib(60);banner('Guard ko shak hai! Bheed mein chhupo →',true);}
  else if(TS.step===1){const inC=Math.hypot(P.pos.x-TS.cluster[0],P.pos.z-TS.cluster[1])<2.1||playerFlags().crowd>=3;TS.crowdT=inC?TS.crowdT+dt:0;
    if(TS.crowdT>1.4&&g.sus<15){TS.step=2;g.scripted=false;g.state='search';g.searchT=30;g.lastSeen=[19,19];g.sus=40;g.path=null;S.wanted=lookKey();sfx.ok();toast('Bheed ne chhupa liya.','good');
      banner('Washroom mein look badlo →');}}
  else if(TS.step===2&&lookKey()!==S.startLook){TS.step=3;banner('Staff ke peeche STAFF ONLY mein ghuso →');CAREER.tutV=INTRO_V;saveCareer();}
  else if(TS.step===3&&region(P.pos.x,P.pos.z)==='STAFF'){TS.step=4;banner(S.wardrobe.has('staff')?'Peeli nazar se bacho. Laptop tak hari line →':'Left wall ke locker se staff jacket lo →');setTimeout(()=>{if(TS&&TS.step===4)banner(null);},7000);}}

/* ===================== camera & loop ===================== */
function updCam(dt){const tx=P.pos.x,tz=P.pos.z,ty=1.1;let dist=camDist;
  for(;dist>2.5;dist-=.5){const cx=tx-Math.sin(camYaw)*dist*Math.cos(camPitch),cz=tz-Math.cos(camYaw)*dist*Math.cos(camPitch);const inB=cz<-25.6?(cx>-8&&cx<34.3&&cz>-47.6):(cx>-35.6&&cx<35.6&&cz<23.6);if(inB&&!losBlocked(tx,tz,cx,cz))break;}
  const pos=new T.Vector3(tx-Math.sin(camYaw)*dist*Math.cos(camPitch),ty+dist*Math.sin(camPitch),tz-Math.cos(camYaw)*dist*Math.cos(camPitch));
  pos.y=Math.min(pos.y,7.6);camera.position.lerp(pos,Math.min(1,dt*7));camera.lookAt(tx,ty,tz);sun.position.set(tx+10,30,tz+14);sun.target.position.set(tx,0,tz);}
let clockT=0,boardT=0,frames=0,annT=0;
const clk=new T.Clock();
function frame(){
  let dt=Math.min(window.__dtcap||.05,clk.getDelta());if(slowT>0){slowT-=dt;dt*=.3;}clockT+=dt;const t=clockT;
  if(S.phase==='play'||S.phase==='talk'){
    if(S.phase==='play'){updPlayer(dt,t);updHold(dt);runTick(dt);updTutorial(dt);missionTick(dt);S.timeLeft-=dt;if(S.timeLeft<=0){finish(false);}
      if((annT+=dt)>48){annT=0;sfx.chime();toast(pick([`Announcement: ${MYGATE.code} ${MYGATE.dest} ki boarding Gate ${MYGATE.n} se jaldi shuru hogi.`,'Announcement: Kripya apna saamaan laawaaris na chhodein.','Announcement: Passenger Kapoor, please report to Gate 61.','Announcement: Security check pe line mein rahein.']),'info');}}
    updNPC(dt,t);updGuards(dt,t);updCams(dt);
    updDoor(staffDoor,dt,NPC.concat(G).some(n=>(n.staff||G.includes(n))&&nearDoor(staffDoor,n.pos.x,n.pos.z))||(S.look.outfit==='staff'&&nearDoor(staffDoor,P.pos.x,P.pos.z)));
    updDoor(airDoor,dt,NPC.concat(G).some(n=>(n.staff||G.includes(n))&&nearDoor(airDoor,n.pos.x,n.pos.z))||(S.look.outfit==='staff'&&nearDoor(airDoor,P.pos.x,P.pos.z)));
    updAct();
    $('#clock').textContent=clockS();$('#clock').classList.toggle('warn',S.timeLeft<60);
    const st=$('#state');st.className='chip '+worst;st.textContent=worst==='alert'?'ALERT!':worst==='sus'?'Suspicious':'Calm';
    if(AU.tens)AU.tens.gain.setTargetAtTime(worst==='alert'?.05:worst==='sus'?.02:0,AU.ctx.currentTime,.4);
    const ot=gtx(objText());if($('#objText').textContent!==ot)$('#objText').textContent=ot;
    if((frames++)%3===0)drawMap();
    if((boardT+=dt)>4){boardT=0;drawBoard();}
  } else if(S.phase==='splash'){updNPC(dt,t);updGuards(dt,t);updCams(dt);flyCam(dt);drawLabels();
  } else if(P){anim(P,dt,0,t);camYaw+=dt*.05;}
  updTrail(dt,t);
  if(P&&S.phase!=='splash')updCam(dt);
  composer.render();requestAnimationFrame(frame);
}

/* ===================== boot ===================== */
newMission();
setupNPC(M.comps.includes('crowd')?12:0);
setupGuards(M.comps.includes('guards'),M.comps.includes('face')?pick([0,1]):-1);
setupCams(M.comps.includes('cams'));
setupObjective();setupObjective2();
buildPlayer();drawBoard();
camera.position.set(0,8,30);
window.__ready=true;
window.__trace={fireEvent,get inf(){return inf;},get target(){return target;},get TS(){return TS;},S,M,G,CAMS,NPC,get P(){return P;},CAREER,start,doAct,get cur(){return current&&(typeof current.label==='function'?current.label():current.label);},tp:(x,z)=>{P.pos.set(x,0,z);}};
frame();
if(!(CAREER.introV>=INTRO_V))splash();else if(location.hash==='#play'||location.hash==='#story'||location.hash==='#bhaag'){$('#loading').hidden=true;auInit();start();}else hub();
</script>
